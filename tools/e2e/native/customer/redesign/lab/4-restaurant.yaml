# Customer redesign WP4 (#656): restaurant page (D5), certification sheet (D6), certificate
# viewer (D7). Built with EXPO_PUBLIC_HG_REDESIGN=1 against devworld (`make dev-reset`).
# amina (+15550100101, test code 000000) signs in, then each restaurant opens by deep link:
#   bismillah-grill  b0000000-0000-4000-8000-000000000208  certified, open
#   expiring-halal   b0000000-0000-4000-8000-000000000209  certified, expiring (dated badge)
#   expired-halal    b0000000-0000-4000-8000-000000000210  never listed: the not-available page
#   paused           b0000000-0000-4000-8000-000000000211  paused banner
appId: com.halalgoes.customer.dev
name: customer redesign, restaurant and certificate
env:
  PHONE: "5550100101"
  CODE: "000000"
  # Set to "true" once devworld can make storage refuse the first certificate link of a session
  # with 403, the way an expired presigned link answers (w0-request in PR; the API's 300 s TTL is
  # fixed, and a link loads in about a second, so the flow cannot wait one out).
  CERT_LINK_EXPIRED_ONCE: "false"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 90000
- tapOn:
    id: "SignIn-phone-field"
- inputText: ${PHONE}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the 6-digit code"
    timeout: 30000
- tapOn:
    id: "Code-input-cell-0"
- inputText: ${CODE}
- hideKeyboard
- tapOn: "Verify and continue"
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000

# J7: certified restaurant, certification sheet, certificate image.
- openLink: "hgcustomer://restaurant/b0000000-0000-4000-8000-000000000208"
- extendedWaitUntil:
    visible: "Bismillah Grill"
    timeout: 30000
- assertVisible: "Halal certified"
- assertVisible: "View certification"
- assertVisible: "Opening hours · today .*"
- runFlow:
    file: ../../../design-capture.yaml
    env:
      SHOT: design--discover-order--Restaurant-open
      APP_ID: com.halalgoes.customer.dev
- tapOn: "View certification"
- extendedWaitUntil:
    visible: "Halal certification"
    timeout: 15000
# The sheet's rows come from their own read; the board is drawn with them in.
- extendedWaitUntil:
    visible: "View certificate"
    timeout: 15000
- runFlow:
    file: ../../../design-capture.yaml
    env:
      SHOT: design--discover-order--Restaurant-cert-sheet
      APP_ID: com.halalgoes.customer.dev
- tapOn: "View certificate"
- extendedWaitUntil:
    visible: "Fit to screen"
    timeout: 30000
- assertVisible: "100%"
- assertVisible: "Certified by"
- assertVisible: "We log who opens certificates.*"
- runFlow:
    file: ../../../design-capture.yaml
    env:
      SHOT: design--discover-order--Cert-open
      APP_ID: com.halalgoes.customer.dev
- tapOn: "Zoom in"
- assertVisible: "150%"
- tapOn: "Zoom in"
- assertVisible: "200%"
- runFlow:
    file: ../../../design-capture.yaml
    env:
      SHOT: design--discover-order--Cert-zoomed
      APP_ID: com.halalgoes.customer.dev
- tapOn: "Fit to screen"
- assertVisible: "100%"
- back

# J7, link expired: the viewer says so and "Open again" mints a new link (manifest §6, WP4 b).
- runFlow:
    when:
      true: ${CERT_LINK_EXPIRED_ONCE == "true"}
    commands:
      - tapOn: "View certification"
      - extendedWaitUntil:
          visible: "Halal certification"
          timeout: 15000
      - tapOn: "View certificate"
      - extendedWaitUntil:
          visible: "This link has expired"
          timeout: 30000
      - assertVisible: "Certificate links last five minutes.*"
      - runFlow:
          file: ../../../design-capture.yaml
          env:
            SHOT: design--discover-order--Cert-link-expired
            APP_ID: com.halalgoes.customer.dev
      - tapOn: "Open again"
      - extendedWaitUntil:
          visible: "Fit to screen"
          timeout: 30000
      - assertVisible: "100%"
      - back

# Expiring: the badge carries its date.
- openLink: "hgcustomer://restaurant/b0000000-0000-4000-8000-000000000209"
- extendedWaitUntil:
    visible: "Bamyan Kebab House"
    timeout: 30000
- assertVisible: "expires .*"
- runFlow:
    file: ../../../design-capture.yaml
    env:
      SHOT: design--discover-order--Restaurant-expiring
      APP_ID: com.halalgoes.customer.dev

# Paused: the banner with its way forward.
- openLink: "hgcustomer://restaurant/b0000000-0000-4000-8000-000000000211"
- extendedWaitUntil:
    visible: "Galata Pide & Grill"
    timeout: 30000
- assertVisible: "Not taking orders right now"
- assertVisible: "Find an open restaurant"
- runFlow:
    file: ../../../design-capture.yaml
    env:
      SHOT: design--discover-order--Restaurant-paused
      APP_ID: com.halalgoes.customer.dev

# Expired: never listed, no halal reason given.
- openLink: "hgcustomer://restaurant/b0000000-0000-4000-8000-000000000210"
- extendedWaitUntil:
    visible: "This restaurant isn't available right now"
    timeout: 30000
- assertNotVisible: "Halal certified"
- runFlow:
    file: ../../../design-capture.yaml
    env:
      SHOT: design--discover-order--Restaurant-not-available
      APP_ID: com.halalgoes.customer.dev
- tapOn: "Back to Home"
