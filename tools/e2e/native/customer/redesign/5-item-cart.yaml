# Customer redesign WP5 (#656): item sheet (D9) and cart (C1, CC/Cart-edit-line).
# Built with EXPO_PUBLIC_HG_REDESIGN=1 against devworld (`make dev-reset`).
# amina (+15550100101, test code 000000) signs in, then (manifest §6, J8):
#   bismillah-grill  b0000000-0000-4000-8000-000000000208  Lamb Karahi: a required ABSOLUTE
#                    "Portion" group and a required "Spice level" add-on group (min 1)
#   expiring-halal   b0000000-0000-4000-8000-000000000209  a second restaurant: "Start a new cart?"
# then the cart: quantity, remove with Undo, clear with its confirm.
appId: com.halalgoes.customer.dev
name: customer redesign, item sheet and cart
env:
  PHONE: "+15550100101"
  CODE: "000000"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 90000
- tapOn:
    below: "Phone number .*"
    above: "Send code"
- inputText: ${PHONE}
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the code sent to.*"
    timeout: 30000
- tapOn:
    below: "Enter the code sent to.*"
    above: "Verify"
- inputText: ${CODE}
- tapOn: "Verify"
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000

# D9: a dish with a required size (ABSOLUTE, default chosen) and a required add-on group.
- openLink: "hgcustomer://restaurant/b0000000-0000-4000-8000-000000000208"
- extendedWaitUntil:
    visible: "Bismillah Grill"
    timeout: 30000
- scrollUntilVisible:
    element: "Lamb Karahi.*"
    direction: DOWN
    timeout: 20000
- tapOn: "Lamb Karahi.*"
- extendedWaitUntil:
    visible: "Portion \\(required\\).*"
    timeout: 15000
- assertVisible: "Allergens"
- takeScreenshot: redesign-wp5-01-item-ready
- scrollUntilVisible:
    element: "Choose at least 1 spice level to add this to your cart"
    direction: DOWN
    timeout: 10000
- takeScreenshot: redesign-wp5-02-item-required-addon
- tapOn: "Medium"
- tapOn: "Increase quantity"
- assertVisible: "Add 2 to cart"
- assertVisible: "0 of 140 characters used"
- takeScreenshot: redesign-wp5-03-item-options-chosen
- tapOn: "Add 2 to cart"
# A cart left from another restaurant asks first; start a new one.
- runFlow:
    when:
      visible: "Start a new cart\\?"
    commands:
      - tapOn: "Start a new cart"
- extendedWaitUntil:
    visible: "Added to your cart"
    timeout: 15000
- assertVisible: "View cart · 2 items · .*"
- takeScreenshot: redesign-wp5-04-item-added

# A second restaurant: "Start a new cart?" names the cart; Keep my cart keeps it.
- openLink: "hgcustomer://restaurant/b0000000-0000-4000-8000-000000000209"
- extendedWaitUntil:
    visible: "Bamyan Kebab House"
    timeout: 30000
- scrollUntilVisible:
    element: "Lentil Soup.*"
    direction: DOWN
    timeout: 20000
- tapOn: "Lentil Soup.*"
- extendedWaitUntil:
    visible: "Add to cart"
    timeout: 15000
- tapOn: "Add to cart"
- extendedWaitUntil:
    visible: "Start a new cart\\?"
    timeout: 15000
- assertVisible: "Your cart has 2 items from Bismillah Grill.*"
- takeScreenshot: redesign-wp5-05-different-restaurant
- tapOn: "Keep my cart"
- assertVisible: "Add to cart"
- tapOn: "Add to cart"
- extendedWaitUntil:
    visible: "Start a new cart\\?"
    timeout: 15000
- tapOn: "Start a new cart"
- extendedWaitUntil:
    visible: "Added to your cart"
    timeout: 15000
- assertVisible: "View cart · 1 item · .*"

# C1: the cart, priced for amina's address (same rows as checkout).
- tapOn: "View cart.*"
- extendedWaitUntil:
    visible: "Your cart"
    timeout: 15000
- extendedWaitUntil:
    visible: "Total"
    timeout: 30000
- assertVisible: "Service fee"
- assertVisible: "Go to checkout"
- takeScreenshot: redesign-wp5-06-cart-priced
# At 1 the minus is Remove; Undo puts the same line back.
- tapOn: "Remove Lentil Soup"
- extendedWaitUntil:
    visible: "Removed Lentil Soup"
    timeout: 15000
- takeScreenshot: redesign-wp5-07-cart-removed-undo
- tapOn: "Undo"
- extendedWaitUntil:
    visible: "Lentil Soup"
    timeout: 15000
- tapOn: "Increase quantity"
- extendedWaitUntil:
    visible: "Total"
    timeout: 30000
- takeScreenshot: redesign-wp5-08-cart-quantity
# Clear cart asks first.
- tapOn: "Clear cart"
- extendedWaitUntil:
    visible: "Clear your cart\\?"
    timeout: 10000
- takeScreenshot: redesign-wp5-09-cart-clear-confirm
- tapOn:
    text: "Clear cart"
    index: 1
- extendedWaitUntil:
    visible: "Your cart is empty"
    timeout: 15000
- takeScreenshot: redesign-wp5-10-cart-empty
