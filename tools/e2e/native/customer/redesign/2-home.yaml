# Customer redesign WP2 (#656), CI: Home, the address switcher and How we check (manifest D1, D2,
# D8) for the seeded world. Amina is still signed in from 1-sign-in.yaml. Her default address is
# Home · 1 Dundas St W; RESTAURANT (certified) is listed and EXPIRED_RESTAURANT (certificate
# expired) never is. Her order from the legacy flow may still be active, so Home can carry it.
# The device lab's version, with devworld's restaurants, is devworld/2-home.yaml.
# Env: RESTAURANT, EXPIRED_RESTAURANT.
appId: com.halalgoes.customer.dev
name: customer redesign, Home, address switcher and How we check
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "Home-title"
    timeout: 90000

# D1 Home, populated: the certified restaurant, never the expired one.
- assertVisible: "Deliver to"
- assertVisible: "Home · 1 Dundas St W"
- scrollUntilVisible:
    element: ${RESTAURANT}
    direction: DOWN
    timeout: 20000
- assertNotVisible: ${EXPIRED_RESTAURANT}
- takeScreenshot: redesign-wp2-01-home
- scrollUntilVisible:
    element:
      id: "Home-howWeCheck"
    direction: UP
    timeout: 20000

# D8 How we check
- tapOn:
    id: "Home-howWeCheck"
- extendedWaitUntil:
    visible: "What we check"
    timeout: 10000
- assertVisible: "All seven must pass.*"
- takeScreenshot: redesign-wp2-04-how-we-check
- back
- extendedWaitUntil:
    visible:
      id: "Home-title"
    timeout: 10000

# D2 Address switcher: session-only, never changes the default. Change is a word in the bar.
- tapOn:
    id: "Home-changeAddress"
- extendedWaitUntil:
    visible: "Home \\(default\\) · 1 Dundas St W"
    timeout: 10000
- assertVisible: "This changes where we deliver and which restaurants you see. Your default address stays the same."
- assertVisible: "Add address"
- takeScreenshot: redesign-wp2-05-switcher
- tapOn: "Home \\(default\\) · 1 Dundas St W"
- extendedWaitUntil:
    notVisible: "Add address"
    timeout: 10000
