# Customer redesign WP1 (#656), CI, journey J2: a new customer's first run. The stack runs with
# HG_ENV=local, so the reserved number +1 555 010 0141 takes the fixed test code 000000 and needs no
# code from the log. It has no account in the seeded world: verifyOtp creates one and answers
# PROFILE_CAPTURE, so Your details comes first, then (no address) the address step, then Home.
# It runs before 1-sign-in.yaml (name order), which clears its session and signs Amina in.
appId: com.halalgoes.customer.dev
name: customer redesign, first run (Your details, address step)
env:
  NEW_PHONE: "5550100141"
  TEST_CODE: "000000"
---
# The legacy rider app, left online by the cross-app flow, opens its offer screen over this app
# when an offer re-waves; stopped, it stays out of the way.
- stopApp: com.halalgoes.rider.dev
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 90000
- tapOn:
    id: "SignIn-phone-field"
- inputText: ${NEW_PHONE}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the 6-digit code"
    timeout: 30000
- tapOn:
    id: "Code-input-cell-0"
- inputText: ${TEST_CODE}
- hideKeyboard
- tapOn: "Verify and continue"

# S3 Your details: no tabs; Save validates on press.
- extendedWaitUntil:
    visible: "Tell us what to call you. Only your first name is needed to order."
    timeout: 30000
- assertNotVisible: "Account"
- takeScreenshot: redesign-wp1-10-your-details
# Empty the field first: until #774 the screen fills in the server's placeholder name.
- tapOn:
    id: "Profile-first-field"
- eraseText: 30
- hideKeyboard
- tapOn: "Save and continue"
- assertVisible: ".*Enter your first name\\..*"
- tapOn:
    id: "Profile-first-field"
- inputText: "Maryam"
- hideKeyboard
- tapOn: "Save and continue"

# S4 address step (no default address), then Home without one.
- extendedWaitUntil:
    visible: "Where should we deliver?"
    timeout: 30000
- assertVisible: "Add your address"
- takeScreenshot: redesign-wp1-12-address-step
- tapOn: "Not now"
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000
- takeScreenshot: redesign-wp1-13-home-not-now
