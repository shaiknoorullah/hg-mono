# Customer redesign WP0 (#656): the flagged shell. Built with EXPO_PUBLIC_HG_REDESIGN=1.
# Signed out it shows sign-in; amina (a reserved dev phone that accepts the test code 000000)
# signs in and lands on the four tabs: Home, Search, Orders, Account. No Alerts tab.
# Sign-in is WP1's redesigned screen (the Sign-in canvas copy, see 1-sign-in.yaml).
appId: com.halalgoes.customer.dev
name: customer redesign, shell and tabs
env:
  PHONE: "5550100101"
  CODE: "000000"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 90000
- takeScreenshot: redesign-wp0-01-signed-out
- tapOn:
    id: "SignIn-phone-field"
- inputText: ${PHONE}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the 6-digit code"
    timeout: 30000
- tapOn:
    id: "Code-input-field"
- inputText: ${CODE}
- hideKeyboard
- tapOn: "Verify and continue"
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000
- assertVisible: "Home"
- assertVisible: "Search"
- assertVisible: "Orders"
- assertNotVisible: "Alerts"
- takeScreenshot: redesign-wp0-02-home-tab
- tapOn: "Orders"
- takeScreenshot: redesign-wp0-03-orders-tab
- tapOn: "Account"
- takeScreenshot: redesign-wp0-04-account-tab
- tapOn: "Home"
- takeScreenshot: redesign-wp0-05-back-home
