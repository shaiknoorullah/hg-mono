# Customer redesign WP9 (#656), CI: the Orders tab (manifest T9) for the seeded world. Amina is
# still signed in from 1-sign-in.yaml. Her order from the legacy flow is still active (accepted,
# readied, offered to the rider), so Active orders lists it from RESTAURANT; if that flow placed
# nothing, the tab says so. Past orders, the row menu and the receipt need a finished delivery:
# devworld/9-orders.yaml, where the mission completes one first.
# Env: RESTAURANT.
appId: com.halalgoes.customer.dev
name: customer redesign, Orders tab
---
# The legacy rider app, left online by the cross-app flow, opens its offer screen over this app
# when an offer re-waves; stopped, it stays out of the way.
- stopApp: com.halalgoes.rider.dev
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Account"
    timeout: 90000
- tapOn: "Orders"
- extendedWaitUntil:
    visible: "(Active orders|Past orders|No orders yet)"
    timeout: 30000
- runFlow:
    when:
      visible: "Active orders"
    commands:
      - assertVisible: ".*${RESTAURANT}.*"
- assertNotVisible: "Order again"
- assertNotVisible: "Rate"
- takeScreenshot: redesign-wp9-01-orders
