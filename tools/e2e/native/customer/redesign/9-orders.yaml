# Customer redesign WP9 (#656): Orders history and receipt (manifest T9, T10; journey J18).
# Built with EXPO_PUBLIC_HG_REDESIGN=1 against devworld. The mission's setup completes one delivery
# for amina (`make dev-journey route=short speed=4x auto=all`) and runs `restaurant-rejected`, so her
# history holds a Completed order and a Not accepted one. amina (test code 000000) signs in, opens
# Orders, sees the completed order under Past orders, opens its row menu (View receipt and Get help with this order;
# no Order again, no Rate) and reads the receipt. Until WP1 merges, sign-in is the legacy screen.
appId: com.halalgoes.customer.dev
name: customer redesign, Orders history and receipt
env:
  PHONE: "+15550100101"
  CODE: "000000"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 90000
- tapOn:
    below: "Phone number .*"
    above: "Send code"
- inputText: ${PHONE}
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the code sent to.*"
    timeout: 30000
- tapOn:
    below: "Enter the code sent to.*"
    above: "Verify"
- inputText: ${CODE}
- tapOn: "Verify"
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000

# T9 Orders: Past orders lists the completed delivery and the rejected order.
- tapOn: "Orders"
- extendedWaitUntil:
    visible: "Past orders"
    timeout: 30000
- assertVisible: "Completed"
- assertVisible: ".*items · .*"
- assertNotVisible: "Order again"
- assertNotVisible: "Rate"
- takeScreenshot: redesign-wp9-01-orders
- runFlow:
    when:
      visible: "Not accepted"
    commands:
      - assertVisible: "Not charged"
- takeScreenshot: redesign-wp9-02-orders-money

# The completed order's row menu: View receipt and Get help only.
- tapOn:
    id: "OrderRow-.*-menu"
    below: "Completed"
- extendedWaitUntil:
    visible: "View receipt"
    timeout: 10000
- assertVisible: "Get help with this order"
- assertNotVisible: "Order again"
- takeScreenshot: redesign-wp9-03-row-menu
- tapOn: "View receipt"

# T10 Receipt: the frozen snapshot, charged, no download or share.
- extendedWaitUntil:
    visible: "Receipt number"
    timeout: 30000
- assertVisible: "Items subtotal"
- assertVisible: "Service fee"
- assertVisible: "Total"
- assertVisible: ".*, charged"
- assertNotVisible: "Download"
- assertNotVisible: "Share"
- takeScreenshot: redesign-wp9-04-receipt
- scrollUntilVisible:
    element: "Get help"
    direction: DOWN
- takeScreenshot: redesign-wp9-05-receipt-end
- back
- extendedWaitUntil:
    visible: "Past orders"
    timeout: 10000
- takeScreenshot: redesign-wp9-06-back-to-orders
