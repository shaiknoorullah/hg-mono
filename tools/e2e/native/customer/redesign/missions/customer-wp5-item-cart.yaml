id: customer-wp5-item-cart
app: customer
avd: hg_customer
api: devworld
# Build the dev APK from this branch with EXPO_PUBLIC_HG_REDESIGN=1.
setup: [ "make dev-reset" ]
flows: [ "tools/e2e/native/customer/redesign/5-item-cart.yaml" ]
reality:
  - theme: dark
  - font-scale: 2.0
  - network: offline
  - network: restore
# J8's multi-variant dish needs a devworld dish with two or more variant groups (w0-request): until
# then the flow uses Lamb Karahi (one group) and takes the quantity to 20 on it.
explore: >
  After the flow, in dark mode at 200% text, open bismillah-grill by deep link
  (`adb shell am start -W -a android.intent.action.VIEW -d "hgcustomer://restaurant/b0000000-0000-4000-8000-000000000208"`)
  and open Lamb Karahi. Screenshot the item sheet top to bottom: the header price is the chosen portion's own price
  (Half, then Full after you choose it), never a sum; "Spice level (required) · choose 1"; the Add button carries the
  reason until a spice level is ticked; the quantity stops at 20 with "Maximum 20" and "Add 20 to cart"; the special
  request counter reads "N/140" (TalkBack reads "N of 140 characters used", and "N characters left" from 20 left). Report clipped text, any target under 44 dp and any red halal state.
  Add the dish, then open the cart: confirm the lines read "Portion: Full (serves 3–4) · Spice level × 1"-style options,
  the totals read Items subtotal, Delivery fee, Service fee (even $0.00) and Total, and Go to checkout opens checkout.
  Tap Edit on the line: the sheet opens with the line's choices; change the spice level and Update item; the cart shows
  one line with the new choice (the API log shows addCartLine then removeCartLine). Network loss on the cart:
  `adb shell svc wifi disable && adb shell svc data disable`, pull the cart (reopen it from the restaurant's View cart),
  screenshot "You're offline. Showing your cart as of …", confirm the steppers, Edit and Clear cart are off and Go to
  checkout says "You're offline. Check out when you're back online."; with the dev clock override (useNow, +16 minutes)
  the halal badge is replaced by "We can't check the certification while you're offline." Restore with
  `adb shell svc wifi enable && adb shell svc data enable`. With a cart from bismillah-grill, open expiring-halal
  (…0209), add a dish, and screenshot "Start a new cart?" (it names Bismillah Grill and the item count). If a paused
  restaurant (…0211) dish is opened, the sheet says "has paused new orders" and Add stays off.
