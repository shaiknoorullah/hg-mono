# A design capture: the screenshot, and the view hierarchy and provenance beside it, for the
# design-diff harness (tools/design-diff/README.md, "Native boards"). From a flow:
#
#   - runFlow:
#       file: ../../design-capture.yaml      # relative to the flow
#       env:
#         SHOT: design--<area>--<Board>
#         APP_ID: com.halalgoes.customer.dev
#
# The hierarchy comes from tools/design-diff/android/capture-server.mjs, which run.sh starts for
# every flow. With it not running the screenshot is still taken and the flow still passes; the diff
# then reports the capture as NO LAYOUT, not as a pass.
#
# Maestro refuses a flow file with no config section ("Config Section Required"), subflows included,
# so the header stays even though the steps below never use appId.
appId: ${APP_ID}
---
- takeScreenshot: ${SHOT}
# The view hierarchy, which is the whole reason a capture can be measured rather than only looked
# at. It cannot come from `uiautomator dump`: that command is killed while a flow is in progress,
# and this runs inside a flow by definition. Measured, same device and run — `Killed`, `rc=137`
# during a flow, `rc=0` with nothing driving (https://github.com/shaiknoorullah/hg-mono/issues/1026).
#
# Maestro has the hierarchy anyway, and writes it to `screen-hierarchy/step-NNN-<command>.json` for
# a step that failed or was retried. An `optional` step that matches nothing is exactly that, and
# the flow still passes: the rider flows have done it three times a run for months, with
# `tapOn: { text: "While using the app", optional: true }`.
#
# So this looks for an element named after the capture, which nothing has. It never matches, the
# file it leaves behind is named after the capture, and run.sh picks it up by that name — not by
# the order the probes ran in, which would silently pair the wrong screen with a board the moment a
# capture was added in the middle of a flow.
- tapOn:
    id: ${SHOT}
    optional: true
- runScript:
    file: design-capture.js
    env:
      SHOT: ${SHOT}
      APP_ID: ${APP_ID}
