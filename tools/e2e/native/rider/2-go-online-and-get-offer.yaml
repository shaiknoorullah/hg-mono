# Rider app, part 2 of 2: sign in with the code, go online at the restaurant, and receive the
# dispatch offer for the order the customer placed and the restaurant marked ready.
# Env: CODE, LATITUDE, LONGITUDE, RESTAURANT.
#
# Dispatch offers a ready order to riders online within 3 km whose last position is under 90 s
# old, and each offer lasts 30 s, so the flow opens the offer screen right after going online.
appId: com.halalgoes.rider.dev
name: rider, go online, receive the offer
---
- tapOn:
    below: "Enter the code sent to.*"
    above: "Verify"
- inputText: ${CODE}
- tapOn: "Verify"
- extendedWaitUntil:
    visible: "Your shift"
    timeout: 60000
- takeScreenshot: rider-03-shift

- setLocation:
    latitude: ${LATITUDE}
    longitude: ${LONGITUDE}
- tapOn: "Availability — go online / offline"
- extendedWaitUntil:
    visible: "Available for deliveries"
    timeout: 30000
- takeScreenshot: rider-04-offline

- tapOn:
    id: "Switch"
# Location permission is granted at launch; this only answers the dialog if Android still asks.
- tapOn:
    text: "While using the app"
    optional: true
- extendedWaitUntil:
    visible: "You're online"
    timeout: 45000
- takeScreenshot: rider-05-online

- tapOn: "View current offer"
# The offer screen asks once when it opens; "Check again" asks again.
- repeat:
    while:
      notVisible: "Accept offer"
    times: 20
    commands:
      - tapOn:
          text: "Check again"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible: "Accept offer"
    timeout: 5000
- assertVisible: "${RESTAURANT}"
- takeScreenshot: rider-06-offer
