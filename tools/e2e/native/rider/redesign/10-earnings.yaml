# Rider redesign WP10: the Earnings tab. Sign in as rider-sim, open Earnings, step through the
# period control, open Earnings activity and a line, then Payouts and a payout, and come back
# with each screen's own back label. Built with EXPO_PUBLIC_HG_REDESIGN=1 (clear the Metro cache).
#
# Data: the mission runs one automatic delivery first (`make dev-journey ... auto=all`) so the
# ledger has a DELIVERY line. Payout rows need a payout run (no devworld scenario yet); the
# payout steps are optional so the flow passes on a rider with no payouts ("No payouts yet").
# Sign-in steps accept both the legacy and the WP1 copy (per-route fallback).
# Env: PHONE (default rider-sim +15550100151; dev codes for +1 555 010 01xx are always 000000).
appId: com.halalgoes.rider.dev
name: rider redesign, earnings
env:
  PHONE: "+15550100151"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Rider sign in|Sign in or apply to ride"
    timeout: 90000
- tapOn:
    text: "Phone number.*|Mobile number"
    optional: true
- tapOn:
    below: "Phone number .*"
    above: "Send code"
    optional: true
- inputText: ${PHONE}
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the code sent to.*|Enter your code"
    timeout: 30000
- tapOn:
    below: "Enter the code sent to.*"
    above: "Verify"
    optional: true
- inputText: "000000"
- tapOn:
    text: "Verify"
    optional: true
- extendedWaitUntil:
    visible: "Earnings"
    timeout: 60000

# R35 Earnings summary.
- tapOn: "Earnings"
- extendedWaitUntil:
    visible: "Right now"
    timeout: 30000
- assertVisible: "This week"
- assertVisible: "Unpaid balance"
- assertVisible: "Weekly, every Monday. No minimum."
- assertNotVisible: "Something went wrong on our side"
- takeScreenshot: rider-redesign-10-earnings-week
- tapOn: "Day"
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000
- tapOn: "Previous day"
- extendedWaitUntil:
    visible: "Yesterday"
    timeout: 15000
- tapOn: "Month"
- extendedWaitUntil:
    visible: "This month"
    timeout: 15000
- takeScreenshot: rider-redesign-10-earnings-month
- tapOn: "Week"

# R36 Earnings activity, R37 Earnings line.
- scrollUntilVisible:
    element: "Earnings activity"
    direction: DOWN
- tapOn: "Earnings activity"
- extendedWaitUntil:
    visible: "Earnings activity"
    timeout: 15000
- extendedWaitUntil:
    visible: "Delivery|No earnings activity yet"
    timeout: 15000
- takeScreenshot: rider-redesign-10-activity
- runFlow:
    when:
      visible: "Delivery"
    commands:
      - tapOn: "Delivery"
      - extendedWaitUntil:
          visible: "Delivery earnings"
          timeout: 15000
      - assertVisible: "How it was worked out"
      - assertVisible: "Total for this line"
      - assertVisible: "You get the full delivery fee the customer paid, plus every tip."
      - takeScreenshot: rider-redesign-10-line
      - tapOn: "Back to Earnings activity"
- tapOn: "Back to Earnings"

# R38 Payouts, R39 Payout.
- scrollUntilVisible:
    element: "Payouts"
    direction: UP
- tapOn: "Payouts"
- extendedWaitUntil:
    visible: "Past and upcoming payouts|No payouts yet"
    timeout: 15000
- takeScreenshot: rider-redesign-10-payouts
- runFlow:
    when:
      visible: "Past and upcoming payouts"
    commands:
      - tapOn:
          below: "Past and upcoming payouts"
      - extendedWaitUntil:
          visible: "Payout reference"
          timeout: 15000
      - takeScreenshot: rider-redesign-10-payout
      - tapOn: "Back to Payouts"
- tapOn: "Back to Earnings"
- assertVisible: "Right now"
