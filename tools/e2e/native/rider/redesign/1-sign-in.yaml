# Rider redesign WP1: sign in (R01 phone, R02 code, R03 opening) against devworld.
# Cold start → "Sign in or apply to ride" → airplane mode on Send code ("You are offline", nothing
# sent) → back online → code screen → a wrong code once shows the tries left → 000000 → the
# splash → Home (the three-tab shell).
#
# It signs in once for the whole run: the flows after it (in name order) keep this session
# (launchApp with stopApp: false). Built with EXPO_PUBLIC_HG_REDESIGN=1 and a cleared Metro cache.
# Env: PHONE (E.164) and CODE. In CI, run.sh passes the e2e world's rider and the code
# 1-ask-for-code.yaml asked for; asking again inside that open challenge returns the same one.
# The defaults are devworld's rider-sim, whose code is always 000000.
# Each default is written ${VAR || "…"}: a plain value under env: would override the -e values
# run.sh passes, and CI would sign in devworld's rider-sim, who is not a rider in the e2e world.
appId: com.halalgoes.rider.dev
name: rider redesign, sign in
env:
  PHONE: ${PHONE || "+15550100151"}
  WRONG_CODE: ${WRONG_CODE || "111111"}
  CODE: ${CODE || "000000"}
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in or apply to ride"
    timeout: 90000
- assertVisible: "Canadian numbers only (+1)."
- runFlow:
    file: ../../design-capture.yaml
    env:
      SHOT: design--sign-in-onboarding--Main
      APP_ID: com.halalgoes.rider.dev
# The boards draw the number ending 0134 (+1 416 555 0134, a 555-01xx fictional number), so the
# captures up to the wrong-code board use it. Nothing signs in on it: "Use a different number"
# goes back and the e2e world's rider signs in below.
- tapOn:
    id: "phone-field"
- inputText: "4165550134"
- hideKeyboard

# Offline: Send code sends nothing and says so (SO SignIn-Phone-Offline).
- setAirplaneMode: enabled
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "You are offline"
    timeout: 20000
- assertVisible: "Nothing was sent. Connect to mobile data or Wi-Fi, then try again."
- runFlow:
    file: ../../design-capture.yaml
    env:
      SHOT: design--sign-in-onboarding--SignIn-Phone-Offline
      APP_ID: com.halalgoes.rider.dev
- setAirplaneMode: disabled
# The screen re-reads PublicConfig every 5 s while offline; its answer clears the alert.
- extendedWaitUntil:
    notVisible: "You are offline"
    timeout: 60000

- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter your code"
    timeout: 30000
- assertVisible: "We sent a 6-digit code to the number ending 0134\\."
# Two digits typed, as the board draws them (48).
- tapOn:
    id: "code-cell-0"
- inputText: "48"
- runFlow:
    file: ../../design-capture.yaml
    env:
      SHOT: design--sign-in-onboarding--SignIn-Code
      APP_ID: com.halalgoes.rider.dev
# Three wrong codes leave two tries; each clears the field and says how many are left
# (SO SignIn-Code-Incorrect draws "2 tries left").
- eraseText: 2
- inputText: ${WRONG_CODE}
- extendedWaitUntil:
    visible: ".*That code is not right\\. You have 4 tries left\\..*"
    timeout: 30000
- tapOn:
    id: "code-cell-0"
- inputText: ${WRONG_CODE}
- extendedWaitUntil:
    visible: ".*That code is not right\\. You have 3 tries left\\..*"
    timeout: 30000
- tapOn:
    id: "code-cell-0"
- inputText: ${WRONG_CODE}
- extendedWaitUntil:
    visible: ".*That code is not right\\. You have 2 tries left\\..*"
    timeout: 30000
- runFlow:
    file: ../../design-capture.yaml
    env:
      SHOT: design--sign-in-onboarding--SignIn-Code-Incorrect
      APP_ID: com.halalgoes.rider.dev
# Now the e2e world's rider.
- tapOn:
    id: "different-number"
- extendedWaitUntil:
    visible: "Sign in or apply to ride"
    timeout: 15000
- tapOn:
    id: "phone-field"
- eraseText: 20
- inputText: ${PHONE}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter your code"
    timeout: 30000
# The right code: the 6th digit checks it by itself.
- tapOn:
    id: "code-cell-0"
- inputText: ${CODE}
- extendedWaitUntil:
    visible: "Earnings"
    timeout: 60000
- assertVisible: "Account"
- takeScreenshot: rider-wp1-05-home

# The redesigned shell: three tabs, Home, Earnings, Account (rider decision "Rider navigation").
- tapOn:
    id: "tab-earnings"
- takeScreenshot: rider-redesign-02-earnings-tab
- tapOn:
    id: "tab-account"
- takeScreenshot: rider-redesign-03-account-tab
- tapOn:
    id: "tab-home"
- assertVisible: "Earnings"
