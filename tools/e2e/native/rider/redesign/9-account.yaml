# Rider redesign WP9: the Account tab. Open Account › Payouts, come back, sign out, and land on
# sign-in. It signs out, so it runs last (name order). Built with EXPO_PUBLIC_HG_REDESIGN=1 and a
# cleared Metro cache (EXPO_PUBLIC_* is inlined at transform time).
appId: com.halalgoes.rider.dev
name: rider redesign, account and payouts
---
# Signed in by 1-sign-in.yaml, which runs before this flow (flows run in name order). The app
# keeps running between flows, so its in-memory session holds. Run alone, run 1-sign-in.yaml first.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Earnings"
    timeout: 30000
- tapOn:
    id: "tab-home"

# Account overview (PA/Account-Overview).
- tapOn:
    id: "tab-account"
- extendedWaitUntil:
    visible: "Your details"
    timeout: 30000
- assertVisible: "Terms and privacy"
- assertVisible: "Delete account"
- takeScreenshot: rider-wp9-01-account

# Account › Payouts (PA/Account-Payouts*): whatever Stripe's state, never the error.
- tapOn:
    id: "row-payouts"
- extendedWaitUntil:
    visible: "Payouts on|Payouts are not set up|Stripe .*|Checking with Stripe"
    timeout: 30000
- assertNotVisible: "We couldn't check your payouts"
- takeScreenshot: rider-wp9-02-payouts
- back
- extendedWaitUntil:
    visible: "Your details"
    timeout: 15000

# Sign out (PA/Account-SignOut): the confirm, then the sign-in screen.
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "Sign out\\?|You are on a delivery"
    timeout: 10000
- takeScreenshot: rider-wp9-03-sign-out-confirm
- tapOn:
    id: "sign-out-confirm"
- extendedWaitUntil:
    visible: "Rider sign in|Sign in or apply to ride"
    timeout: 30000
- assertNotVisible: "You were signed out.*"
- takeScreenshot: rider-wp9-04-signed-out
