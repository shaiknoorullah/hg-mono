<!-- @dsCard group="Spacing" viewport="700x190" name="Density" subtitle="Set once at the theme root; components never hard-code 16" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Density</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-base);font-family:var(--font-ui);height:190px;box-sizing:border-box;overflow:hidden}
.row{display:flex;gap:10px}.col{display:grid;gap:8px}
.k{font-size:var(--type-label-sm-size);letter-spacing:var(--type-label-sm-tracking);font-weight:600;color:var(--text-tertiary)}
.note{font-size:11px;line-height:1.4;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-size:10px}
</style></head><body>
<div class="row" style="gap:14px">

  <div style="flex:1;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:var(--radius-lg);padding:16px">
    <div class="k">comfortable</div>
    <div class="mono" style="margin:2px 0 8px">row 64 · pad 16 · gutter 16</div>
    <div style="height:52px;background:var(--surface-sunken);border-radius:var(--radius-sm);margin-bottom:8px"></div><div style="height:52px;background:var(--surface-sunken);border-radius:var(--radius-sm);margin-bottom:8px"></div>
    <div class="note">customer app</div>
  </div>
  <div style="flex:1;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:var(--radius-lg);padding:12px">
    <div class="k">compact</div>
    <div class="mono" style="margin:2px 0 8px">row 44 · pad 12 · gutter 12</div>
    <div style="height:32px;background:var(--surface-sunken);border-radius:var(--radius-sm);margin-bottom:6px"></div><div style="height:32px;background:var(--surface-sunken);border-radius:var(--radius-sm);margin-bottom:6px"></div>
    <div class="note">admin tables</div>
  </div>
  <div style="flex:1;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:var(--radius-lg);padding:20px">
    <div class="k">roomy</div>
    <div class="mono" style="margin:2px 0 8px">row 72 · pad 20 · gutter 20</div>
    <div style="height:60px;background:var(--surface-sunken);border-radius:var(--radius-sm);margin-bottom:10px"></div><div style="height:60px;background:var(--surface-sunken);border-radius:var(--radius-sm);margin-bottom:10px"></div>
    <div class="note">rider app</div>
  </div>
</div></body></html>
