<!-- @dsCard group="Type" viewport="700x180" name="Tabular numerals" subtitle="Mandatory on Price, Countdown, StatusTimeline, DataTable, Rating" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Numerals</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-base);font-family:var(--font-ui);height:180px;box-sizing:border-box;overflow:hidden}
.row{display:flex;gap:8px}.col{display:grid;gap:8px}
.sw{display:grid;align-content:end;border-radius:var(--radius-sm);padding:6px;min-height:64px;font-size:10px;font-weight:600;line-height:1.25}
.hex{font-family:var(--font-mono);font-size:9px;opacity:.85;letter-spacing:0}
.k{font-size:var(--type-label-sm-size);letter-spacing:var(--type-label-sm-tracking);font-weight:600;color:var(--text-tertiary)}
.note{font-size:11px;line-height:1.4;color:var(--text-tertiary)}
</style></head><body>
<div class="row" style="gap:36px">
  <div><div class="k">tabular — columns align</div><div style="font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;line-height:1.5">$8.99<br>$12.49<br>$141.00</div></div>
  <div><div class="k">proportional — do not use for money</div><div style="font-size:20px;font-weight:600;line-height:1.5;color:var(--text-tertiary)">$8.99<br>$12.49<br>$141.00</div></div>
  <div><div class="k">countdown</div><div style="font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;letter-spacing:-.01em">0:38</div><p class="note" style="max-width:220px">A ticking digit must not shift the layout — and a deadline never eases.</p></div>
</div></body></html>
