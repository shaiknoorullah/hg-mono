<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation" subtitle="Light themes use shadow; dark themes step the surface instead" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-base);font-family:var(--font-ui);height:190px;box-sizing:border-box;overflow:hidden}
.row{display:flex;gap:10px}.col{display:grid;gap:8px}
.k{font-size:var(--type-label-sm-size);letter-spacing:var(--type-label-sm-tracking);font-weight:600;color:var(--text-tertiary)}
.note{font-size:11px;line-height:1.4;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-size:10px}
</style></head><body>
<div class="row" style="gap:14px;align-items:flex-start;padding:6px 0 0">

  <div style="flex:1"><div style="height:76px;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--elev-1)"></div><div class="k" style="margin-top:10px">elev 1</div><div class="note">cards</div></div>
  <div style="flex:1"><div style="height:76px;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--elev-2)"></div><div class="k" style="margin-top:10px">elev 2</div><div class="note">hover, dropdown anchor</div></div>
  <div style="flex:1"><div style="height:76px;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--elev-3)"></div><div class="k" style="margin-top:10px">elev 3</div><div class="note">menus, toasts</div></div>
  <div style="flex:1"><div style="height:76px;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--elev-4)"></div><div class="k" style="margin-top:10px">elev 4</div><div class="note">dialogs, sheets</div></div>
  <div style="flex:1"><div style="height:76px;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--elev-sticky)"></div><div class="k" style="margin-top:10px">elev sticky</div><div class="note">cart bar — points up</div></div>
</div></body></html>
