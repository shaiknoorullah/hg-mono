<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="md 12 is the default and the halal seal; full would read as a tag" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-base);font-family:var(--font-ui);height:170px;box-sizing:border-box;overflow:hidden}
.row{display:flex;gap:10px}.col{display:grid;gap:8px}
.k{font-size:var(--type-label-sm-size);letter-spacing:var(--type-label-sm-tracking);font-weight:600;color:var(--text-tertiary)}
.note{font-size:11px;line-height:1.4;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-size:10px}
</style></head><body>
<div class="row">

  <div style="flex:1"><div style="height:74px;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:4px"></div><div class="k" style="margin-top:6px">xs</div><div class="mono">4px</div></div>
  <div style="flex:1"><div style="height:74px;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:8px"></div><div class="k" style="margin-top:6px">sm</div><div class="mono">8px</div></div>
  <div style="flex:1"><div style="height:74px;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:12px"></div><div class="k" style="margin-top:6px">md</div><div class="mono">12px</div></div>
  <div style="flex:1"><div style="height:74px;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:16px"></div><div class="k" style="margin-top:6px">lg</div><div class="mono">16px</div></div>
  <div style="flex:1"><div style="height:74px;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:20px"></div><div class="k" style="margin-top:6px">xl</div><div class="mono">20px</div></div>
  <div style="flex:1"><div style="height:74px;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:24px"></div><div class="k" style="margin-top:6px">2xl</div><div class="mono">24px</div></div>
  <div style="flex:1"><div style="height:74px;background:var(--surface-raised);border:1px solid var(--border-decorative);border-radius:9999px"></div><div class="k" style="margin-top:6px">full</div><div class="mono">9999</div></div>
</div>
<p class="note" style="margin:8px 0 0">halalgoes.com uses this same scale; there is no separate marketing set and no 11px radius. Marketing document cards are lg, 16px.</p>
</body></html>
