<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Targets</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-base);font-family:var(--font-ui);height:190px;box-sizing:border-box;overflow:hidden}
.row{display:flex;gap:10px}.col{display:grid;gap:8px}
.k{font-size:var(--type-label-sm-size);letter-spacing:var(--type-label-sm-tracking);font-weight:600;color:var(--text-tertiary)}
.note{font-size:11px;line-height:1.4;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-size:10px}
</style></head><body>
<div class="row" style="gap:12px;align-items:flex-end">

  <div style="flex:1"><div style="height:44px;display:grid;place-items:center;background:var(--action-primary);color:var(--text-on-brand);border-radius:var(--radius-md);font-size:15px;font-weight:600">44px</div><div class="k" style="margin-top:8px">target.min</div><div class="note">WCAG 2.2 AAA floor, everywhere</div></div>
  <div style="flex:1"><div style="height:56px;display:grid;place-items:center;background:var(--action-primary);color:var(--text-on-brand);border-radius:var(--radius-md);font-size:15px;font-weight:600">56px</div><div class="k" style="margin-top:8px">target.field</div><div class="note">Rider: gloved thumb, one hand</div></div>
  <div style="flex:1"><div style="height:72px;display:grid;place-items:center;background:var(--action-primary);color:var(--text-on-brand);border-radius:var(--radius-md);font-size:15px;font-weight:600">72px</div><div class="k" style="margin-top:8px">target.criticalField</div><div class="note">Rider Accept / Decline and restaurant Accept order: irreversible, under time pressure</div></div>
</div>
<p class="note" style="margin:10px 0 0">Minimum gap between adjacent targets: 8px (target.spacing).</p>
</body></html>
