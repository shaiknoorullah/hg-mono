<!-- @dsCard group="Colors" viewport="700x150" name="Neutral — warm cream & ink" subtitle="50 is the canvas, 0 is the card, 900 is the ink" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Neutral</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-base);font-family:var(--font-ui);height:150px;box-sizing:border-box;overflow:hidden}
.row{display:flex;gap:8px}.col{display:grid;gap:8px}
.sw{display:grid;align-content:end;border-radius:var(--radius-sm);padding:6px;min-height:64px;font-size:10px;font-weight:600;line-height:1.25}
.hex{font-family:var(--font-mono);font-size:9px;opacity:.85;letter-spacing:0}
.k{font-size:var(--type-label-sm-size);letter-spacing:var(--type-label-sm-tracking);font-weight:600;color:var(--text-tertiary)}
.note{font-size:11px;line-height:1.4;color:var(--text-tertiary)}
</style></head><body>
<div class="row"><div class="sw" style="background:#FFFFFF;color:#232323;flex:1"><div>0</div><div class="hex">#FFFFFF</div></div><div class="sw" style="background:#FFFAEA;color:#232323;flex:1"><div>50</div><div class="hex">#FFFAEA</div></div><div class="sw" style="background:#F6EFDD;color:#232323;flex:1"><div>100</div><div class="hex">#F6EFDD</div></div><div class="sw" style="background:#E6E0D4;color:#232323;flex:1"><div>200</div><div class="hex">#E6E0D4</div></div><div class="sw" style="background:#D8D0BF;color:#232323;flex:1"><div>300</div><div class="hex">#D8D0BF</div></div><div class="sw" style="background:#B9B0A0;color:#232323;flex:1"><div>400</div><div class="hex">#B9B0A0</div></div><div class="sw" style="background:#8B8578;color:#fff;flex:1"><div>500</div><div class="hex">#8B8578</div></div><div class="sw" style="background:#6E7C77;color:#fff;flex:1"><div>600</div><div class="hex">#6E7C77</div></div><div class="sw" style="background:#4A4E48;color:#fff;flex:1"><div>700</div><div class="hex">#4A4E48</div></div><div class="sw" style="background:#33352F;color:#fff;flex:1"><div>800</div><div class="hex">#33352F</div></div><div class="sw" style="background:#232323;color:#fff;flex:1"><div>900</div><div class="hex">#232323</div></div><div class="sw" style="background:#171717;color:#fff;flex:1"><div>950</div><div class="hex">#171717</div></div></div>
<p class="note" style="margin:10px 0 0">500 is the lowest colour reaching 3:1 on cream — the floor for interactive borders and placeholders. 1000 (#000) is a shadow colour only.</p>
</body></html>
