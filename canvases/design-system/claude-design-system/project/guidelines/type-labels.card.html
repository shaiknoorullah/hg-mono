<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Labels</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-base);font-family:var(--font-ui);height:210px;box-sizing:border-box;overflow:hidden}
.row{display:flex;gap:8px}.col{display:grid;gap:8px}
.sw{display:grid;align-content:end;border-radius:var(--radius-sm);padding:6px;min-height:64px;font-size:10px;font-weight:600;line-height:1.25}
.hex{font-family:var(--font-mono);font-size:9px;opacity:.85;letter-spacing:0}
.k{font-size:var(--type-label-sm-size);letter-spacing:var(--type-label-sm-tracking);font-weight:600;color:var(--text-tertiary)}
.note{font-size:11px;line-height:1.4;color:var(--text-tertiary)}
</style></head><body>
<div class="col" style="gap:10px">
  <div><div class="k">label.lg · 15 / 18 / 600</div><div style="font-size:15px;font-weight:600">Add to order</div></div>
  <div><div class="k">label.md · 13 / 16 / 600 / 0.01em</div><div style="font-size:13px;font-weight:600;letter-spacing:.01em">Certifying body</div></div>
  <div><div class="k">label.sm · 11 / 14 / 600 / 0.04em — badge + seal</div><div style="font-size:11px;font-weight:600;letter-spacing:.04em;color:#0C4A2A">Halal certified</div></div>
  <div><div class="k">caption · 12 / 17 / 400</div><div style="font-size:12px;line-height:17px;color:var(--text-tertiary)">Certification verified by HalalGoes on 4 September 2026. HalalGoes does not itself certify food.</div></div>
</div></body></html>
