<!-- @dsCard group="Data" height=470 subtitle="Caption, sortable headers, selection, row actions; every state keeps its header" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>DataTable</title>
<style>body{margin:0;padding:16px;background:var(--surface-base);color:var(--text-primary);font-family:var(--font-ui)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:grid;gap:12px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.lbl{font-size:var(--type-label-sm-size);letter-spacing:var(--type-label-sm-tracking);font-weight:var(--font-weight-semibold);color:var(--text-tertiary);min-inline-size:88px}
.stage{position:relative;block-size:200px;border:1px dashed var(--border-decorative);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-sunken)}</style>
</head><body><div id="root"></div>
<script>
(function () {
  var h = React.createElement, F = React.Fragment, DS = window.HalalGoesDesignSystem_d11a47;
  function L(t) { return h('span', { className: 'lbl' }, t); }

  var cols = [
    { key: 'id', label: 'Order', mono: true },
    { key: 'restaurant', label: 'Restaurant', sortable: true },
    { key: 'state', label: 'State', render: function (r) { return h(DS.Badge, { size: 'sm' }, r.state); } },
    { key: 'total', label: 'Total', align: 'end', numeric: true, sortable: true, render: function (r) { return h(DS.Price, { cents: r.total, size: 'sm' }); } }];
  var rows = [{ id: 'HG-10482', restaurant: 'Zaytoun Grill', state: 'Preparing', total: 4187 }, { id: 'HG-10481', restaurant: 'Karahi House', state: 'On the way', total: 2650 }, { id: 'HG-10479', restaurant: 'Anatolia Doner', state: 'Delivered', total: 1899 }];
  function Demo() {
    var s = React.useState({ key: 'total', direction: 'descending' }), sort = s[0], setSort = s[1];
    var sel = React.useState(['HG-10481']), selection = sel[0], setSel = sel[1];
    var actions = function (r) { return [{ key: 'open', label: 'Open order' }, { key: 'refund', label: 'Issue refund' }, { type: 'separator' }, { key: 'cancel', label: 'Cancel order', destructive: true }]; };
    return h('div', { className: 'col' },
      h(DS.DataTable, { caption: 'Live orders', columns: cols, rows: rows, sort: sort, onSortChange: setSort, selection: selection, onSelectionChange: setSel, rowActions: actions, rowLabel: function (r) { return 'order ' + r.id; }, onRowActivate: function () {}, hasMore: true, onLoadMore: function () {} }),
      h('div', { className: 'g2' },
        h(DS.DataTable, { caption: 'Loading', columns: cols, rows: [], status: 'loading' }),
        h(DS.DataTable, { caption: 'Filtered to nothing', columns: cols, rows: [], filtersActive: true, onClearFilters: function () {} }),
        h(DS.DataTable, { caption: 'Error', columns: cols, rows: [], status: 'error', onRetry: function () {} })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
})();
</script></body></html>
