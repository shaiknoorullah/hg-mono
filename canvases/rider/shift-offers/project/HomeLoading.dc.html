<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home loading</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/tokens.css">
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/components/bundle.css">
<script src="ds/halalgoesdesignsystem-d11a47/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
[data-rider]{font-family:var(--font-ui)}
.offer-chrome{background:var(--surface-raised)}
[data-theme="dark"] .offer-chrome,[data-theme="dark"].offer-chrome{background:var(--surface-chrome)}
</style>
</helmet>
<div data-rider="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--surface-base); color: var(--text-primary)">
<x-import component-from-global-scope="HalalGoesDesignSystem_d11a47.AppBar" tone="field" title="Home" loading="{{yes}}"></x-import>
<main aria-busy="true" style="flex: 1 1 auto; overflow-y: auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5)">
<span style="align-self: flex-start; font: var(--text-type-mono-md); padding: 0 var(--space-1); border-radius: var(--radius-xs); border: 1px dashed var(--border-strong); color: var(--text-secondary)">Proposed component: Skeleton · same shape as the loaded screen</span>
<div style="display: flex; flex-direction: column; gap: var(--space-2)">
<div style="height: 28px; width: 62%; border-radius: var(--radius-sm); background: var(--surface-raised)"></div>
<div style="height: 18px; width: 92%; border-radius: var(--radius-sm); background: var(--surface-raised)"></div>
<div style="height: 18px; width: 74%; border-radius: var(--radius-sm); background: var(--surface-raised)"></div>
</div>
<div style="border: 1px solid var(--border-decorative); border-radius: var(--radius-lg); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3)">
<div style="height: 16px; width: 60px; border-radius: var(--radius-sm); background: var(--surface-raised)"></div>
<x-import component-from-global-scope="HalalGoesDesignSystem_d11a47.Price" size="xl" loading="{{yes}}"></x-import>
<div style="height: 20px; width: 70%; border-radius: var(--radius-sm); background: var(--surface-raised)"></div>
</div>
<div style="height: 180px; border-radius: var(--radius-md); background: var(--surface-raised)"></div>
</main>
<footer style="flex: 0 0 auto; padding: var(--space-3) var(--space-5) var(--space-5); border-top: 1px solid var(--border-decorative); background: var(--surface-base); display: flex; flex-direction: column; gap: var(--space-2)">
<div style="height: 72px; border-radius: var(--radius-md); background: var(--surface-raised)"></div>
</footer>
<x-import component-from-global-scope="HalalGoesDesignSystem_d11a47.BottomNav" tone="field" label="Rider" active="home" items="{{tabs}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return { theme: theme, yes: true,
      tabs: [{ key: 'home', label: 'Home', icon: 'home' }, { key: 'earnings', label: 'Earnings', icon: 'orders' }, { key: 'account', label: 'Account', icon: 'profile' }] };
  }
}
</script>
</body>
</html>
