<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restoring your delivery</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/tokens.css">
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/components/bundle.css">
<script src="ds/halalgoesdesignsystem-d11a47/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
[data-rider]{font-family:var(--font-ui)}
.offer-chrome{background:var(--surface-raised)}
[data-theme="dark"] .offer-chrome,[data-theme="dark"].offer-chrome{background:var(--surface-chrome)}
</style>
</helmet>
<div data-rider="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--surface-base); color: var(--text-primary)">
<x-import component-from-global-scope="HalalGoesDesignSystem_d11a47.AppBar" tone="field" title="Delivery" loading="{{yes}}"></x-import>
<main aria-busy="true" style="flex: 1 1 auto; padding: var(--space-6) var(--space-5); display: flex; flex-direction: column; gap: var(--space-4)">
<span style="align-self: flex-start; font: var(--text-type-mono-md); padding: 0 var(--space-1); border-radius: var(--radius-xs); border: 1px dashed var(--border-strong); color: var(--text-secondary)">Cold start · next_route ACTIVE_DELIVERY · replay queued steps · socket resume {after_seq}</span>
<h2 style="margin: 0; font-size: var(--type-heading-xl-size); font-weight: var(--type-heading-xl-weight); letter-spacing: var(--type-heading-xl-tracking); line-height: 1.25">Picking up where you left off</h2>
<p style="margin: 0; font-size: var(--type-body-lg-size); line-height: 1.5">We're loading your delivery and sending 1 saved step. This takes a moment.</p>
<span style="align-self: flex-start; font: var(--text-type-mono-md); padding: 0 var(--space-1); border-radius: var(--radius-xs); border: 1px dashed var(--border-strong); color: var(--text-secondary)">Proposed component: Skeleton</span>
<div style="height: 120px; border-radius: var(--radius-md); background: var(--surface-raised)"></div>
<div style="height: 28px; width: 70%; border-radius: var(--radius-sm); background: var(--surface-raised)"></div>
<div style="height: 20px; width: 88%; border-radius: var(--radius-sm); background: var(--surface-raised)"></div>
<div style="height: 64px; border-radius: var(--radius-md); background: var(--surface-raised)"></div>
</main>
<footer style="flex: 0 0 auto; padding: var(--space-3) var(--space-5) var(--space-5); border-top: 1px solid var(--border-decorative); background: var(--surface-base)">
<div style="height: 60px; border-radius: var(--radius-md); background: var(--surface-raised)"></div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark', yes: true }; }
}
</script>
</body>
</html>
