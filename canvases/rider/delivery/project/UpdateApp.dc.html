<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Update the app</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/tokens.css">
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/components/bundle.css">
<script src="ds/halalgoesdesignsystem-d11a47/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
[data-rider]{font-family:var(--font-ui)}
.offer-chrome{background:var(--surface-raised)}
[data-theme="dark"] .offer-chrome,[data-theme="dark"].offer-chrome{background:var(--surface-chrome)}
</style>
</helmet>
<div data-rider="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--surface-base); color: var(--text-primary)">
<main style="flex: 1 1 auto; overflow-y: auto; padding: var(--space-10) var(--space-5) var(--space-5); display: flex; flex-direction: column; justify-content: center; gap: var(--space-4)">
<span style="align-self: flex-start; font: var(--text-type-mono-md); padding: 0 var(--space-1); border-radius: var(--radius-xs); border: 1px dashed var(--border-strong); color: var(--text-secondary)">next_route APP_UPDATE_REQUIRED, an unknown next_route, or an unknown enum value</span>
<x-import component-from-global-scope="HalalGoesDesignSystem_d11a47.Icon" name="refresh" size="2xl"></x-import>
<h1 style="margin: 0; font-size: var(--type-heading-xl-size); font-weight: var(--type-heading-xl-weight); letter-spacing: var(--type-heading-xl-tracking); line-height: 1.25">Update HalalGoes to keep delivering</h1>
<p style="margin: 0; font-size: var(--type-body-lg-size); line-height: 1.5">This version can't show everything we're sending it. Updating takes about a minute.</p>
<p style="margin: 0; font-size: var(--type-body-lg-size); line-height: 1.5">If you're on a delivery, it stays yours while you update.</p>
</main>
<footer style="flex: 0 0 auto; padding: var(--space-3) var(--space-5) var(--space-5); border-top: 1px solid var(--border-decorative); background: var(--surface-base); display: flex; flex-direction: column; gap: var(--space-2)">
<x-import component-from-global-scope="HalalGoesDesignSystem_d11a47.Button" variant="primary" size="xl" full-width="{{yes}}">Update the app</x-import>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'dark', yes: true }; }
}
</script>
</body>
</html>
