<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracking, loading</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/tokens.css">
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/components/bundle.css">
<link rel="stylesheet" href="hg-roles.css">
<script src="ds/halalgoesdesignsystem-d11a47/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--surface-base)}
</style>
</helmet>
<div aria-busy="true" style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-base); color: var(--text-primary); font-family: var(--font-ui)">
<x-import component-from-global-scope="HalalGoesDesignSystem_d11a47.AppBar" title-is-page-heading="{{ no }}" tone="cream" title="Order HG-8F3K2Q" back-label="Back to Orders" on-back="{{ noop }}" loading="{{ yes }}"></x-import>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 16px; overflow: hidden">
<h1 class="hg-vh">Loading your order</h1>
<span class="hg-tag">Proposed component: Skeleton</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="width: 180px; height: 18px; border-radius: var(--radius-xs); background: var(--skeleton-base)"></div>
<div style="width: 230px; height: 36px; border-radius: var(--radius-sm); background: var(--skeleton-base)"></div>
</div>
<div style="height: 372px; border-radius: var(--radius-md); background: var(--skeleton-base)"></div>
<x-import component-from-global-scope="HalalGoesDesignSystem_d11a47.StatusTimeline" audience="customer" orientation="compact" loading="{{ yes }}"></x-import>
<div style="height: 88px; border-radius: var(--radius-lg); background: var(--skeleton-base)"></div>
<span class="hg-gap-note">No "Calculating…" in the ETA slot and no seal placeholder: the halal badge appears only once the order arrives with its halal field.</span>
</main>
<x-import component-from-global-scope="HalalGoesDesignSystem_d11a47.BottomNav" label="Main" active="orders" items="{{ nav }}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      no: false,
      yes: true, noop: () => {},
      nav: [{ key: 'home', label: 'Home', icon: 'home' }, { key: 'search', label: 'Search', icon: 'search' }, { key: 'orders', label: 'Orders', icon: 'orders' }, { key: 'account', label: 'Account', icon: 'profile' }]
    };
  }
}
</script>
</body>
</html>
