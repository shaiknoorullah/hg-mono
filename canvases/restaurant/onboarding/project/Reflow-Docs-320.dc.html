<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflow 320 CSS px — documents, photo uploading and details</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/tokens.css">
<link rel="stylesheet" href="ds/halalgoesdesignsystem-d11a47/components/bundle.css">
<script src="ds/halalgoesdesignsystem-d11a47/components/bundle.js"></script>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--surface-base);color:var(--text-primary);font-family:var(--font-ui)}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.skip{position:absolute;left:16px;top:-80px;z-index:10}.skip:focus{top:8px}
form{margin:0}
.gap{position:relative;outline:1.5px dashed var(--color-neutral-500);outline-offset:4px}
.gap::before{content:"Proposed component: " attr(data-gap);position:absolute;top:-28px;left:-4px;font:500 12px/1 var(--font-mono);color:var(--color-neutral-800);background:var(--color-neutral-100);padding:4px 8px;border-radius:4px;white-space:nowrap}
.api{display:inline-flex;align-items:center;gap:8px;padding:4px 8px;border:1.5px dashed var(--color-info-600);background:var(--color-info-50);color:var(--color-info-700);font:500 12px/1.4 var(--font-mono);border-radius:4px}
.note{display:inline-flex;align-items:center;padding:4px 8px;background:var(--color-neutral-100);color:var(--color-neutral-800);font:500 12px/1.4 var(--font-mono);border-radius:4px}
.hg-focus-field:not([aria-invalid="true"]):focus-visible{outline:2px solid transparent;border-color:var(--focus-ring) !important;box-shadow:inset 0 0 0 1px var(--focus-ring)}
.hg-focus-field[aria-invalid="true"]:focus-visible{outline:2px solid transparent;box-shadow:0 0 0 var(--focus-offset-width) var(--focus-offset),0 0 0 calc(var(--focus-offset-width) + var(--focus-ring-width)) var(--focus-ring)}
summary:focus-visible{outline:2px solid transparent;box-shadow:0 0 0 var(--focus-offset-width) var(--focus-offset),0 0 0 calc(var(--focus-offset-width) + var(--focus-ring-width)) var(--focus-ring)}
</style>
</helmet>
<div style="width: 320px; height: 5400px; box-sizing: border-box; background: var(--surface-base); display: flex; flex-direction: column; font-family: var(--font-ui); color: var(--text-primary); position: relative; overflow: hidden">
<dc-import name="AuthTop" w="320px" hint-size="320px,80px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 24px; padding: 16px 16px 48px">
<dc-import name="OnbPhoneHead" current="DOCUMENTS" done="1000000" percent="20" cycle="0" halal="" w="288px" hint-size="288px,260px"></dc-import>
<main id="main" style="display: flex; flex-direction: column; gap: 24px">
<dc-import name="DocsMain" mode="uploading" compact="true" w="288px" hint-size="288px,5000px"></dc-import>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 320, "height": 5400}}'>
class Component extends DCLogic {
  renderVals() {
return { yes: true, no: false };
  }
}
</script>
</body>
</html>
