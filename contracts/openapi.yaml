        body, the database column and the event payload — nowhere is `is_accepting` or
        `isAccepting` accepted, and sending either is `422 UNKNOWN_FIELD` rather than a
        cheerful 200 over an unchanged row. The response is read back from the persisted row
        after the write, so a no-op write is impossible to mistake for a success.

        Turning the toggle off never shortens an offer already outstanding: that order keeps
        its full 180-second response window.
