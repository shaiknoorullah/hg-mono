openapi: 3.1.0
info:
  title: HalalGoes Platform API
  version: 0.1.0
  summary: Machine-readable contract for the HalalGoes marketplace (V0 cut).
  description: |
    **This document is the single source of truth for every wire shape on the HalalGoes
    platform.** Generated clients are produced from it; hand-edited clients are forbidden.

    Derived from `docs/spec/00-overview.md` … `docs/spec/05-admin.md` and
    `docs/decisions/README.md`. Where a domain spec contradicted the platform spec
    (`01-platform.md`), the platform spec is normative — `00-overview.md` states that domain
    specs "do not re-litigate" the binding conventions. Where the decision log
    (`docs/decisions/README.md`) contradicted a spec default, the decision log wins.
    Every such reconciliation is listed in `contracts/README.md` §"Spec contradictions".

    ## Binding conventions

    * **Base path** — every business route lives under `/v1`. Liveness/readiness probes
      (`/health`, `/health/ready`) and `/internal/deps` are the only exceptions.
    * **Envelope** — every 2xx body is `{"data": …}` (plus `{"meta": …}` for collections).
      Every non-2xx body is `{"error": {"code","message","details","request_id"}}`.
      A bare array, a bare scalar, and `{"success": false}` are unrepresentable.
      HTTP status always agrees with the body.
    * **Money** — every monetary field is an integer count of Canadian cents, named with a
      `_cents` suffix, `format: int64`. There is no `number`-typed money field anywhere in
      this document, and **no inbound request body carries a price** (invariant #1:
      the server prices every order). The single exceptions permitted by `G-3` are
      `tip_cents` (the one customer-chosen monetary input) and `amount_cents` on the
      admin-only goodwill refund route.
    * **Time** — RFC3339 with milliseconds and a `Z` suffix, UTC.
    * **Identifiers** — row ids are UUIDv7 rendered as `uuid`; externally visible
      correlation ids (`request_id`, realtime event `id`, idempotency keys) are ULID strings.
    * **Pagination** — one scheme everywhere: keyset. Request `?limit=` (1–100, default 20)
      and `?cursor=`; response `meta = {next_cursor, has_more}`.
    * **Idempotency** — every money-mutating operation and every durable-resource creation
      requires an `Idempotency-Key` header. Replay within 24 h returns the original status
      and body with `Idempotency-Replayed: true`.
    * **Authorization** — deny by default. Every operation declares `x-roles`; an operation
      whose `x-roles` contains `PUBLIC` is the only kind that may be called unauthenticated,
      and the set of such operations is fixed.
    * **404 vs 403** — a principal with no relationship at all to a subject receives `404`
      (existence is not leaked). `403` means "you can see this but may not do this".
    * **Realtime** — the WebSocket contract lives in `contracts/websocket.md`. Identity on
      the socket is server-derived from a single-use ticket minted by `createRealtimeTicket`.

    ## Version markers

    Operations carry `x-version: V0` (in the 43-feature V0 cut) or `x-version: V1`
    (needed to make a V0 screen coherent, but not itself V0).

    On 2026-10-01 the owner moved into V0 the operations launch screens depend on:
    forgot and reset password, changing your own password, two-step sign-in enrolment,
    the staff list and staff invites, sign out everywhere, restaurant payout history,
    marking an item out of stock, restaurant menu editing and the menu review queue; and
    added admin edits and removals of a menu item on a restaurant's behalf. Source:
    `docs/decisions/README.md`, "Settled — redesign decisions, round 2", "Launch scope
    and contract".
  contact:
    name: HalalGoes platform team
    email: shaiknooru247@gmail.com
  license:
    name: UNLICENSED
servers:
  - url: https://api.halalgoes.com
    description: Production
  - url: https://staging-api.halalgoes.com
    description: Staging
  - url: http://localhost:8080
    description: Local (HG_ENV=local)
tags:
  - name: system
    description: Liveness, readiness, public configuration, and the served contract itself.
  - name: auth
    description: |
      Identity. Customers and riders authenticate by phone OTP; restaurants and admins by
      email + password. One `account` table, many role grants (P-01). The credential type
      that produced a session is recorded in the access token's `amr` claim and constrains
      which roles that session may carry.
  - name: realtime
    description: Ticket issuance and payload-schema publication for the WebSocket surface.
  - name: accounts
    description: Customer profile, push-notification devices, and the persisted notification inbox.
  - name: addresses
    description: Customer delivery addresses. One resolved `geography(Point,4326)` per address.
  - name: discovery
    description: |
      Halal-gated restaurant discovery, search, restaurant detail, menu and the halal
      certification panel. Only `CERTIFIED` and `EXPIRING_SOON` restaurants are visible.
  - name: cart
    description: Server-authoritative single-restaurant cart.
  - name: quotes
    description: |
      The one price computation. `createQuote` is the only writer of money on the customer
      path; `createOrder` re-executes it and refuses to proceed on any difference.
  - name: orders
    description: Customer-side order placement, tracking, cancellation and receipts.
  - name: payments
    description: Saved payment methods, order payment state, and the Stripe webhook sink.
  - name: refunds
    description: Refund request and tracking. Amounts are server-computed except admin goodwill.
  - name: uploads
    description: Presigned upload/confirm/download against private MinIO buckets.
  - name: connect
    description: Stripe Connect Express onboarding for restaurants and riders.
  - name: restaurant
    description: |
      The restaurant partner surface — onboarding, documents, menu, availability, and the
      live order dashboard with the 180-second accept/reject window.
  - name: rider
    description: |
      The rider surface — onboarding, availability, location streaming, race-free offer
      acceptance, delivery transitions with proof of delivery, and the earnings ledger.
  - name: admin
    description: |
      Staff surface — onboarding queues, the seven-check halal verification, restaurant and
      rider approval, menu creation on behalf, order lookup and refund issuance.
  - name: handoff
    description: |
      Package-seal chain of custody. **Later version: physical tamper seals are not used at
      launch** and move to v1.1 ([seal decision, #47](https://github.com/shaiknoorullah/hg-mono/issues/47)).
      No seal scan gates any order transition. At launch the rider proves pickup with the
      4-digit **pickup code** the kitchen reads out (`pickup_code` on
      `createAssignmentTransition`) and proves delivery with proof of delivery
      (`submitProofOfDelivery`), as the owner decided on 2026-10-01
      ([round-2 decisions, "Orders and delivery"](https://github.com/shaiknoorullah/hg-mono/blob/main/docs/decisions/README.md#orders-and-delivery)).

      When seals return, an EdDSA-signed QR token `{order_id, seal_id, nonce}` binds one
      tamper-evident seal to one order at the kitchen, and each scan is custody evidence
      recorded next to the order, not a gate on it. A tamper report never auto-fails the
      order; it hands the scan-and-photo trail to the dispute flow.
security:
  - otpSession: []
  - passwordSession: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      description: Returns 200 while the process is alive. Never touches a dependency.
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthStatus'
        default:
          $ref: '#/components/responses/Error'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe
      description: |
        503 with the failing dependency named when Postgres, Redis, MinIO or Stripe is
        unreachable. Traefik removes an unready replica from rotation.
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      responses:
        '200':
          description: All dependencies reachable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReadinessStatus'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/deps:
    get:
      operationId: getDependencyStatus
      tags: [system]
      summary: Resolved and connected dependency addresses
      description: |
        G-7. Reports each dependency's *resolved and connected* address plus the boot-probe
        results (private-bucket privacy probe, PostGIS probe, Stripe livemode probe).
        Never exposed through Traefik to the public internet.
      x-roles: [ADMIN, SUPER_ADMIN]
      x-version: V1
      responses:
        '200':
          description: Dependency report.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DependencyReport'
        default:
          $ref: '#/components/responses/Error'
  /v1/openapi.json:
    get:
      operationId: getOpenApiDocument
      tags: [system]
      summary: The generated OpenAPI document
      description: |
        The contract as generated from the route registry and the request/response structs.
        A CI drift check fails the build when this differs from the committed
        `contracts/openapi.yaml`.
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      responses:
        '200':
          description: OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /v1/config/public:
    get:
      operationId: getPublicConfig
      tags: [system]
      summary: Public runtime configuration
      description: |
        Values the clients must never hardcode: support contact and hours, the default map
        centre, the served provinces, tip bounds, and the quote TTL. No secret, no fee
        parameter that could let a client compute a price.
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      responses:
        '200':
          description: Public configuration.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicConfig'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request a phone OTP challenge
      description: |
        P-02. Always returns 200 with an identical body shape and latency distribution
        whether or not the number is known — there is no account enumeration. Re-requesting
        inside an open challenge's lifetime **re-sends the same code** and increments
        `sends`; it does not rotate the code. Cooldown 60 s, max 3 sends per challenge,
        challenge window 15 min, code validity 5 min from the most recent send.

        `X-HG-Client` selects which role grant is created on first sign-up
        (`rider-app` → `RIDER`, `customer-app` → `CUSTOMER`). It is never trusted for
        authorization.

        Fails closed (`503 RATE_LIMITER_UNAVAILABLE`) when Redis is unreachable — this and
        `verifyOtp` are the two endpoints where fail-open is unacceptable.
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      x-rate-class: AUTH
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestInput'
      responses:
        '200':
          description: Challenge created or re-sent.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OtpChallenge'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify a phone OTP challenge and issue a session
      description: |
        P-02. Consumes the challenge with a single conditional `UPDATE`. Zero rows ⇒
        `OTP_INVALID_OR_EXPIRED`; wrong code ⇒ `OTP_INCORRECT` with `attempts_remaining`.
        On success the account is found or created by phone, `phone_verified_at` is set,
        the audience-appropriate role is granted, and a session is issued (P-04).

        Native clients receive both tokens in the body. Web clients receive the refresh
        token only as an `HttpOnly; Secure; SameSite=Lax` cookie scoped to `/v1/auth`.
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      x-rate-class: AUTH
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyInput'
      responses:
        '200':
          description: Session issued.
          headers:
            Set-Cookie:
              description: |
                `hg_rt` refresh cookie for web surfaces only. Absent for native clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionGrant'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/register/restaurant:
    post:
      operationId: registerRestaurant
      tags: [auth]
      summary: Register a restaurant account (email + password)
      description: |
        P-03 / R-01. Creates one `account` (unverified), one `restaurant` in
        `onboarding_state=REGISTERED`, and one `RESTAURANT_OWNER` grant, then sends a
        verification email. **No session is issued until the email is verified.**
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      x-rate-class: AUTH
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantRegistrationInput'
      responses:
        '201':
          description: Restaurant account created; verification email enqueued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RestaurantRegistration'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Consume an email-verification token and issue a session
      description: |
        P-03 / R-02. Single-use, consumed atomically. TTL 24 h. Advances the restaurant
        onboarding state to `PROFILE_PENDING` and issues a session.
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      x-rate-class: AUTH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 128
                  description: Base64url token from the verification email. Never logged.
      responses:
        '200':
          description: Email verified and session issued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionGrant'
        '410':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/resend:
    post:
      operationId: resendEmailVerification
      tags: [auth]
      summary: Re-send the email-verification token
      description: 'P-03. Rate limited 1/min and 5/day per account. Supersedes prior tokens.'
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      x-rate-class: AUTH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Accepted. Response is identical whether or not the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgementResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Email + password sign-in (restaurants, admins, support)
      description: |
        P-03. Argon2id verification, account status check, role auth-policy check, TOTP
        when enrolled or required. Wrong email, wrong password and unverified email all
        return the same `401 INVALID_CREDENTIALS` body; the unverified case additionally
        sets `error.details.email_verification_required` **only after** the credentials
        were correct. Lockout truth lives in Postgres, so a Redis flush does not unlock.
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      x-rate-class: AUTH
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Session issued.
          headers:
            Set-Cookie:
              description: '`hg_rt` refresh cookie and `hg_csrf` double-submit cookie.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionGrant'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: |
        P-04. Rotating with reuse detection: presenting an already-rotated token revokes
        the entire session family and returns `REFRESH_REUSE_DETECTED`. Roles are re-read
        from `account_role` on every refresh. Web surfaces send the token in the `hg_rt`
        cookie and must supply the `X-HG-CSRF` double-submit header; native clients send it
        in the body.
      security:
        - refreshCookie: []
          csrfHeader: []
        - {}
      x-roles: [PUBLIC]
      x-version: V0
      x-rate-class: AUTH
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token:
                  type: string
                  pattern: '^hgrt_[A-Za-z0-9_-]+$'
                  description: Native clients only. Web clients use the `hg_rt` cookie.
      responses:
        '200':
          description: New token pair issued; the presented token is now rotated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionGrant'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the calling session
      description: 'P-04. Idempotent — logging out an already-revoked session returns 204.'
      x-roles: [CUSTOMER, RIDER, RESTAURANT_OWNER, RESTAURANT_MANAGER, RESTAURANT_STAFF, SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V0
      responses:
        '204':
          description: Session revoked; any bound WebSocket closes with code 4401 within 10 s.
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags: [auth]
      summary: Revoke every session in the account's family
      x-roles: [CUSTOMER, RIDER, RESTAURANT_OWNER, RESTAURANT_MANAGER, RESTAURANT_STAFF, SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V0
      responses:
        '204':
          description: All sessions revoked.
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the account's live sessions
      x-roles: [CUSTOMER, RIDER, RESTAURANT_OWNER, RESTAURANT_MANAGER, RESTAURANT_STAFF, SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V1
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Live sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one session
      description: 'P-04. Propagation is ≤10 s even with Redis stopped.'
      x-roles: [CUSTOMER, RIDER, RESTAURANT_OWNER, RESTAURANT_MANAGER, RESTAURANT_STAFF, SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V1
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session revoked.
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/me:
    get:
      operationId: getCurrentPrincipal
      tags: [auth]
      summary: The resolved principal for the calling session
      description: |
        P-04. The client contains no branching tree of its own: `next_route` is a closed
        enum the client maps to a screen, so routing is a server decision.
      x-roles: [CUSTOMER, RIDER, RESTAURANT_OWNER, RESTAURANT_MANAGER, RESTAURANT_STAFF, SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V0
      responses:
        '200':
          description: Principal.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Principal'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password-reset token
      description: 'P-03. Always 200. Token TTL 30 min, single-use.'
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      x-rate-class: AUTH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '200':
          description: Accepted. Identical whether or not the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgementResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password from a reset token
      description: |
        P-03. Revokes **every** session in the account's family and sends a security email.
      security: []
      x-roles: [PUBLIC]
      x-version: V0
      x-rate-class: AUTH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 128
                new_password:
                  $ref: '#/components/schemas/Password'
      responses:
        '204':
          description: Password set; all sessions revoked.
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password of the calling account
      description: |
        P-03. Revokes every session except the calling one, which is re-issued.

        A wrong current password is `422 INVALID_CREDENTIALS`, never `401`: the caller's
        session is valid, and a client treats every `401` as an expired session — it would
        refresh and send the wrong password a second time, counting double toward the
        account lockout, or sign the person out instead of saying the password is wrong.
        The backend still answers `401` until
        [#238](https://github.com/shaiknoorullah/hg-mono/issues/238) is fixed.
      x-roles: [RESTAURANT_OWNER, RESTAURANT_MANAGER, RESTAURANT_STAFF, SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
