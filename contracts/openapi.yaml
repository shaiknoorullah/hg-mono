      summary: Place an order from a quote
      description: |
        P-09 / P-16. The request carries a `quote_id`, a `payment_method_id` and delivery
        instructions. **There is no amount anywhere on this DTO.** The server re-executes
        `Quote()` and compares it to the stored quote:

        * identical ⇒ proceed;
