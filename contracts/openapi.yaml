  /v1/realtime/ticket:
    post:
      operationId: createRealtimeTicket
      tags: [realtime]
      summary: Mint a single-use WebSocket connection ticket
      description: |
        P-20. A normal authenticated REST call through the full middleware chain. The ticket
        is 32 random bytes base64url, stored in Postgres with the account, session and role
        snapshot, and **expires in 30 seconds**. It is consumed by a conditional `UPDATE` on
        upgrade; a second use is refused with HTTP 401 before any frame is exchanged and
        writes a `realtime.ticket_reuse` audit event.

        Connect to `wss://{host}/v1/ws?ticket={ticket}&client={client}&v=1`. Native clients
        may instead pass the access token in `Sec-WebSocket-Protocol` as
        `hg.v1, bearer.<jwt>`. **No client frame can establish, change or elevate identity**
        — the inbound frame schema has no `user_id` field at all.

        See `contracts/websocket.md` for the envelope, channels and event catalogue.
      x-roles: [CUSTOMER, RIDER, RESTAURANT_OWNER, RESTAURANT_MANAGER, RESTAURANT_STAFF, SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V0
      x-rate-class: REALTIME
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '200':
          description: Ticket minted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RealtimeTicket'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
