  /v1/riders/me/offers/{offerId}/accept:
    post:
      operationId: acceptOffer
      tags: [rider]
      summary: Accept a dispatch offer (race-free)
      description: |
        P-32 / D-16. The winner is decided by a single conditional `UPDATE` in Postgres —
        exactly one transaction sees `rider_account_id IS NULL` and commits. Every other
        accept returns `409 OFFER_ALREADY_TAKEN` and the losing riders receive
        `dispatch.offer_withdrawn` with reason `taken`. There is no Redis lock, no workflow
        signal, and no TTL'd correlation key that could make acceptance impossible.

        The same transaction sets the rider to `ON_DELIVERY`, so the rider stops being
        dispatchable at the instant of accept. The response is the full assignment,
        including the now-unmasked delivery address, unit and phone alias.
      x-roles: [RIDER]
      x-version: V0
      parameters:
        - $ref: '#/components/parameters/OfferIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
