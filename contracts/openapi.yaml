          description: Pending versions, oldest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItemVersion'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/menu-reviews/{versionId}/decision:
    post:
      operationId: decideMenuVersion
      tags: [admin]
      summary: Approve or reject a pending menu version
      description: |
        A-19 / R-17. Approval repoints `live_version_id` and clears `pending_version_id` in
        one transaction. Rejection requires a reason code, which the restaurant sees
        verbatim and may resubmit against without limit.
      x-roles: [ADMIN, SUPER_ADMIN]
      x-version: V0
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuVersionDecisionInput'
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MenuItemVersion'
        '409':
          description: '`ITEM_DELETED`, `ALREADY_DECIDED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/orders:
    get:
      operationId: listOrdersAdmin
      tags: [admin]
      summary: Cross-tenant order lookup
      description: |
        A-38 / P-07. Requires the global `order.read_any` action, and **every privileged
        cross-tenant read writes an audit event before returning**. PII is masked by default;
        revealing a phone or address requires a justified reveal that is itself audited.
      x-roles: [SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V0
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: code
          in: query
          required: false
          description: 'Human-quotable order code, e.g. `HG-8F3K2Q`.'
          schema:
            type: string
            pattern: '^HG-[0-9A-HJKMNP-TV-Z]{6}$'
        - name: state
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderState'
        - name: restaurant_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: account_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: placed_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: placed_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Orders, newest first, in the admin projection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/orders/{orderId}:
    get:
      operationId: getOrderAdmin
      tags: [admin]
      summary: The complete order picture for support
      description: |
        A-38. Header, parties, lines with variants and add-ons, the full pricing breakdown
        with the config versions used, payment and refund history, the delivery address and
        instructions, the transition timeline with actor attribution, the dispatch history
        and the realtime event log — generated from the same read model the customer app
        uses, so support and customer can never see contradictory states.
      x-roles: [SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V0
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - name: reveal_pii
          in: query
          required: false
          description: 'Unmask the customer''s phone and address. Requires a justification and is audited.'
          schema:
            type: boolean
            default: false
        - name: justification
          in: query
          required: false
          schema:
            type: string
            minLength: 10
            maxLength: 500
      responses:
        '200':
          description: Order, admin projection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OrderAdminView'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: 'Reveal requested without a justification.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/orders/{orderId}/cancel:
    post:
      operationId: cancelOrderAdmin
      tags: [admin]
      summary: Support-mediated order cancellation
      description: |
        A-38 / T11 / T13. Cancelling **before** restaurant acceptance voids the
        authorisation. Cancelling **after** acceptance always issues a refund per the
        liability matrix, in the same transaction as the state change — the operator sees one
        action, and there is no path where the state change commits and the money does not.

        Support agents may cancel before acceptance only; after acceptance they must
        escalate.
      x-roles: [SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V0
      x-rate-class: MONEY
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrderCancellationInput'
      responses:
        '200':
          description: Order cancelled; any refund is authorised in the same transaction.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OrderAdminView'
        '403':
          description: 'Support agent attempting a post-acceptance cancellation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/orders/{orderId}/handover-override:
    post:
      operationId: overrideHandoverCode
      tags: [admin]
      summary: Support confirms a pickup or a met handover without its code
      description: |
        **The only way past a handover code**
        ([security review on #183](https://github.com/shaiknoorullah/hg-mono/issues/183)).
        The pickup code and the delivery code are proof of presence, and the rider has no
        override for either. When a code cannot be used — five wrong codes locked it
        (`PICKUP_CODE_LOCKED`, `DELIVERY_CODE_LOCKED`), the kitchen cannot show it, or the
        customer cannot be reached at a met handover — support or an admin confirms the
        handover here, after checking with the people involved.

        - `PICKUP` moves the order `READY_FOR_PICKUP` → `PICKED_UP` and the assignment to
          `PICKED_UP`. The assigned rider must be at the counter (`ARRIVED_AT_PICKUP`).
        - `DELIVERY` moves the order `PICKED_UP`/`ARRIVED` → `DELIVERED` and the assignment
          to `DELIVERED`, for an order whose `required_pod_method` is `OTP`. The assigned
          rider must be at the drop-off (`ARRIVED_AT_DROPOFF`).
        - Anything else is `409 ILLEGAL_TRANSITION` with `details.from`, `details.to` and
          `details.allowed`, and nothing is written.

        Every override needs a `reason` and a linked support `case_id` — there are no
        context-free order mutations. The transition, the retiring of the code (no later
        attempt can use it) and the `HandoverOverride` audit record commit in **one
        transaction**; the audit record is append-only and names the actor, their role, the
        reason, the case and how many wrong codes had been tried. The order's timeline shows
        the transition with `actor_kind` `SUPPORT` or `ADMIN` and the reason, and the usual
        `order.state_changed` event goes out. The rider and the restaurant see the order
        move on; they are never told the code, and neither is the operator: no admin view
        carries either code, so support cannot read a code out to a rider.

        Repeating the call with the same `Idempotency-Key` returns the same record. A second
        override of a handover that has already happened is `409 ILLEGAL_TRANSITION`.
      x-roles: [SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V0
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverOverrideInput'
      responses:
        '200':
          description: The handover is confirmed; the response is the audit record it wrote.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HandoverOverride'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            `ILLEGAL_TRANSITION` with `details.from`, `details.to` and `details.allowed`: the
            order is not waiting on this handover (wrong state, no rider at the counter or
            the drop-off, a photo drop-off, or the handover already happened).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`VALIDATION_FAILED`: a missing or too-short `reason`, or no `case_id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/refunds:
    post:
      operationId: issueRefund
      tags: [admin]
      summary: Issue a refund under an authority cap
      description: |
        A-33 / P-18. `Idempotency-Key` is **mandatory** — it is what prevents the double
        refund a retried support click would otherwise cause.

        The authority check runs before anything reaches Stripe. A request that exceeds the
        caller's cap is **not rejected**: it creates an approval request and escalates, so a
        customer's request is never lost. Rolling 24-hour caps are enforced by an atomic
        upsert inside the authorising transaction. Nobody may approve their own above-cap
        request.

        Amounts are server-computed for `FULL`, `PARTIAL_ITEMS` and `FEES_ONLY`.
        `amount_cents` is accepted **only** for `GOODWILL` — this is the single allowlisted
        inbound monetary field besides `tip_cents` (G-3).

        The customer-facing status never reads "refunded" before the provider confirms.
      x-roles: [SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
      x-version: V0
      x-rate-class: MONEY
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefundInput'
      responses:
        '201':
          description: Refund authorised and submitted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Refund'
        '202':
          description: |
            Above the caller's cap: an approval request was created and the case escalated.
            No refund exists yet.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RefundApprovalRequest'
        '400':
          description: '`IDEMPOTENCY_KEY_REQUIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `REFUND_EXCEEDS_CAPTURED`, `DAILY_CAP_EXCEEDED`, `SELF_APPROVAL_FORBIDDEN`,
            `PAYMENT_NOT_REFUNDABLE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}/handoff/seal:
    post:
      operationId: bindPackageSeal
      tags: [handoff]
      summary: Bind a physical seal to this order at packing
      description: |
        **Later version: seals are not used at launch**
        ([#47](https://github.com/shaiknoorullah/hg-mono/issues/47)). Nothing at
        launch requires a bound seal; the kitchen proves the handover to the rider with the
        order's `pickup_code` instead.

        Restaurant staff scan or key in the pre-coded `seal_code` printed on the physical
        tamper-evident label as they finish packing. The seal must be `ISSUED` (platform-known
        stock, not yet bound) and is bound to exactly this order for its lifetime — a seal
        never moves between orders. Binding mints the EdDSA-signed `{order_id, seal_id, nonce}`
        token that the client renders as the QR code affixed to the package; that same code
        is what the rider scans at pickup and at delivery.
      x-roles: [RESTAURANT_OWNER, RESTAURANT_MANAGER, RESTAURANT_STAFF]
      x-version: V1
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealBindInput'
      responses:
        '201':
          description: Seal bound; `qr_token` is the QR payload to render on the label.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PackageSeal'
        '404':
          description: '`SEAL_NOT_FOUND` — no such seal code for this restaurant.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`SEAL_ALREADY_BOUND` — this seal is already bound to another order.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}/handoff/pickup-scan:
    post:
      operationId: scanPickup
      tags: [handoff]
      summary: Rider scans the seal at pickup
      description: |
        **Later version: seals are not used at launch**
        ([#47](https://github.com/shaiknoorullah/hg-mono/issues/47)). This scan
        **does not gate and does not perform** `READY_FOR_PICKUP` → `PICKED_UP`: the rider
        confirms pickup with the kitchen's `pickup_code` on `createAssignmentTransition`, as
        the owner decided on 2026-10-01
        ([round-2 decisions, "Orders and delivery"](https://github.com/shaiknoorullah/hg-mono/blob/main/docs/decisions/README.md#orders-and-delivery)).

        When seals return, the rider scans the QR on the package as custody evidence; the
        server verifies the EdDSA signature, that the token's `order_id` matches this order,
        and that its `nonce` has never been consumed for a `PICKUP` proof on this seal
        (single-use — `UNIQUE(seal_id, nonce)` makes a replay a constraint violation, not a
        check that might be skipped). A failed `seal_intact` check is recorded on the seal
        and the event trail as tamper evidence and blocks nothing.
      x-roles: [RIDER]
      x-version: V1
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupScanInput'
      responses:
        '200':
          description: Pickup scan recorded; `order_state` is the order's state, which this scan did not change.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HandoffScanResult'
        '404':
          description: '`SEAL_NOT_FOUND` — no seal is bound to this order.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`SEAL_NOT_BOUND`, `ILLEGAL_TRANSITION`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`SEAL_TOKEN_INVALID`, `SEAL_ORDER_MISMATCH`, `SEAL_NONCE_REPLAYED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}/handoff/delivery-scan:
    post:
      operationId: scanDelivery
      tags: [handoff]
      summary: Rider scans the seal at delivery
      description: |
        **Later version: seals are not used at launch**
        ([#47](https://github.com/shaiknoorullah/hg-mono/issues/47)). This scan
        **does not gate and does not perform** `DELIVERED`: delivery is gated only by the
        customer's proof of delivery (`submitProofOfDelivery`, a code or a photo).

        When seals return: same signature, order-binding and single-use-nonce checks as
        `scanPickup`, scoped to the `DELIVERY` proof so the same physical QR can legally be
        scanned once at pickup and once at delivery without either scan being treated as a
        replay of the other. `seal_intact: false` is recorded as tamper evidence for support
        to act on and blocks nothing.
      x-roles: [RIDER]
      x-version: V1
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryScanInput'
      responses:
        '200':
          description: Delivery scan recorded; `order_state` is the order's state, which this scan did not change.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HandoffScanResult'
        '404':
          description: '`SEAL_NOT_FOUND` — no seal is bound to this order.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`SEAL_NOT_BOUND`, `ILLEGAL_TRANSITION`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: '`SEAL_TOKEN_INVALID`, `SEAL_ORDER_MISMATCH`, `SEAL_NONCE_REPLAYED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /v1/orders/{orderId}/handoff/tamper-report:
    post:
      operationId: reportTamper
      tags: [handoff]
      summary: Customer reports the seal was tampered with
      description: |
        **Later version: seals are not used at launch**
        ([#47](https://github.com/shaiknoorullah/hg-mono/issues/47)), so there is no
        seal to report on; a customer reports a problem with a delivered order through a
        refund request (`createRefund`).

        When seals return, this is filed by the customer after delivery — the rider never
        files this; their only tamper-adjacent signal is `seal_intact` on their own scan. It
        never auto-fails the order or the payment: it appends a `TAMPER_REPORT` event carrying
        the photo trail and opens the existing dispute flow (`DELIVERED`/`COMPLETED` →
        `DISPUTED`), which decides the money outcome from the full scan-and-photo chain of
        custody.
      x-roles: [CUSTOMER]
      x-version: V1
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TamperReportInput'
      responses:
        '200':
          description: Tamper report recorded; the order has moved to `DISPUTED`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HandoffScanResult'
        '404':
          description: '`SEAL_NOT_FOUND` — no seal is bound to this order.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`ILLEGAL_TRANSITION` — the order is not in a state that can be disputed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    otpSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Customer and rider session**, issued by `verifyOtp` (phone OTP). The access JWT is
        `EdDSA` (Ed25519), TTL **15 minutes**, and carries `amr: ["otp"]`. A session with this
        `amr` may only carry the `CUSTOMER` and `RIDER` roles: an account that also holds
        `ADMIN` receives a token without it, and any admin route returns 403.

        Native apps hold both tokens in `expo-secure-store`/Keychain. `AsyncStorage` and
        `localStorage` are forbidden and lint-enforced.
    passwordSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Restaurant, support and admin session**, issued by `login` (email + password, plus
        TOTP where enrolled or required). Same JWT shape, TTL 15 minutes, `amr` is `"pwd"` or
        `"pwd+totp"`. Web surfaces hold the access token **in memory only**; the refresh token
        lives exclusively in the `hg_rt` cookie.
    refreshCookie:
      type: apiKey
      in: cookie
      name: hg_rt
      description: |
        Opaque refresh token for web surfaces. `HttpOnly; Secure; SameSite=Lax;
        Path=/v1/auth`. Rotating with reuse detection: presenting a rotated token revokes the
        entire session family. Must be accompanied by the `X-HG-CSRF` double-submit header.
    csrfHeader:
      type: apiKey
      in: header
      name: X-HG-CSRF
      description: |
        Double-submit CSRF token; must equal the non-HttpOnly `hg_csrf` cookie. Required on
        every cookie-authenticated route, alongside an `Origin` header on the allowlist.
    realtimeTicket:
      type: apiKey
      in: query
      name: ticket
      description: |
        **WebSocket upgrade only** (`wss://{host}/v1/ws?ticket=…`). A single-use, 30-second
        ticket minted by `createRealtimeTicket` and consumed by a conditional `UPDATE` on
        upgrade. Identity is resolved from the ticket server-side; the inbound frame schema
        has no identity field at all. This scheme is documented here because the WebSocket
        endpoint is not an HTTP operation — see `contracts/websocket.md`.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: 'Page size. 1–100, default 20. A non-numeric value is a 422, never a silent NaN.'
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'Opaque keyset cursor from `meta.next_cursor`. Never an offset or a page number.'
      schema:
        $ref: '#/components/schemas/Cursor'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID or ULID, 16–128 characters. Scope is
        `(account_id, method, path_template, key)`. Two concurrent requests with the same key
        produce exactly one business effect; a replay returns the original status and body
        byte-identically with `Idempotency-Replayed: true`; the same key with a different body
        is `409 IDEMPOTENCY_KEY_REUSE`, never a silent replay of the wrong result. The record
        is written in the same transaction as the business effect and expires after 24 h.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ClientHeader:
      name: X-HG-Client
      in: header
      required: true
      description: |
        Registered client surface. Selects which role grant is created on first OTP sign-up
        and which token transport is used. **Never trusted for authorization.**
      schema:
        $ref: '#/components/schemas/ClientSurface'
    RestaurantIdPath:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MenuItemIdPath:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MenuCategoryIdPath:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferIdPath:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentIdPath:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateIdPath:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RiderAccountIdPath:
      name: riderAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: |
        The single error envelope, used by every operation at every non-2xx status. A body
        containing `error` never ships with a 2xx status, and `{"success": false}` is not a
        representable response shape.
      headers:
        X-Request-ID:
          description: 'ULID correlating this response with the server log and the audit trail.'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 'Rate limit exceeded. The request was **not** executed — no partial effect exists.'
      headers:
        Retry-After:
          schema:
            type: integer
            format: int32
        RateLimit-Limit:
          schema:
            type: integer
            format: int32
        RateLimit-Remaining:
          schema:
            type: integer
            format: int32
        RateLimit-Reset:
          schema:
            type: integer
            format: int32
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Cents:
      type: integer
      format: int64
      description: |
        A signed count of Canadian cents. **Every monetary value in this contract is this
        type.** There is no `number`-typed money field anywhere, no string-formatted money,
        and no rounding to any granularity other than one cent.
      examples: [4696]
    Currency:
      type: string
      enum: [CAD]
      description: 'CAD only at V0. Present on every monetary object so V2 multi-currency is additive.'
    Cursor:
      type: string
      maxLength: 512
      description: 'Opaque keyset cursor encoding the sort tuple. Not an offset.'
    Timestamp:
      type: string
      format: date-time
      description: 'RFC3339 with milliseconds, UTC, `Z`-suffixed. Example: `2026-08-10T14:03:11.412Z`.'
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    Latitude:
      type: number
      minimum: -90
      maximum: 90
      description: 'WGS84 latitude. Never a money field — the only `number` types in this contract are geographic or rating values.'
    Longitude:
      type: number
      minimum: -180
      maximum: 180
    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: |
        Full E.164 including the `+` and the country code. **No country prefix is ever
        prepended by the server** — a number without `+` is `422 INVALID_PHONE`.
      examples: ['+14165550123']
    Password:
      type: string
      minLength: 12
      maxLength: 256
      writeOnly: true
      description: |
        Argon2id at rest (`t=3, m=64 MiB, p=2`). Minimum 12 characters, no composition rules,
        rejected against a bundled breached-password list. Never logged, never returned,
        never present in an audit payload.
    PostalCode:
      type: string
      pattern: '^[A-CEGHJ-NPR-TVXY][0-9][A-CEGHJ-NPR-TV-Z] ?[0-9][A-CEGHJ-NPR-TV-Z][0-9]$'
      description: 'Canadian FSA/LDU, stored uppercased with a single space.'
    Province:
      type: string
      # NOTE: every member is quoted. Unquoted `ON` is a YAML 1.1 boolean (`true`) in
      # PyYAML/libyaml — Ontario, the only province served at launch, silently became `true`
      # for every YAML-1.1 consumer while YAML-1.2 consumers (the JS toolchain) read `"ON"`.
      enum: ['AB', 'BC', 'MB', 'NB', 'NL', 'NS', 'NT', 'NU', 'ON', 'PE', 'QC', 'SK', 'YT']
      description: |
        ISO 3166-2:CA subdivision. Drives the tax profile (place of supply). Ontario only is
        served at launch; other provinces are rejected at quote time with `PROVINCE_NOT_SERVED`
        even though the tax engine carries every rate.
    Timezone:
      type: string
      maxLength: 64
      description: 'IANA zone, e.g. `America/Toronto`. All local-time rules use the subject''s zone, never the server''s.'
      examples: ['America/Toronto']
    PageMeta:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, 'null']
          description: 'Null at the end of the collection.'
        has_more:
          type: boolean
        total:
          type: [integer, 'null']
          format: int64
          description: 'Present only where an exact count is cheap. Never required for paging.'
    AcknowledgementResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [acknowledged]
          properties:
            acknowledged:
              type: boolean
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: 'Human-readable and log-safe. **Clients branch on `code`, never on `message`.**'
            details:
              description: |
                Code-specific structured detail. Documented shapes:
                `VALIDATION_FAILED` → `[{field, code, message}]`;
                `QUOTE_STALE` → `{quote: Quote}`;
                `ILLEGAL_TRANSITION` → `{from, to, allowed: [OrderState]}`;
                `DIFFERENT_RESTAURANT` → `{current_restaurant_id, current_restaurant_name, current_line_count}`;
                `CART_HAS_UNAVAILABLE_ITEMS` → `{line_ids: [uuid]}`;
                `INCOMPLETE_DOCUMENT_PACK` → `{missing: [doc_type]}`;
                `CHECK_NOT_OVERRIDABLE` → `{check_key, computed}`;
                `PRECONDITION_NOT_MET` → `{blockers: [string]}`;
                `CANNOT_GO_ONLINE` → `{blocking_reasons: [string]}`;
                `POD_REQUIRED` → `{required_pod_method}`;
                `POD_METHOD_MISMATCH` → `{required_pod_method}`;
                `PICKUP_CODE_INCORRECT` → `{attempts_remaining}`;
                `DELIVERY_CODE_INCORRECT` → `{attempts_remaining}`;
                `RATE_LIMITED` → `{retry_after_seconds}`.

                **Never a handover code.** No error carries a pickup or delivery code, the
                one sent or the one expected, in `message` or `details`; a
                `VALIDATION_FAILED` on a code field names the field, never its value.
              oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  items:
                    $ref: '#/components/schemas/FieldError'
                - type: 'null'
            request_id:
              allOf:
                - $ref: '#/components/schemas/Ulid'
              description: 'Also returned as the `X-Request-ID` header. Quote it in support.'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          examples: ['delivery_instructions[0]']
        code:
          type: string
          examples: ['enum']
        message:
          type: string
    ErrorCode:
      type: string
      description: |
        **The closed set of error codes.** Clients branch on this value, never on
        `error.message`.

        **Casing is `SCREAMING_SNAKE_CASE`, without exception.** The five domain specs
        disagreed — the platform spec wrote `snake_case` (`quote_stale`) while the customer,
        rider and admin specs wrote `SCREAMING_SNAKE` (`DIFFERENT_RESTAURANT`,
        `OFFER_ALREADY_TAKEN`). That contradiction is now **resolved by normalisation**: every
        member is upper-cased, and the three pairs that collided once cased alike
        (`otp_incorrect`/`OTP_INCORRECT`, `offer_expired`/`OFFER_EXPIRED`,
        `province_not_served`/`PROVINCE_NOT_SERVED`) are collapsed to one member each. See
        `contracts/README.md` §"Spec contradictions", item 3 (RESOLVED).

        To map a spec that still names a code in `snake_case`, upper-case it. No other
        transformation was applied — no code was renamed, split or dropped.
      enum:
        # --- transport / boundary -------------------------------------------------
        - INTERNAL_ERROR
        - TIMEOUT
        - PAYLOAD_TOO_LARGE
        - ORIGIN_NOT_ALLOWED
        - CSRF_ORIGIN_REJECTED
        - RATE_LIMITED
        - RATE_LIMITER_UNAVAILABLE
        - VALIDATION_FAILED
        - UNKNOWN_FIELD
        - INVALID_FIELD
        - INVALID_ENUM_VALUE
        - NOT_FOUND
        - FORBIDDEN
        - PERMISSION_DENIED
        - AUTHENTICATION_REQUIRED
        - METHOD_NOT_ALLOWED
        - UNSUPPORTED_MEDIA_TYPE
        # --- idempotency ----------------------------------------------------------
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSE
        - IDEMPOTENCY_IN_PROGRESS
        - IDEMPOTENCY_CONFLICT
        # --- identity / session ---------------------------------------------------
        - OTP_INVALID_OR_EXPIRED
        - OTP_INCORRECT
        - INVALID_PHONE
        - UNSUPPORTED_COUNTRY
        - INVALID_CREDENTIALS
        - EMAIL_NOT_VERIFIED
        - EMAIL_ALREADY_REGISTERED
        - TERMS_VERSION_STALE
        - BREACHED_PASSWORD
        - ACCOUNT_TEMPORARILY_LOCKED
        - ACCOUNT_LOCKED
        - SESSION_REVOKED
        - SESSION_EXPIRED
        - REFRESH_REUSE_DETECTED
        - TOKEN_CONSUMED
        - VERIFICATION_TOKEN_EXPIRED
        - VERIFICATION_TOKEN_USED
        - MFA_REQUIRED
        - LAST_OWNER_REQUIRED
        - ACCOUNT_SUSPENDED
        - ACCOUNT_DEACTIVATED
        - ACCOUNT_NOT_ACTIVE
        - ACCOUNT_BANNED
        - ONBOARDING_INCOMPLETE
        - PROFILE_INCOMPLETE
        # --- catalogue / cart -----------------------------------------------------
        - RESTAURANT_CLOSED
        - RESTAURANT_UNAVAILABLE
        - ITEM_UNAVAILABLE
        - CART_HAS_UNAVAILABLE_ITEMS
        - DIFFERENT_RESTAURANT
        - VARIANT_UNAVAILABLE
        - ADDON_UNAVAILABLE
        - INVALID_ADDON
        - BELOW_MINIMUM_ORDER
        - ADDRESS_OUT_OF_RANGE
        - ADDRESS_IN_USE
        - PROVINCE_NOT_SERVED
        - FAVOURITES_LIMIT
        # --- pricing / money ------------------------------------------------------
        - QUOTE_STALE
        - QUOTE_EXPIRED
        - TAX_PROFILE_MISSING
        - PRICE_CHANGED
        - BLOCKED_PRICE_CHANGED
        - REFUND_EXCEEDS_CAPTURED
        - PAYMENT_NOT_REFUNDABLE
        - REFUND_WINDOW_CLOSED
        - REFUND_ALREADY_REQUESTED
        - DAILY_CAP_EXCEEDED
        - EXCEEDS_REFUND_CAP
        - SELF_APPROVAL_FORBIDDEN
        - PAYMENT_METHOD_LIMIT
        - PAYMENT_METHOD_IN_USE
        - PAYMENT_METHOD_INVALID
        - CAPTURE_FAILED
        - LEDGER_BATCH_UNBALANCED
        # --- order state machine --------------------------------------------------
        - ILLEGAL_TRANSITION
        - ILLEGAL_STATUS_TRANSITION
        - TRANSITION_NOT_PERMITTED_FOR_ACTOR
        - ACTIVE_ORDER_EXISTS
        - CANCELLATION_WINDOW_CLOSED
        - DELAY_LIMIT_REACHED
        - DELAY_NOT_ALLOWED_IN_STATUS
        - REVIEW_WINDOW_CLOSED
        - REVIEW_EDIT_WINDOW_CLOSED
        # --- dispatch -------------------------------------------------------------
        - OFFER_ALREADY_TAKEN
        - OFFER_EXPIRED
        - OFFER_WITHDRAWN
        - ORDER_CANCELLED
        - RIDER_NOT_AVAILABLE
        - ACTIVE_DELIVERY_IN_PROGRESS
        - CANNOT_GO_ONLINE
        - PAYOUT_ACCOUNT_INCOMPLETE
        - INVALID_TRANSITION
        - GEOFENCE_REQUIRED
        - STALE_POINT
        - POD_REQUIRED
        - POD_METHOD_MISMATCH
        - PICKUP_CODE_REQUIRED
        - PICKUP_CODE_INCORRECT
        - PICKUP_CODE_LOCKED
        - DELIVERY_CODE_INCORRECT
        - DELIVERY_CODE_LOCKED
        - CONTACT_WINDOW_CLOSED
        # --- handoff ----------------------------------------------------------
        - SEAL_NOT_FOUND
        - SEAL_ALREADY_BOUND
        - SEAL_NOT_BOUND
        - SEAL_TOKEN_INVALID
        - SEAL_ORDER_MISMATCH
        - SEAL_NONCE_REPLAYED
        # --- onboarding / documents ----------------------------------------------
        - STEP_NOT_AVAILABLE
        - ILLEGAL_STATE_TRANSITION
        - INCOMPLETE_DOCUMENT_PACK
        - DOCUMENT_LOCKED_FOR_REVIEW
        - DOCUMENT_ALREADY_EXPIRED
        - CONTENT_TYPE_MISMATCH
        - CHECKSUM_MISMATCH
        - IMAGE_TOO_SMALL
        - UPLOAD_NOT_FOUND
        - UNRECOGNISED_CERTIFIER
        - COORDINATES_OUTSIDE_SERVICE_AREA
        - INVALID_GST_HST_NUMBER
        - NON_CANADIAN_NUMBER
        - PRICE_OUT_OF_RANGE
        - PROHIBITED_INGREDIENT
        - FIELD_NOT_WRITABLE
        - CATEGORY_NAME_TAKEN
        - CATEGORY_NOT_EMPTY
        - ITEM_BLOCKED_BY_ADMIN
        - ITEM_DELETED
        - NO_LIVE_MENU_ITEM
        - MENU_VERSION_PENDING
        - DOCUMENTS_INCOMPLETE
        - DOCUMENT_EXPIRES_TOO_SOON
        - UNDERAGE
        - AGE_REQUIREMENT_NOT_MET
        - EMAIL_IN_USE
        - PLATE_IN_USE
        - FIELD_REQUIRED
        - FIELD_NOT_APPLICABLE
        - FIELD_NOT_EDITABLE
        - IMMUTABLE_AFTER_APPROVAL
        - RESUBMIT_TOO_SOON
        - NOTHING_TO_RESUBMIT
        # --- admin ----------------------------------------------------------------
        - REVIEW_LOCK_LOST
        - ALREADY_DECIDED
        - PRECONDITION_NOT_MET
        - CHECK_NOT_OVERRIDABLE
        - CHECKLIST_INCOMPLETE
        - CHECK_FAILED
        - HALAL_CERTIFICATE_REQUIRED
        - DUPLICATE_CERTIFICATE
        - REVERSAL_WINDOW_EXPIRED
        - REOPEN_NOT_PERMITTED_FOR_REASON
        - CASE_REQUIRED
        - ETA_EXTENSION_LIMIT
        - FORBIDDEN_PERMISSION
    Role:
      type: string
      description: |
        P-01. Roles are grants, not table membership. One person is one account no matter how
        many roles they hold. Restaurant roles are **scoped** to a `restaurant_id`; the rest
        are global.
      enum:
        - CUSTOMER
        - RIDER
        - RESTAURANT_OWNER
        - RESTAURANT_MANAGER
        - RESTAURANT_STAFF
        - SUPPORT_AGENT
        - ADMIN
        - SUPER_ADMIN
    RoleGrant:
      type: object
      additionalProperties: false
      required: [role, scope_type]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        scope_type:
          type: string
          enum: [GLOBAL, RESTAURANT]
        scope_id:
          type: [string, 'null']
          format: uuid
          description: 'The `restaurant_id` when `scope_type` is `RESTAURANT`, else null.'
    AuthMethod:
      type: string
      enum: [otp, pwd, 'pwd+totp']
      description: |
        The access token's `amr` claim. Policy, not the client, decides which methods may
        obtain which roles: an account holding both `CUSTOMER` and `ADMIN` that signs in by
        phone OTP receives a token carrying `CUSTOMER` only.
    AccountStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, BANNED, DELETED]
      description: 'Anything other than `ACTIVE` blocks new sessions and revokes existing ones within 10 s.'
    ClientSurface:
      type: string
      enum: [customer-app, rider-app, restaurant-web, admin-web, web]
    NextRoute:
      type: string
      description: |
        A closed enum the client maps to a screen. Routing is a server decision; an unknown
        value routes to "please update the app" rather than crashing.
      enum:
        - HOME
        - PROFILE_CAPTURE
        - ONBOARDING_PROFILE
        - ONBOARDING_VEHICLE
        - ONBOARDING_DOCUMENTS
        - ONBOARDING_AWAITING_REVIEW
        - ONBOARDING_REJECTED
        - ONBOARDING_PAYOUT
        - ONBOARDING_MENU
        - ACTIVE_DELIVERY
        - ORDER_TRACKING
        - SUSPENDED
        - APP_UPDATE_REQUIRED
    OrderState:
      type: string
      description: |
        P-14 — **the** order enum. Fourteen states, five terminal (`COMPLETED`, `CANCELLED`,
        `REJECTED`, `FAILED`, `RESOLVED`); `DISPUTED` is non-terminal. Rider assignment is a
        separate, subordinate `dispatch` machine that may advance this one through three named
        transitions and may **never** cancel an order.

        Every non-terminal state carries a `deadline_at` and a named `deadline_action`,
        enforced by a Postgres `CHECK` — "waits forever" is unrepresentable.

        `order.state` has exactly one writer. There is no `PUT /orders/{id}/status`; admins
        move orders only through named actions.
      enum:
        - CREATED
        - AUTHORIZED
        - RESTAURANT_PENDING
        - PREPARING
        - READY_FOR_PICKUP
        - PICKED_UP
        - ARRIVED
        - DELIVERED
        - COMPLETED
        - CANCELLED
        - REJECTED
        - FAILED
        - DISPUTED
        - RESOLVED
    OrderStatusGroup:
      type: string
      enum: [ACTIVE, PAST]
      description: '`ACTIVE` is every non-terminal state; `PAST` is the five terminal states.'
    OrderActorKind:
      type: string
      enum: [CUSTOMER, RESTAURANT, RIDER, SUPPORT, ADMIN, SYSTEM]
      description: '`SYSTEM` means the deadline runner or a webhook, never a client.'
    DispatchState:
      type: string
      description: |
        P-14. The subordinate dispatch machine, one row per order, created when the restaurant
        accepts. It may push the order forward only through `CARRYING ⇒ PICKED_UP`,
        `AT_CUSTOMER ⇒ ARRIVED` and `COMPLETED ⇒ DELIVERED`. `NO_RIDER_FOUND` arms the order's
        `READY_FOR_PICKUP` escalation instead of cancelling anything.
      enum:
        - PENDING
        - SEARCHING
        - OFFERED
        - ASSIGNED
        - AT_RESTAURANT
        - CARRYING
        - AT_CUSTOMER
        - COMPLETED
        - UNASSIGNED
        - NO_RIDER_FOUND
    DispatchOfferOutcome:
      type: string
      enum: [ACCEPTED, REJECTED, EXPIRED, WITHDRAWN]
    OfferRejectReasonCode:
      type: string
      description: |
        P-32 / D-17. A fixed taxonomy — never a free-text "rider declined". A rider who
        rejected or let an offer expire is never re-offered the same order.
      enum:
        - TOO_FAR
        - TOO_FAR_PICKUP
        - TOO_FAR_DROPOFF
        - TOO_LONG_WAIT
        - EARNINGS_TOO_LOW
        - VEHICLE_UNSUITABLE
        - RESTAURANT_TOO_SLOW
        - ENDING_SHIFT
        - PERSONAL_BREAK
        - SAFETY_CONCERN
        - ORDER_TOO_LARGE
        - OTHER
    AssignmentState:
      type: string
      description: |
        D-16 / D-20. The rider-facing view of the dispatch machine. `ARRIVED_AT_PICKUP` and
        `PICKED_UP` are deliberately distinct: conflating them destroys restaurant wait-time
        measurement. Transitions are strictly forward; repeating the current state is a 200
        no-op, a backwards transition is `409 INVALID_TRANSITION`.
      enum:
        - ASSIGNED
        - EN_ROUTE_TO_PICKUP
        - ARRIVED_AT_PICKUP
        - PICKED_UP
        - EN_ROUTE_TO_DROPOFF
        - ARRIVED_AT_DROPOFF
        - DELIVERED
        - UNDELIVERABLE
        - RETURNING
        - RETURNED
        - CANCELLED_BY_PLATFORM
        - REASSIGNED
    OfferState:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, WITHDRAWN]
    RiderAvailabilityState:
      type: string
      description: |
        D-10. The single source of truth, a column on the rider row, mutated **only** by the
        server. `ONLINE_STALE` means online in the UI but not dispatchable, because no
        location has arrived recently.
      enum: [OFFLINE, ONLINE_IDLE, ONLINE_STALE, ON_DELIVERY]
    PaymentState:
      type: string
      description: |
        P-16. Mirrors the Stripe PaymentIntent lifecycle. Auth-then-capture: the intent is
        created with `capture_method: manual`, funds are authorised at checkout and captured
        only when the restaurant accepts. A rejection or timeout **voids** the authorisation,
        so there is no refund to fail.
      enum:
        - REQUIRES_PAYMENT_METHOD
        - REQUIRES_CONFIRMATION
        - REQUIRES_ACTION
        - PROCESSING
        - REQUIRES_CAPTURE
        - SUCCEEDED
        - CANCELED
        - FAILED
    PaymentIntentKind:
      type: string
      enum: [ORDER, POST_DELIVERY_TIP, ADJUSTMENT]
      description: |
        A post-delivery tip cannot be added to an existing authorisation (incremental auth is
        card-present only), so it is a new off-session intent.
    Fulfilment:
      type: string
      enum: [DELIVERY, PICKUP]
      description: 'Pickup is modelled but not offered at V0; the delivery fee line is omitted for it.'
    HalalDisplayState:
      type: string
      description: |
        C-12 — the customer-visible derived state, **computed, never stored**. Only
        `CERTIFIED` and `EXPIRING_SOON` restaurants are visible to customers at all;
        `EXPIRED` and `UNVERIFIED` restaurants return `404` from every customer read path.

        **A missing value renders no badge** — never an optimistic one. Silence is never
        consent on a halal claim.

        Two other halal vocabularies exist in the specification (`restaurant.halal_status`
        in the platform spec and in the admin spec) and do not agree with this one; see
        `contracts/README.md` §"Spec contradictions", item 5.
      enum:
        - CERTIFIED
        - EXPIRING_SOON
        - EXPIRED
        - UNVERIFIED
    HalalCertificateStatus:
      type: string
      description: 'A-15. The admin-side lifecycle of a certificate record.'
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, REVOKED, SUPERSEDED]
    HalalCertificateScope:
      type: string
      description: |
        A-15. Only `WHOLE_ESTABLISHMENT` and `KITCHEN_ONLY` satisfy check `H6` at V0; the
        other two fail it, because the platform has no item-level halal data model and must
        not make an item-level claim.
      enum:
        - WHOLE_ESTABLISHMENT
        - KITCHEN_ONLY
        - SPECIFIC_MENU_ITEMS
        - SUPPLIER_CHAIN_ONLY
    HalalCheckKey:
      type: string
      description: |
        A-15 — the seven mandatory checks, `halal_checklist_version = 1`. Approval requires
        all seven `PASS`. `H5_DATES_VALID` and `H7_UNIQUE_NOT_REUSED` are computed by the
        server and cannot be overridden by any human.
      enum:
        - H1_LEGIBLE_COMPLETE
        - H2_ISSUER_ACCEPTED
        - H3_NAME_MATCH
        - H4_ADDRESS_MATCH
        - H5_DATES_VALID
        - H6_SCOPE_SUFFICIENT
        - H7_UNIQUE_NOT_REUSED
    HalalCheckResult:
      type: string
      enum: [PASS, FAIL, NOT_ASSESSED]
    HalalRejectionReasonCode:
      type: string
      enum:
        - ILLEGIBLE
        - EXPIRED_OR_EXPIRING
        - ISSUER_NOT_ACCEPTED
        - NAME_MISMATCH
        - ADDRESS_MISMATCH
        - SCOPE_INSUFFICIENT
        - DUPLICATE_CERTIFICATE
        - SUSPECTED_FORGERY
        - OTHER
    HalalIssuingBodyStatus:
      type: string
      description: |
        A-16. Only `ACCEPTED` satisfies check `H2`, evaluated at the moment of review.
        Suspending a body does not auto-revoke existing certificates but blocks new ones.
      enum: [PROPOSED, ACCEPTED, SUSPENDED, RETIRED, REJECTED]
    RestaurantOnboardingState:
      type: string
      description: |
        R-04. Server-owned and monotonic except for the explicit rework edge
        `DOCUMENTS_REJECTED → DOCUMENTS_PENDING`. There is no generic state-setting endpoint.
      enum:
        - REGISTERED
        - EMAIL_VERIFIED
        - PROFILE_PENDING
        - DOCUMENTS_PENDING
        - DOCUMENTS_REVIEW
        - DOCUMENTS_APPROVED
        - DOCUMENTS_REJECTED
        - PAYOUT_PENDING
        - MENU_PENDING
        - ACTIVE
        - WITHDRAWN
    RestaurantAccountState:
      type: string
      description: |
        A-2.0. Orthogonal to onboarding. These six words mean exactly this everywhere in the
        product; `suspend`, `ban`, `deactivate` and `delist` are never synonyms.
        `DELISTED` is the non-punitive system state (lapsed certificate, expired document, no
        approved menu) and clears automatically when its cause does.
      enum: [PENDING, LIVE, DELISTED, SUSPENDED, BANNED, DEACTIVATED, CLOSED]
    RestaurantOpenState:
      type: string
      description: |
        R-22. Evaluated in strict precedence. `CLOSED_OFFLINE` is the heartbeat gate: a
        restaurant whose order screen has not checked in for 5 minutes is offered nothing,
        but `is_accepting_orders` is not mutated, so service resumes the moment it reconnects.
      enum:
        - OPEN
        - PAUSED
        - CLOSED_HOURS
        - CLOSED_HOLIDAY
        - CLOSED_TOGGLE
        - CLOSED_OFFLINE
        - CLOSED_SUSPENDED
    RestaurantAvailabilityState:
      type: string
      description: |
        C-14 — the customer-facing serviceability verdict for one restaurant against one
        address. Add-to-cart is blocked for anything other than `OPEN`; browsing never is.
      enum: [OPEN, CLOSED_HOURS, PAUSED, OUT_OF_RANGE, NO_ADDRESS]
    RiderOnboardingState:
      type: string
      enum:
        - REGISTERED
        - PHONE_VERIFIED
        - PROFILE_PENDING
        - VEHICLE_PENDING
        - DOCUMENTS_PENDING
        - DOCUMENTS_REVIEW
        - DOCUMENTS_APPROVED
        - DOCUMENTS_REJECTED
        - PAYOUT_PENDING
        - ACTIVE
    RiderAccountStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, DEACTIVATED]
      description: 'Only `ACTIVE` account status **and** `ACTIVE` onboarding state can be dispatched.'
    VehicleType:
      type: string
      enum: [CAR, SCOOTER, MOTORCYCLE, BICYCLE, ON_FOOT]
      description: |
        Determines the required document set and the routing profile
        (`driving` / `cycling` / `walking`).
    RestaurantDocType:
      type: string
      description: |
        R-07, decision R-08. The SOW's "FSSAI certificate" is the Indian regulator and has no
        Canadian meaning; it is replaced by this Canadian pack. All four of
        `BUSINESS_LICENCE`, `HALAL_CERTIFICATE`, `FOOD_SAFETY` and `OWNER_ID` are required.
      enum:
        - BUSINESS_LICENCE
        - HALAL_CERTIFICATE
        - FOOD_SAFETY
        - OWNER_ID
        - LIABILITY_INSURANCE
    RiderDocType:
      type: string
      description: |
        D-05 / A-23. Motorised riders need licence, registration, insurance and a photo;
        bicycle and on-foot couriers need a government ID and a photo.
      enum:
        - DRIVERS_LICENCE
        - VEHICLE_REGISTRATION
        - VEHICLE_INSURANCE
        - GOVERNMENT_ID
        - WORK_ELIGIBILITY
        - PROFILE_PHOTO
    KycDocumentState:
      type: string
      description: 'P-29. Review has a 72-hour SLA. **No document is ever auto-approved.**'
      enum: [SUBMITTED, IN_REVIEW, APPROVED, REJECTED, EXPIRED, SUPERSEDED]
    DocumentRejectionReasonCode:
      type: string
      description: |
        R-08 / A-13 / D-06. A structured enum with rider- and restaurant-facing copy — never a
        browser `prompt()` string. `OTHER` requires a note of at least 20 characters.
      enum:
        - ILLEGIBLE
        - EXPIRED
        - WRONG_DOCUMENT_TYPE
        - NAME_MISMATCH
        - DOB_MISMATCH
        - ADDRESS_MISMATCH
        - PLATE_MISMATCH
        - UNRECOGNISED_CERTIFIER
        - SUSPECTED_FORGERY
        - SUSPECTED_ALTERATION
        - INCOMPLETE_PAGES
        - OTHER
    StoredObjectPurpose:
      type: string
      description: |
        P-27/P-28. Determines the bucket, the accepted content types, the size cap and who may
        upload. `EXPORT` objects are server-generated only — no client uploads them.
      enum: [KYC_DOCUMENT, MENU_IMAGE, POD, AVATAR, EXPORT]
    StoredObjectState:
      type: string
      enum: [PENDING, READY, REJECTED, DELETED]
      description: 'Only a `READY` object may be attached to a document, a menu item or a POD.'
    RefundKind:
      type: string
      description: |
        P-18. The caller sends **no amount** for `FULL`, `PARTIAL_ITEMS` or `FEES_ONLY` — the
        server computes it from the order. `GOODWILL` is the only kind that carries an
        explicit amount, and it is capped, action-gated and dual-approved above CAD 50.00.
      enum: [FULL, PARTIAL_ITEMS, FEES_ONLY, GOODWILL]
    RefundScope:
      type: string
      enum: [FULL, PARTIAL_ITEMS, PARTIAL_AMOUNT]
    RefundState:
      type: string
      description: |
        P-18 / A-33. `SETTLED`/`SUCCEEDED` is terminal and irreversible — there is no
        "unrefund". A `FAILED` refund pages on-call, keeps the order out of `COMPLETED`, and
        shows the customer "refund in progress", never "refunded".
      enum:
        - REQUESTED
        - PENDING_APPROVAL
        - APPROVED
        - AUTHORISED
        - SUBMITTED
        - SUCCEEDED
        - SETTLED
        - FAILED
        - DECLINED
        - CANCELLED
    RefundReasonCode:
      type: string
      description: |
        P-18 §"who is charged back" and A-33. Each code determines the liability split
        (customer refunded, restaurant charged back, rider charged back, platform absorbs) —
        the table is what makes the ledger balance. The specs enumerate overlapping sets; this
        is their reconciled union (see `contracts/README.md` §"Spec contradictions", item 8).
      enum:
        - RESTAURANT_REJECTED
        - ITEM_MISSING
        - MISSING_ITEMS
        - WRONG_ITEM
        - WRONG_ITEMS
        - FOOD_QUALITY
        - FOOD_SAFETY
        - NEVER_DELIVERED
        - ORDER_NEVER_ARRIVED
        - LATE_DELIVERY
        - DAMAGED_SPILLED
        - NO_RIDER_FOUND
        - CUSTOMER_CHANGED_MIND
        - RESTAURANT_CANCELLED
        - PLATFORM_INITIATED_CANCELLATION
        - PLATFORM_ERROR
        - DUPLICATE_CHARGE
        - CHARGED_INCORRECTLY
        - PRICING_ERROR
        - HALAL_CONCERN
        - HALAL_INTEGRITY
        - GOODWILL
        - DISPUTE_RESOLUTION
        - CHARGEBACK_PREEMPTIVE
        - OTHER
    CustomerCancellationReasonCode:
      type: string
      description: 'C-29. `OTHER` requires 5–200 characters of free text.'
      enum:
        - ORDERED_BY_MISTAKE
        - TOO_LONG_WAIT
        - WRONG_ADDRESS
        - CHANGED_MIND
        - DUPLICATE_ORDER
        - OTHER
    OrderCancellationReasonCode:
      type: string
      description: |
        The system- and staff-side cancellation vocabulary written onto `order.cancel_reason`.
        Distinct from the customer's own reason list.
      enum:
        - CUSTOMER_CANCELLED
        - RESTAURANT_TIMEOUT
        - RESTAURANT_CLOSED
        - ITEM_UNAVAILABLE
        - CAPTURE_FAILED
        - PAYMENT_EXPIRED
        - PREP_OVERDUE
        - NO_RIDER_FOUND
        - SUPPORT_CANCELLED
        - FRAUD_SUSPECTED
        - PLATFORM_ERROR
    RestaurantRejectReasonCode:
      type: string
      description: 'R-24. Required on every rejection; rejection is never implicit.'
      enum:
        - ITEM_UNAVAILABLE
        - KITCHEN_AT_CAPACITY
        - CLOSING_SOON
        - EQUIPMENT_FAILURE
        - ADDRESS_OUT_OF_RANGE
        - SUSPECTED_FRAUD
        - OTHER
    DelayReasonCode:
      type: string
      enum:
        - HIGH_VOLUME
        - INGREDIENT_PREP
        - EQUIPMENT_ISSUE
        - STAFF_SHORTAGE
        - ORDER_COMPLEXITY
        - OTHER
    RestaurantDecision:
      type: string
      enum: [APPROVE, REQUEST_CHANGES, REJECT]
    RestaurantApproveReasonCode:
      type: string
      enum: [ALL_CHECKS_PASSED, APPROVED_WITH_NOTES]
    RestaurantRejectApplicationReasonCode:
      type: string
      enum:
        - HALAL_CERTIFICATION_INVALID
        - DOCUMENTS_INSUFFICIENT
        - IDENTITY_UNVERIFIED
        - OUTSIDE_SERVICE_AREA
        - PROHIBITED_CUISINE_OR_PRODUCT
        - SUSPECTED_FRAUD
        - DUPLICATE_APPLICATION
        - WITHDRAWN_BY_APPLICANT
        - OTHER
    MenuRejectionReasonCode:
      type: string
      enum:
        - MISLEADING_DESCRIPTION
        - UNSUBSTANTIATED_HALAL_CLAIM
        - INCORRECT_DIETARY_TAG
        - MISSING_ALLERGEN
        - POOR_IMAGE_QUALITY
        - IMAGE_NOT_OF_DISH
        - PROHIBITED_ITEM
        - OFFENSIVE_CONTENT
        - OTHER
    MenuReviewStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, APPROVED, REJECTED, WITHDRAWN, SUPERSEDED]
    MenuItemAvailabilityState:
      type: string
      description: |
        R-18. Binary state with an optional auto-restock time — there are no stock counts at
        V0, and therefore no reservation semantics the platform could not honour. `BLOCKED` is
        set by an admin and cannot be cleared by the restaurant.
      enum: [AVAILABLE, OUT_OF_STOCK, HIDDEN, BLOCKED]
    VariantPricingMode:
      type: string
      description: |
        P-09 step 1. Made explicit as data so "Large = $14.99" and "Extra cheese = +$1.50"
        are both expressible without ambiguity. `ABSOLUTE` replaces the base price; `DELTA`
        adjusts it.
      enum: [ABSOLUTE, DELTA]
    DietaryTag:
      type: string
      description: |
        R-15. **`HALAL_CERTIFIED` is not restaurant-settable** — it is derived from the
        restaurant's approved certificate and applied platform-side. A restaurant asserting it
        directly receives `403 FIELD_NOT_WRITABLE`.
      enum:
        - VEGETARIAN
        - VEGAN
        - GLUTEN_FREE
        - DAIRY_FREE
        - NUT_FREE
        - HALAL_CERTIFIED
        - SPICY
        - KETO
        - LOW_CARB
    AllergenTag:
      type: string
      description: 'Health Canada priority allergens. An empty list renders "not provided", never "no allergens".'
      enum:
        - PEANUTS
        - TREE_NUTS
        - SESAME
        - MILK
        - EGGS
        - FISH
        - CRUSTACEANS_MOLLUSCS
        - SOY
        - WHEAT_TRITICALE
        - SULPHITES
        - MUSTARD
    TaxCategory:
      type: string
      description: |
        P-11. Defaults to `PREPARED_FOOD` and is admin-changeable only.
        `BEVERAGE_ALCOHOL` is rejected at menu publish until V2.
      enum:
        - PREPARED_FOOD
        - ZERO_RATED_GROCERY
        - BEVERAGE_ALCOHOL
        - DELIVERY
        - SERVICE_FEE
        - COMMISSION
    TaxKind:
      type: string
      description: |
        P-11. `HST_FEDERAL_PART` exists so the Ontario point-of-sale rebate on qualifying
        prepared food ≤ CAD 4.00 can be reconstructed for the remittance report.
      enum: [GST, HST, QST, PST, RST, HST_FEDERAL_PART]
    RemittableBy:
      type: string
      enum: [PLATFORM, RESTAURANT]
      description: 'Which party remits this tax line, driven by `restaurant.tax_role`.'
    DiscountTarget:
      type: string
      enum: [ITEMS, DELIVERY_FEE, SERVICE_FEE]
    DiscountFundedBy:
      type: string
      enum: [PLATFORM, RESTAURANT]
      description: |
        Decision R-06: **restaurant-funded** at launch, because the platform has no revenue
        line at 0% commission. Funding also decides the CRA coupon treatment and therefore
        the tax base.
    LedgerAccount:
      type: string
      description: |
        P-13, the fixed chart of accounts. Every cent that moves is a double-entry posting;
        each batch sums to zero and each order's entries sum to zero.
      enum:
        - CUSTOMER_CHARGES
        - PSP_CLEARING
        - PSP_FEES
        - RESTAURANT_PAYABLE
        - RIDER_PAYABLE
        - PLATFORM_REVENUE
        - TAX_PAYABLE
        - PROMO_EXPENSE
        - REFUNDS
        - PLATFORM_ABSORBED
    LedgerComponent:
      type: string
      enum:
        - SUBTOTAL
        - COMMISSION
        - DELIVERY_FEE
        - SERVICE_FEE
        - TAX
        - TIP
        - DISCOUNT
        - PSP_FEE
        - REFUND
    PayoutState:
      type: string
      enum: [DRAFT, READY, TRANSFERRING, TRANSFERRED, PAID, FAILED, HELD]
      description: '`HELD` carries a reason and is what `payouts_enabled=false` produces.'
    PayoutInterval:
      type: string
      enum: [DAILY, WEEKLY]
      description: 'Decision S-04: weekly, Monday, automatic, **no minimum**, for both partner types.'
    EarningEntryType:
      type: string
      enum: [DELIVERY, TIP, CANCELLATION_COMPENSATION, BONUS, ADJUSTMENT, CLAWBACK]
    EarningEntryStatus:
      type: string
      enum: [PENDING, AVAILABLE, PAID, REVERSED]
    EarningsPeriod:
      type: string
      enum: [DAY, WEEK, MONTH]
    DeliveryInstruction:
      type: string
      description: |
        The closed set named by the platform spec's own validation message (P-36). The three
        specs disagree on this vocabulary — the customer spec lists three values and the rider
        spec lists five including `CALL_ON_ARRIVAL`; see `contracts/README.md`
        §"Spec contradictions", item 6. The platform list is authoritative here.

        The proof-of-delivery method is derived from this value: met handovers require an OTP,
        unattended drops require a photo.
      enum:
        - LEAVE_AT_DOOR
        - DO_NOT_RING_BELL
        - DO_NOT_CALL
        - MEET_AT_DOOR
        - MEET_IN_LOBBY
    PodMethod:
      type: string
      description: |
        D-21. Derived from the order's delivery instruction and returned to the rider as
        `required_pod_method`. `DELIVERED` cannot commit without the artefact in the **same
        transaction** — there is no "mark delivered, upload later".

        `OTP` (a met handover) is satisfied only by the customer's delivery code: no photo
        and no statement replaces it, and when the code cannot be used the handover is
        confirmed by support (`overrideHandoverCode`), never by the rider. Where `PHOTO` is
        required, `PHOTO_WITH_ATTESTATION` (a photo with a statement) is accepted too.
      enum: [OTP, PHOTO, PHOTO_WITH_ATTESTATION]
    HandoverMethod:
      type: string
      enum: [HANDED_TO_CUSTOMER, LEFT_AT_DOOR, LEFT_WITH_RECEPTION, HANDED_TO_OTHER_PERSON]
    RouteSource:
      type: string
      enum: [ROUTED, CACHED, FALLBACK]
      description: |
        P-31. `FALLBACK` is the geodesic × 1.30 detour factor used when the routing provider
        is unavailable. The fee is never silently zero and never derived from a degrees × 111
        approximation.
    TrackingHealth:
      type: string
      enum: [HEALTHY, DEGRADED, LOST]
      description: |
        D-12. Tracking loss alone **never** auto-reassigns an assignment — only ops may
        reassign, because reassigning a rider who is actually delivering causes a double
        delivery.
    PriceBand:
      type: string
      enum: ['$', '$$', '$$$', '$$$$']
    RestaurantSort:
      type: string
      enum: [RECOMMENDED, RATING_DESC, ETA_ASC, DISTANCE_ASC]
    NotificationChannel:
      type: string
      enum: [REALTIME, PUSH, SMS, EMAIL, INAPP]
    NotificationPriority:
      type: string
      enum: [CRITICAL, HIGH, NORMAL, LOW]
    DevicePlatform:
      type: string
      enum: [ios, android, web]
    StaffStatus:
      type: string
      enum: [INVITED, ACTIVE, SUSPENDED, DEACTIVATED]
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, version, started_at]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        started_at:
          $ref: '#/components/schemas/Timestamp'
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [ready, dependencies]
      properties:
        ready:
          type: boolean
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, ready]
            properties:
              name:
                type: string
                enum: [postgres, redis, minio, stripe]
              ready:
                type: boolean
              detail:
                type: [string, 'null']
    DependencyReport:
      type: object
      additionalProperties: false
      required: [environment, dependencies, boot_probes]
      properties:
        environment:
          type: string
          enum: [local, staging, production]
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, resolved_address, connected]
            properties:
              name:
                type: string
              resolved_address:
                type: string
                description: 'The address actually resolved and connected to — not the configured string.'
              connected:
                type: boolean
        boot_probes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, passed]
            properties:
              name:
                type: string
                enum: [bucket_privacy, postgis, stripe_livemode, email_dns, sms_sender]
              passed:
                type: boolean
              detail:
                type: [string, 'null']
    PublicConfig:
      type: object
      additionalProperties: false
      required:
        - currency
        - served_provinces
        - quote_ttl_seconds
        - restaurant_response_window_seconds
        - max_tip_cents
        - support_enabled
        - default_map_center
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        served_provinces:
          type: array
          description: 'Ontario only at launch. Addresses elsewhere are rejected at quote time.'
          items:
            $ref: '#/components/schemas/Province'
        quote_ttl_seconds:
          type: integer
          format: int32
          description: '600. How long a quoted price is honoured before re-confirmation is required.'
        restaurant_response_window_seconds:
          type: integer
          format: int32
          description: |
            **180.** Reconciliation R-04 resolves the customer spec's 300 s against the
            restaurant and platform specs' 180 s in favour of 180 s: faster failure is better
            for a waiting customer, and a voided authorisation costs nothing.
        max_tip_cents:
          $ref: '#/components/schemas/Cents'
        support_enabled:
          type: boolean
        support_phone_e164:
          type: [string, 'null']
          description: 'Never hardcoded in a client. Absent when `support_enabled` is false.'
        support_hours:
          type: [string, 'null']
        default_map_center:
          type: object
          additionalProperties: false
          required: [latitude, longitude]
          properties:
            latitude:
              $ref: '#/components/schemas/Latitude'
            longitude:
              $ref: '#/components/schemas/Longitude'
        terms_version:
          type: string
    OtpRequestInput:
      type: object
      additionalProperties: false
      required: [phone_e164, purpose]
      properties:
        phone_e164:
          $ref: '#/components/schemas/PhoneE164'
        purpose:
          type: string
          enum: [SIGN_IN, PHONE_CHANGE, STEP_UP]
        device_id:
          type: [string, 'null']
          maxLength: 128
    OtpChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, resend_after_s, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        resend_after_s:
          type: integer
          format: int32
          description: 'Remaining cooldown. 60 s between sends, maximum 3 sends per challenge.'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    OtpVerifyInput:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
          description: 'Never logged, never returned, never present in an audit payload.'
        device_id:
          type: [string, 'null']
          maxLength: 128
    SessionGrant:
      type: object
      additionalProperties: false
      required: [access_token, expires_in, principal, is_new_account]
      properties:
        access_token:
          type: string
          description: 'Ed25519 JWT, 15-minute TTL. Web clients hold this **in memory only**.'
        refresh_token:
          type: [string, 'null']
          description: |
            Present for native clients only. On web surfaces the refresh token is delivered
            exclusively as the `hg_rt` cookie and this field is null.
        expires_in:
          type: integer
          format: int32
          description: 'Access-token lifetime in seconds (900).'
        is_new_account:
          type: boolean
          description: 'Lets the client route to profile capture without inventing the decision.'
        principal:
          $ref: '#/components/schemas/Principal'
    Principal:
      type: object
      additionalProperties: false
      required: [account_id, roles, amr, status, next_route]
      properties:
        account_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
        amr:
          $ref: '#/components/schemas/AuthMethod'
        status:
          $ref: '#/components/schemas/AccountStatus'
        locale:
          type: string
          enum: [en-CA, fr-CA]
        timezone:
          $ref: '#/components/schemas/Timezone'
        next_route:
          $ref: '#/components/schemas/NextRoute'
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, client, issued_at, last_used_at, is_current]
      properties:
        id:
          type: string
          format: uuid
        client:
          $ref: '#/components/schemas/ClientSurface'
        device_id:
          type: [string, 'null']
        ip_city:
          type: [string, 'null']
          description: 'Coarse location only; the raw IP is never returned to a client.'
        issued_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          $ref: '#/components/schemas/Timestamp'
        is_current:
          type: boolean
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: '#/components/schemas/Password'
        totp_code:
          type: [string, 'null']
          pattern: '^[0-9]{6}$'
    RestaurantRegistrationInput:
      type: object
      additionalProperties: false
      required: [email, password, business_name, terms_version]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: '#/components/schemas/Password'
        business_name:
          type: string
          minLength: 2
          maxLength: 120
        terms_version:
          type: string
          description: 'Must equal the server''s current version, else `409 TERMS_VERSION_STALE`.'
    RestaurantRegistration:
      type: object
      additionalProperties: false
      required: [restaurant_id, email, onboarding_state]
      properties:
        restaurant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        onboarding_state:
          $ref: '#/components/schemas/RestaurantOnboardingState'
    TotpEnrolment:
      type: object
      additionalProperties: false
      required: [provisioning_uri, recovery_codes]
      properties:
        provisioning_uri:
          type: string
          description: '`otpauth://` URI. Returned exactly once.'
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    RealtimeTicket:
      type: object
      additionalProperties: false
      required: [ticket, expires_at, websocket_url, allowed_channels]
      properties:
        ticket:
          type: string
          description: '32 random bytes, base64url. Single-use, 30-second lifetime.'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        websocket_url:
          type: string
          format: uri
          examples: ['wss://api.halalgoes.com/v1/ws']
        allowed_channels:
          type: array
          description: |
            The channels this principal may subscribe to, derived server-side from the same
            ownership predicates as the HTTP surface. Subscribing to anything else is refused.
          items:
            type: string
            examples: ['order:6b1f0a3c-2f4e-7c1a-9f00-3a1b2c3d4e5f']
    RealtimeSchemaBundle:
      type: object
      additionalProperties: false
      required: [protocol, events]
      properties:
        protocol:
          type: integer
          format: int32
        events:
          type: object
          description: 'Keyed by `{type}@v{version}`; each value is a JSON Schema for that payload.'
          additionalProperties:
            type: object
            additionalProperties: true
    CustomerProfile:
      type: object
      additionalProperties: false
      required: [account_id, first_name, phone_e164, email_verified, created_at]
      properties:
        account_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        email_verified:
          type: boolean
        phone_e164:
          $ref: '#/components/schemas/PhoneE164'
        avatar_url:
          type: [string, 'null']
          format: uri
        default_address_id:
          type: [string, 'null']
          format: uuid
        marketing_consent_at:
          type: [string, 'null']
          format: date-time
          description: 'CASL: express consent with a recorded timestamp gates every marketing send.'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CustomerProfileUpdateInput:
      type: object
      additionalProperties: false
      description: |
        Snake_case `first_name` / `last_name`; there is no `name` field at any version.
        `phone_e164` is deliberately absent — sending it is `422 UNKNOWN_FIELD`.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 50
        last_name:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        marketing_consent:
          type: boolean
    DeviceRegistrationInput:
      type: object
      additionalProperties: false
      required: [expo_push_token, device_id, platform, role_context]
      properties:
        expo_push_token:
          type: string
          maxLength: 256
        device_id:
          type: string
          maxLength: 128
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        role_context:
          $ref: '#/components/schemas/Role'
        app_version:
          type: [string, 'null']
        os_version:
          type: [string, 'null']
        locale:
          type: [string, 'null']
    Device:
      type: object
      additionalProperties: false
      required: [device_id, platform, role_context, push_enabled, last_seen_at]
      properties:
        device_id:
          type: string
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        role_context:
          $ref: '#/components/schemas/Role'
        push_enabled:
          type: boolean
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, title, body, priority, created_at, read_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: 'Maps to a row of the notification-router matrix (P-24).'
        title:
          type: string
        body:
          type: string
          description: |
            Never contains a sign-in code, a pickup or delivery code, a full address, card
            details or a token. Push and SMS pass through APNs, FCM or a carrier and show on
            the lock screen and in the notification history, so a notification that leads to
            a code says only what to do ("Your rider is here") and deep-links to the screen
            that fetches the code over the authenticated API.
        deep_link:
          type: [string, 'null']
          description: 'Names an in-app route and an entity id, so a tap always lands on the object.'
        priority:
          $ref: '#/components/schemas/NotificationPriority'
        channels_attempted:
          type: array
          description: |
            Which delivery channels were attempted for this notification. The `INAPP` row
            always exists regardless of push outcome or OS permission — push is a delivery
            optimisation, the inbox is the system of record.
          items:
            $ref: '#/components/schemas/NotificationChannel'
        order_id:
          type: [string, 'null']
          format: uuid
        created_at:
          $ref: '#/components/schemas/Timestamp'
        read_at:
          type: [string, 'null']
          format: date-time
    Address:
      type: object
      additionalProperties: false
      required:
        - id
        - line1
        - city
        - province
        - postal_code
        - country
        - latitude
        - longitude
        - timezone
        - is_default
      properties:
        id:
          type: string
          format: uuid
        label:
          type: [string, 'null']
          maxLength: 30
        line1:
          type: string
        line2:
          type: [string, 'null']
        unit:
          type: [string, 'null']
        buzzer:
          type: [string, 'null']
        city:
          type: string
        province:
          $ref: '#/components/schemas/Province'
        postal_code:
          $ref: '#/components/schemas/PostalCode'
        country:
          type: string
          enum: [CA]
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        timezone:
          $ref: '#/components/schemas/Timezone'
        delivery_notes:
          type: [string, 'null']
          maxLength: 200
        is_default:
          type: boolean
    AddressInput:
      type: object
      additionalProperties: false
      required: [line1, city, province, postal_code, latitude, longitude]
      description: |
        `country` is not settable — it is fixed to `CA`. `timezone` is derived server-side
        from the resolved point, never supplied by the client.
      properties:
        label:
          type: string
          maxLength: 30
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        unit:
          type: string
          maxLength: 32
        buzzer:
          type: string
          maxLength: 32
        city:
          type: string
          minLength: 1
          maxLength: 100
        province:
          $ref: '#/components/schemas/Province'
        postal_code:
          $ref: '#/components/schemas/PostalCode'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        delivery_notes:
          type: string
          maxLength: 200
        is_default:
          type: boolean
    AddressUpdateInput:
      type: object
      additionalProperties: false
      description: |
        Partial update — every field is optional, but the **merged** row must still satisfy
        `AddressInput`'s required set. `country` and `timezone` remain server-controlled and are
        absent here by construction.
      properties:
        label:
          type: string
          maxLength: 30
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        unit:
          type: string
          maxLength: 32
        buzzer:
          type: string
          maxLength: 32
        city:
          type: string
          minLength: 1
          maxLength: 100
        province:
          $ref: '#/components/schemas/Province'
        postal_code:
          $ref: '#/components/schemas/PostalCode'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        delivery_notes:
          type: string
          maxLength: 200
        is_default:
          type: boolean
    RestaurantAvailabilityInfo:
      type: object
      additionalProperties: false
      required: [state, distance_m]
      description: |
        C-14. One server-computed object rendered verbatim by the client, which never
        recomputes hours, distance, fees or ETA locally. Every fee here comes from
        `pricing_config`; there is no client-side arithmetic anywhere.
      properties:
        state:
          $ref: '#/components/schemas/RestaurantAvailabilityState'
        opens_at:
          type: [string, 'null']
          format: date-time
        closes_at:
          type: [string, 'null']
          format: date-time
        eta_min_minutes:
          type: [integer, 'null']
          format: int32
        eta_max_minutes:
          type: [integer, 'null']
          format: int32
        indicative_delivery_fee_cents:
          oneOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
          description: |
            Indicative only, for the card. The binding number is on the quote — a client must
            never present this as the price it is about to charge.
        minimum_order_cents:
          oneOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
        distance_m:
          type: [integer, 'null']
          format: int32
          description: 'Geodesic metres from `ST_Distance` on `geography`. Never degrees × 111.'
        out_of_range_reason:
          type: [string, 'null']
    HalalBadge:
      type: object
      additionalProperties: false
      required: [display_state]
      description: |
        C-12. When this object is absent from a payload the client renders **no badge** and
        reports a client error — there is no "assume certified" path. The label is fixed
        copy: "Halal certified", never "Halal", "100% Halal" or "Verified halal".
      properties:
        display_state:
          $ref: '#/components/schemas/HalalDisplayState'
        certifying_body_name:
          type: [string, 'null']
          description: 'Rendered as free text exactly as verified. The platform does not rank certifiers.'
        expires_on:
          type: [string, 'null']
          format: date
    RestaurantCard:
      type: object
      # `additionalProperties: false` is intentionally absent: this schema is an `allOf` base
      # (see the composed schema that extends it). In JSON Schema an `additionalProperties`
      # assertion only sees the properties of *its own* branch, so leaving it here would make
      # every extended field an error and the composed schema unsatisfiable.
      required: [id, name, halal, availability]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        hero_image_url:
          type: [string, 'null']
          format: uri
          description: 'The restaurant''s own image. A missing image renders a neutral placeholder, never a bundled photograph.'
        logo_image_url:
          type: [string, 'null']
          format: uri
        cuisines:
          type: array
          items:
            type: string
        rating_avg:
          type: [number, 'null']
          minimum: 0
          maximum: 5
          description: 'Null when `rating_count < 5`; the client renders "New" rather than inventing a number.'
        rating_count:
          type: integer
          format: int32
        price_band:
          oneOf:
            - $ref: '#/components/schemas/PriceBand'
            - type: 'null'
        halal:
          $ref: '#/components/schemas/HalalBadge'
        availability:
          $ref: '#/components/schemas/RestaurantAvailabilityInfo'
    RestaurantListMeta:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
      description: 'Standard keyset page meta.'
    FeedSection:
      type: object
      additionalProperties: false
      required: [key, title, restaurants]
      description: 'A section that would be empty is omitted from the response entirely.'
      properties:
        key:
          type: string
          enum:
            - order_again
            - restaurants_near_you
            - trending_in_your_area
            - your_favourite_restaurants
            - popular_items
            - you_might_like
        title:
          type: string
        restaurants:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantCard'
    SearchResults:
      type: object
      additionalProperties: false
      required: [restaurants, dishes]
      properties:
        restaurants:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantCard'
        dishes:
          type: array
          items:
            $ref: '#/components/schemas/DishResult'
    DishResult:
      type: object
      additionalProperties: false
      required: [menu_item_id, name, price_cents, currency, restaurant]
      properties:
        menu_item_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        image_url:
          type: [string, 'null']
          format: uri
        price_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
        restaurant:
          $ref: '#/components/schemas/RestaurantCard'
    SearchMeta:
      type: object
      additionalProperties: false
      required: [restaurants, dishes]
      description: 'Each group paginates independently, so advancing one never disturbs the other.'
      properties:
        restaurants:
          $ref: '#/components/schemas/PageMeta'
        dishes:
          $ref: '#/components/schemas/PageMeta'
        relaxation_hint:
          type: [string, 'null']
          description: 'On a zero-result filter set, names the single most restrictive filter key.'
    RestaurantDetail:
      allOf:
        - $ref: '#/components/schemas/RestaurantCard'
        - type: object
          required: [address, timezone, certification]
          properties:
            description:
              type: [string, 'null']
            address:
              $ref: '#/components/schemas/PublicAddress'
            timezone:
              $ref: '#/components/schemas/Timezone'
            public_phone_e164:
              type: [string, 'null']
              description: 'A business line, admin-verified. The owner''s personal contact is never exposed.'
            certification:
              $ref: '#/components/schemas/CertificationPanel'
            hours:
              type: array
              items:
                $ref: '#/components/schemas/TradingInterval'
    PublicAddress:
      type: object
      additionalProperties: false
      required: [line1, city, province, postal_code, latitude, longitude]
      properties:
        line1:
          type: string
        line2:
          type: [string, 'null']
        city:
          type: string
        province:
          $ref: '#/components/schemas/Province'
        postal_code:
          $ref: '#/components/schemas/PostalCode'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
    TradingInterval:
      type: object
      additionalProperties: false
      required: [day_of_week, opens_at, closes_at]
      properties:
        day_of_week:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
          description: '0 = Sunday. Evaluated in the restaurant''s own timezone.'
        opens_at:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closes_at:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        crosses_midnight:
          type: boolean
    CertificationPanel:
      type: object
      additionalProperties: false
      required: [display_state, disclaimer]
      description: |
        C-12. The platform's core promise, made inspectable. The standing disclaimer is fixed
        copy: "Certification verified by HalalGoes on {date}. HalalGoes does not itself
        certify food."
      properties:
        display_state:
          $ref: '#/components/schemas/HalalDisplayState'
        certifying_body_name:
          type: [string, 'null']
        certificate_number:
          type: [string, 'null']
        scope:
          oneOf:
            - $ref: '#/components/schemas/HalalCertificateScope'
            - type: 'null'
        issued_on:
          type: [string, 'null']
          format: date
        expires_on:
          type: [string, 'null']
          format: date
          description: 'Rendered in absolute form ("Valid until 14 March 2027"), never as "in 6 months".'
        verified_at:
          type: [string, 'null']
          format: date-time
        certificate_viewable:
          type: boolean
          description: 'Whether `createCertificateViewUrl` will succeed for this restaurant.'
        disclaimer:
          type: string
    Menu:
      type: object
      additionalProperties: false
      required: [restaurant_id, categories]
      properties:
        restaurant_id:
          type: string
          format: uuid
        categories:
          type: array
          items:
            $ref: '#/components/schemas/MenuCategoryWithItems'
    MenuCategory:
      type: object
      # `additionalProperties: false` is intentionally absent: this schema is an `allOf` base
      # (see the composed schema that extends it). In JSON Schema an `additionalProperties`
      # assertion only sees the properties of *its own* branch, so leaving it here would make
      # every extended field an error and the composed schema unsatisfiable.
      required: [id, name, sort_order, is_active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 60
        description:
          type: [string, 'null']
        sort_order:
          type: integer
          format: int32
        is_active:
          type: boolean
        item_count:
          type: integer
          format: int32
    MenuCategoryWithItems:
      allOf:
        - $ref: '#/components/schemas/MenuCategory'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MenuItem'
    MenuItem:
      type: object
      # `additionalProperties: false` is intentionally absent: this schema is an `allOf` base
      # (see the composed schema that extends it). In JSON Schema an `additionalProperties`
      # assertion only sees the properties of *its own* branch, so leaving it here would make
      # every extended field an error and the composed schema unsatisfiable.
      required: [id, name, price_cents, currency, availability_state, tax_category]
      description: |
        The customer projection of a menu item: `live_version_id` content only. `price_cents`
        is the base price; the binding line price is computed by the quote from the base, the
        chosen variant's `pricing_mode` and the chosen add-ons.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        image_url:
          type: [string, 'null']
          format: uri
        price_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
        availability_state:
          $ref: '#/components/schemas/MenuItemAvailabilityState'
        out_of_stock_until:
          type: [string, 'null']
          format: date-time
        dietary_tags:
          type: array
          items:
            $ref: '#/components/schemas/DietaryTag'
        allergen_tags:
          type: array
          description: 'An empty list renders "Allergen information not provided", never "No allergens".'
          items:
            $ref: '#/components/schemas/AllergenTag'
        ingredients_text:
          type: [string, 'null']
        tax_category:
          $ref: '#/components/schemas/TaxCategory'
        prep_minutes:
          type: [integer, 'null']
          format: int32
        variant_groups:
          type: array
          items:
            $ref: '#/components/schemas/VariantGroup'
        addon_groups:
          type: array
          items:
            $ref: '#/components/schemas/AddonGroup'
    VariantGroup:
      type: object
      additionalProperties: false
      required: [id, name, required, variants]
      description: |
        C-16. Single-select. When a group is required and no variant is flagged default,
        nothing is pre-selected and add-to-cart stays disabled — silent auto-selection of the
        first option is prohibited.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: ['Size']
        required:
          type: boolean
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
    Variant:
      type: object
      additionalProperties: false
      required: [id, name, pricing_mode, is_available]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        pricing_mode:
          $ref: '#/components/schemas/VariantPricingMode'
        price_cents:
          oneOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
          description: 'Set when `pricing_mode` is `ABSOLUTE`: replaces the item''s base price.'
        delta_cents:
          oneOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
          description: 'Set when `pricing_mode` is `DELTA`: adjusts the item''s base price.'
        is_default:
          type: boolean
        is_available:
          type: boolean
    AddonGroup:
      type: object
      additionalProperties: false
      required: [id, name, min_select, max_select, addons]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        min_select:
          type: integer
          format: int32
          minimum: 0
        max_select:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        addons:
          type: array
          items:
            $ref: '#/components/schemas/Addon'
    Addon:
      type: object
      additionalProperties: false
      required: [id, name, price_cents, is_available]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price_cents:
          $ref: '#/components/schemas/Cents'
        is_available:
          type: boolean
    Cart:
      type: object
      additionalProperties: false
      required: [id, lines, indicative_subtotal_cents, currency, is_quotable]
      description: |
        C-19. The server holds the single source of truth. Money here is **indicative** and
        exists so the badge and the floating bar can render; `createQuote` produces the only
        binding numbers.
      properties:
        id:
          type: string
          format: uuid
        restaurant:
          oneOf:
            - $ref: '#/components/schemas/RestaurantCard'
            - type: 'null'
        delivery_address_id:
          type: [string, 'null']
          format: uuid
          description: |
            Always the customer's *currently selected* address, updated whenever the selection
            changes — never `addresses[0]`.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        item_count:
          type: integer
          format: int32
          description: 'Sum of quantities, not the number of distinct lines.'
        indicative_subtotal_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
        is_quotable:
          type: boolean
          description: 'False when any line is unavailable, the restaurant is closed, or no address is selected.'
        blocking_reasons:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCode'
    CartLine:
      type: object
      additionalProperties: false
      required: [id, menu_item_id, name, quantity, unit_price_cents, line_total_cents, currency, availability]
      properties:
        id:
          type: string
          format: uuid
        menu_item_id:
          type: string
          format: uuid
        name:
          type: string
        image_url:
          type: [string, 'null']
          format: uri
        variant:
          oneOf:
            - $ref: '#/components/schemas/SelectedVariant'
            - type: 'null'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/SelectedAddon'
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
        special_request:
          type: [string, 'null']
          maxLength: 140
        unit_price_cents:
          $ref: '#/components/schemas/Cents'
        line_total_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
        availability:
          $ref: '#/components/schemas/CartLineAvailability'
    CartLineAvailability:
      type: object
      additionalProperties: false
      required: [is_available]
      description: |
        R-19. The API annotates; it **never mutates the cart on the restaurant's behalf**.
        Silent removal changes the price the customer thought they were paying, and silent
        substitution is a halal-compliance hazard.
      properties:
        is_available:
          type: boolean
        reason:
          type: [string, 'null']
          enum:
            - OUT_OF_STOCK
            - ITEM_DELETED
            - CATEGORY_INACTIVE
            - RESTAURANT_CLOSED
            - RESTAURANT_UNAVAILABLE
            - PRICE_CHANGED
            - VARIANT_UNAVAILABLE
            - ADDON_UNAVAILABLE
            - null
        current_price_cents:
          oneOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
    SelectedVariant:
      type: object
      additionalProperties: false
      required: [variant_id, name, pricing_mode]
      properties:
        variant_id:
          type: string
          format: uuid
        name:
          type: string
        pricing_mode:
          $ref: '#/components/schemas/VariantPricingMode'
    SelectedAddon:
      type: object
      additionalProperties: false
      required: [addon_id, name, quantity]
      properties:
        addon_id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
    CartLineInput:
      type: object
      additionalProperties: false
      required: [menu_item_id, quantity]
      description: |
        **Item identifiers and quantities only.** No `price`, `unit_price_cents`,
        `line_total_cents` or any other monetary field exists on this DTO — the arch-lint over
        the request-struct package and the unknown-field decoder both reject them (G-3).
      properties:
        menu_item_id:
          type: string
          format: uuid
        variant_id:
          type: [string, 'null']
          format: uuid
        addons:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [addon_id]
            properties:
              addon_id:
                type: string
                format: uuid
              quantity:
                type: integer
                format: int32
                minimum: 1
                maximum: 10
                default: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
        special_request:
          type: string
          maxLength: 140
          description: 'Advisory. Copied to the order line; never changes a price.'
    QuoteInput:
      type: object
      additionalProperties: false
      required: [cart_id, fulfilment]
      description: |
        The complete set of money-relevant inputs a client may supply. `tip_cents` is the one
        customer-chosen monetary value in the entire system (G-3), validated
        `0 ≤ tip ≤ max(2000, subtotal)` and **never taxed and never commissioned**.
        `scheduled_for` exists in the model and must be null at V0.
      properties:
        cart_id:
          type: string
          format: uuid
        delivery_address_id:
          type: [string, 'null']
          format: uuid
          description: 'Required for `DELIVERY`. The fee is measured to **this** address, not the customer''s default.'
        fulfilment:
          $ref: '#/components/schemas/Fulfilment'
        tip_cents:
          $ref: '#/components/schemas/Cents'
        promo_code:
          type: [string, 'null']
          maxLength: 32
        scheduled_for:
          type: [string, 'null']
          format: date-time
          description: 'Must be null at V0; a non-null value is rejected.'
    Quote:
      type: object
      additionalProperties: false
      required:
        - id
        - restaurant_id
        - fulfilment
        - currency
        - subtotal_cents
        - discount_items_cents
        - discount_delivery_cents
        - discount_service_cents
        - delivery_fee_cents
        - service_fee_cents
        - tax_lines
        - tax_total_cents
        - tip_cents
        - total_cents
        - lines
        - expires_at
        - created_at
      description: |
        P-09/P-10. The conservation identity is a database `CHECK`, not merely a test:

        `total = subtotal − discount_items + delivery_fee − discount_delivery +
        service_fee − discount_service + tax_total + tip`

        `discount_*_cents` are the **discount amounts**, not the payable amounts — a 10% promo
        on a $50 subtotal yields `discount_items_cents: 500` and a total reflecting $45.00,
        and the named-field split plus the conservation check make the classic inversion
        (charging $5) unrepresentable.

        The internal split (commission, restaurant net, rider earnings, platform gross) is
        computed here and frozen onto the order at acceptance; it is **not** returned to the
        customer.
      properties:
        id:
          type: string
          format: uuid
        cart_id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        delivery_address_id:
          type: [string, 'null']
          format: uuid
        fulfilment:
          $ref: '#/components/schemas/Fulfilment'
        currency:
          $ref: '#/components/schemas/Currency'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
        subtotal_cents:
          $ref: '#/components/schemas/Cents'
        discount_items_cents:
          $ref: '#/components/schemas/Cents'
        discount_delivery_cents:
          $ref: '#/components/schemas/Cents'
        discount_service_cents:
          $ref: '#/components/schemas/Cents'
        discount:
          oneOf:
            - $ref: '#/components/schemas/QuoteDiscount'
            - type: 'null'
        delivery_fee_cents:
          $ref: '#/components/schemas/Cents'
        service_fee_cents:
          $ref: '#/components/schemas/Cents'
          description: 'Labelled "Service fee" to the customer, never "platform fee". CAD 0.00 at launch (R-07).'
        tax_lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteTaxLine'
        tax_total_cents:
          $ref: '#/components/schemas/Cents'
        tip_cents:
          $ref: '#/components/schemas/Cents'
          description: '100% reaches the rider. Never enters a tax, commission or fee base.'
        total_cents:
          $ref: '#/components/schemas/Cents'
          description: 'The amount that will be authorised. The amount displayed is the amount charged.'
        billable_km:
          type: integer
          format: int32
        route_meters:
          type: integer
          format: int32
        route_source:
          $ref: '#/components/schemas/RouteSource'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: 'Ten minutes after creation. `createOrder` refuses an expired quote.'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    QuoteLine:
      type: object
      additionalProperties: false
      required:
        - line_no
        - menu_item_id
        - menu_item_name
        - quantity
        - base_price_cents
        - variant_part_cents
        - addons_part_cents
        - line_unit_cents
        - line_total_cents
        - tax_category
      description: |
        Keyed by `(quote_id, line_no)`, **not** by menu item — two lines of the same dish with
        different variants or add-on sets are therefore representable, and the order line
        copies this shape exactly, including add-ons, so add-on money can never be dropped
        between cart and order.

        Identity: `line_unit_cents = variant_part_cents + addons_part_cents` and
        `line_total_cents = line_unit_cents × quantity`, both database `CHECK`s.
      properties:
        line_no:
          type: integer
          format: int32
        menu_item_id:
          type: string
          format: uuid
        menu_item_name:
          type: string
          description: 'Snapshotted; a later rename never alters this quote or its receipt.'
        variant_id:
          type: [string, 'null']
          format: uuid
        variant_name:
          type: [string, 'null']
        variant_pricing_mode:
          oneOf:
            - $ref: '#/components/schemas/VariantPricingMode'
            - type: 'null'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLineAddon'
        quantity:
          type: integer
          format: int32
          minimum: 1
        base_price_cents:
          $ref: '#/components/schemas/Cents'
        variant_part_cents:
          $ref: '#/components/schemas/Cents'
        addons_part_cents:
          $ref: '#/components/schemas/Cents'
        line_unit_cents:
          $ref: '#/components/schemas/Cents'
        line_total_cents:
          $ref: '#/components/schemas/Cents'
        special_request:
          type: [string, 'null']
        tax_category:
          $ref: '#/components/schemas/TaxCategory'
    QuoteLineAddon:
      type: object
      additionalProperties: false
      required: [addon_id, addon_name, addon_quantity, addon_price_cents]
      properties:
        addon_id:
          type: string
          format: uuid
        addon_name:
          type: string
        addon_quantity:
          type: integer
          format: int32
          minimum: 1
        addon_price_cents:
          $ref: '#/components/schemas/Cents'
    QuoteDiscount:
      type: object
      additionalProperties: false
      required: [amount_cents, target, funded_by, reimbursable]
      description: |
        At most one discount per quote. `funded_by` and `reimbursable` are separate fields
        because they answer different questions: who bears the cost, and whether the CRA
        coupon rules tax the pre- or post-discount amount.
      properties:
        code:
          type: [string, 'null']
        amount_cents:
          $ref: '#/components/schemas/Cents'
        target:
          $ref: '#/components/schemas/DiscountTarget'
        funded_by:
          $ref: '#/components/schemas/DiscountFundedBy'
        reimbursable:
          type: boolean
          description: 'True ⇒ tax is computed on the **pre**-discount amount (a third party makes the vendor whole).'
    QuoteTaxLine:
      type: object
      additionalProperties: false
      required: [jurisdiction_code, tax_kind, statutory_label, rate, base_cents, amount_cents, remittable_by]
      description: |
        P-11. Tax is computed **once per rate over the summed base**, not per line and summed,
        which avoids per-line rounding drift; per-line attribution is derived afterwards by
        largest-remainder allocation. A province with no effective rate fails the quote with
        `TAX_PROFILE_MISSING` — it never defaults to zero.
      properties:
        jurisdiction_code:
          type: string
          examples: ['CA-ON']
        tax_kind:
          $ref: '#/components/schemas/TaxKind'
        statutory_label:
          type: string
          description: 'What the receipt prints, e.g. `HST`. Ontario shows one HST line, never "GST + PST".'
        rate:
          type: string
          description: |
            The exact rational rate as a decimal string, e.g. `"0.13000000"`. Rendered as a
            string precisely so no client parses it into a float and multiplies money by it.
          examples: ['0.13000000']
        base_cents:
          $ref: '#/components/schemas/Cents'
        amount_cents:
          $ref: '#/components/schemas/Cents'
        rebate_applied:
          type: boolean
          description: 'Ontario point-of-sale rebate on qualifying prepared food ≤ CAD 4.00.'
        remittable_by:
          $ref: '#/components/schemas/RemittableBy'
    OrderInput:
      type: object
      additionalProperties: false
      required: [quote_id]
      description: |
        **No amount, total, fee or price field exists on this DTO.** A body containing one is
        `422 UNKNOWN_FIELD`, and no order, quote or PaymentIntent is created.
      properties:
        quote_id:
          type: string
          format: uuid
        payment_method_id:
          type: [string, 'null']
          format: uuid
          description: 'Omit to use Stripe automatic payment methods (Apple Pay / Google Pay sheet).'
        save_payment_method:
          type: boolean
          default: false
          description: 'Sets `setup_future_usage` only when the customer explicitly opted in.'
        delivery_instructions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DeliveryInstruction'
        special_instructions:
          type: string
          maxLength: 200
    OrderCreated:
      type: object
      additionalProperties: false
      required: [order, client_secret]
      properties:
        order:
          $ref: '#/components/schemas/OrderCustomerView'
        client_secret:
          type: string
          description: |
            Stripe PaymentIntent client secret. The client confirms with Stripe.js or the
            Stripe React Native SDK; the card never touches our servers (SAQ-A scope).
    OrderSummary:
      type: object
      additionalProperties: false
      required: [id, code, state, restaurant, total_cents, currency, placed_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          examples: ['HG-8F3K2Q']
        state:
          $ref: '#/components/schemas/OrderState'
        restaurant:
          $ref: '#/components/schemas/OrderRestaurantRef'
        item_count:
          type: integer
          format: int32
        first_item_names:
          type: array
          maxItems: 2
          items:
            type: string
        total_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
        placed_at:
          $ref: '#/components/schemas/Timestamp'
        deadline_at:
          type: [string, 'null']
          format: date-time
          description: 'Non-null for every non-terminal state. "Waits forever" is unrepresentable.'
    OrderRestaurantRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo_image_url:
          type: [string, 'null']
          format: uri
        halal:
          $ref: '#/components/schemas/HalalBadge'
    OrderLine:
      type: object
      additionalProperties: false
      required: [line_no, menu_item_id, name, quantity, unit_price_cents, line_total_cents, currency]
      properties:
        line_no:
          type: integer
          format: int32
        menu_item_id:
          type: string
          format: uuid
        name:
          type: string
        variant_name:
          type: [string, 'null']
        addons:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLineAddon'
        quantity:
          type: integer
          format: int32
        special_request:
          type: [string, 'null']
        unit_price_cents:
          $ref: '#/components/schemas/Cents'
        line_total_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
    OrderMoney:
      type: object
      additionalProperties: false
      required:
        - subtotal_cents
        - discount_cents
        - delivery_fee_cents
        - service_fee_cents
        - tax_total_cents
        - tip_cents
        - total_cents
        - currency
      description: 'The frozen copy of the quote''s customer-facing decomposition. Renders in the fixed P-10 order.'
      properties:
        subtotal_cents:
          $ref: '#/components/schemas/Cents'
        discount_cents:
          $ref: '#/components/schemas/Cents'
        delivery_fee_cents:
          $ref: '#/components/schemas/Cents'
        service_fee_cents:
          $ref: '#/components/schemas/Cents'
        tax_lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteTaxLine'
        tax_total_cents:
          $ref: '#/components/schemas/Cents'
        tip_cents:
          $ref: '#/components/schemas/Cents'
        total_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
    OrderCustomerView:
      type: object
      # `additionalProperties: false` is intentionally absent: this schema is an `allOf` base
      # (see the composed schema that extends it). In JSON Schema an `additionalProperties`
      # assertion only sees the properties of *its own* branch, so leaving it here would make
      # every extended field an error and the composed schema unsatisfiable.
      required: [id, code, state, restaurant, lines, money, placed_at]
      description: |
        P-07. Projections are separate types per audience, never one struct with conditional
        blanking. The customer sees the rider's **public** profile and never the rider's
        earnings or record.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        state:
          $ref: '#/components/schemas/OrderState'
        state_since:
          $ref: '#/components/schemas/Timestamp'
        deadline_at:
          type: [string, 'null']
          format: date-time
        quote_id:
          type: string
          format: uuid
        restaurant:
          $ref: '#/components/schemas/OrderRestaurantRef'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        money:
          $ref: '#/components/schemas/OrderMoney'
        delivery_address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
        delivery_instructions:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryInstruction'
        special_instructions:
          type: [string, 'null']
        rider:
          oneOf:
            - $ref: '#/components/schemas/RiderPublicProfile'
            - type: 'null'
        dispatch_state:
          oneOf:
            - $ref: '#/components/schemas/DispatchState'
            - type: 'null'
        cancel_reason:
          oneOf:
            - $ref: '#/components/schemas/OrderCancellationReasonCode'
            - type: 'null'
        reject_reason:
          oneOf:
            - $ref: '#/components/schemas/RestaurantRejectReasonCode'
            - type: 'null'
        eta_at:
          type: [string, 'null']
          format: date-time
        delivery_code:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: |
            The 4-digit code the customer reads to the rider at a met handover, so the rider can
            record proof of delivery (`submitProofOfDelivery`). Set only while the order is
            `PICKED_UP` or `ARRIVED` **and** its delivery instruction is a met handover
            (`MEET_AT_DOOR` or `MEET_IN_LOBBY`, proof method `OTP`). Null in every other state,
            for an unattended drop (proof is a photo), and once five wrong codes have locked it
            (the order is then with support, who can confirm the handover with
            `overrideHandoverCode`). Only the customer's own authenticated projections carry
            it: the support projection (`OrderAdminView`, which extends the customer view)
            has it null, the rider is never sent it, and no push, SMS, email or realtime event
            carries it — the arrival push says only "Your rider is here", and the app fetches
            the code here
            ([round-2 decisions, "Orders and delivery"](https://github.com/shaiknoorullah/hg-mono/blob/main/docs/decisions/README.md#orders-and-delivery); [#180](https://github.com/shaiknoorullah/hg-mono/issues/180); [security review on #183](https://github.com/shaiknoorullah/hg-mono/issues/183)).
            Stored encrypted at rest (AES-GCM under `APP_DATA_KEY`, like `totp_secret_enc`),
            not as a hash, because the server shows it again
            ([#289](https://github.com/shaiknoorullah/hg-mono/issues/289)).
          examples: ['4827']
        can_cancel:
          type: boolean
          description: 'Server-decided. True only while cancellation is free (before restaurant acceptance).'
        placed_at:
          $ref: '#/components/schemas/Timestamp'
        accepted_at:
          type: [string, 'null']
          format: date-time
        ready_at:
          type: [string, 'null']
          format: date-time
        picked_up_at:
          type: [string, 'null']
          format: date-time
        delivered_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
    OrderRestaurantView:
      type: object
      additionalProperties: false
      required: [id, code, state, lines, money, customer, placed_at]
      description: |
        R-23 / P-07. Customer PII is minimised: first name plus last initial, a **masked**
        phone, and the delivery address **only after acceptance**. The full phone is never
        exposed; contact is proxied. Rider identity is limited to first name, last initial,
        vehicle and ETA — no phone, no exact position.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        state:
          $ref: '#/components/schemas/OrderState'
        deadline_at:
          type: [string, 'null']
          format: date-time
          description: 'For `RESTAURANT_PENDING`, the 180-second accept/reject deadline. Server-authoritative.'
        promised_ready_at:
          type: [string, 'null']
          format: date-time
        customer:
          $ref: '#/components/schemas/OrderCustomerRef'
        delivery_area:
          type: string
          description: 'City and distance band. All that is shown before acceptance.'
        delivery_address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: 'Null until the order is accepted.'
        delivery_instructions:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryInstruction'
        special_instructions:
          type: [string, 'null']
          description: 'Rendered verbatim and prominently — the highest-frequency source of order errors.'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        money:
          $ref: '#/components/schemas/RestaurantOrderMoney'
        rider:
          oneOf:
            - $ref: '#/components/schemas/OrderRiderRef'
            - type: 'null'
        pickup_code:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: |
            The 4-digit code the kitchen reads to the rider at the counter. The rider types it
            in to confirm pickup (`pickup_code` on `PickupTransitionInput`, required), which
            proves the rider and the kitchen were both there and replaces the seal scan. Set
            from acceptance while the order is `PREPARING` or `READY_FOR_PICKUP` and a rider
            will collect it; null before acceptance, after pickup, once five wrong codes have
            locked it (the order is then with support), for an order the customer collects,
            and in every terminal state. **Only the restaurant's authenticated order view
            carries it** (`getRestaurantOrder`, `listRestaurantOrders` and the restaurant's
            order actions, all restaurant-staff operations), plus the restaurant-staff
            projection of `restaurant.order_accepted` on the `restaurant:{id}` realtime
            channel, which no rider can subscribe to. The rider is never sent it, the support
            and admin projections never carry it, and no push, SMS or email does
            ([round-2 decisions, "Orders and delivery"](https://github.com/shaiknoorullah/hg-mono/blob/main/docs/decisions/README.md#orders-and-delivery);
            [#178](https://github.com/shaiknoorullah/hg-mono/issues/178);
            [security review on #183](https://github.com/shaiknoorullah/hg-mono/issues/183)).
            Stored encrypted at rest (AES-GCM under `APP_DATA_KEY`, like `totp_secret_enc`),
            not as a hash, because the server shows it again
            ([#289](https://github.com/shaiknoorullah/hg-mono/issues/289)).
          examples: ['3051']
        elapsed_seconds:
          type: integer
          format: int32
        is_late:
          type: boolean
        placed_at:
          $ref: '#/components/schemas/Timestamp'
        accepted_at:
          type: [string, 'null']
          format: date-time
        ready_at:
          type: [string, 'null']
          format: date-time
    RestaurantOrderMoney:
      type: object
      additionalProperties: false
      required: [subtotal_cents, total_cents, restaurant_net_cents, commission_cents, currency]
      description: |
        The restaurant sees what it will be paid, not the customer's rider tip. Commission is
        **0%** at launch (decision R-01) but the field exists and is switchable without a
        release.
      properties:
        subtotal_cents:
          $ref: '#/components/schemas/Cents'
        discount_cents:
          $ref: '#/components/schemas/Cents'
        commission_cents:
          $ref: '#/components/schemas/Cents'
        restaurant_net_cents:
          $ref: '#/components/schemas/Cents'
        total_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
    OrderCustomerRef:
      type: object
      additionalProperties: false
      required: [display_name, phone_masked]
      properties:
        display_name:
          type: string
          examples: ['Aisha K.']
        phone_masked:
          type: string
          examples: ['+1 416 ••• 0123']
    OrderRiderRef:
      type: object
      additionalProperties: false
      required: [display_name, vehicle_type]
      properties:
        display_name:
          type: string
        photo_url:
          type: [string, 'null']
          format: uri
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        eta_at:
          type: [string, 'null']
          format: date-time
    RiderPublicProfile:
      type: object
      additionalProperties: false
      required: [first_name, last_initial, vehicle_type]
      description: |
        Exactly these fields and no others. There is no `phone`, `email`, `earnings` or rider
        record here — the old `GET /riders/:id` leaked earnings to customers, and a contract
        test asserts those field names are absent from this schema.
      properties:
        first_name:
          type: string
        last_initial:
          type: string
          maxLength: 1
        photo_url:
          type: [string, 'null']
          format: uri
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        rating_avg:
          type: [number, 'null']
          minimum: 0
          maximum: 5
    OrderTracking:
      type: object
      additionalProperties: false
      required: [order_id, state, restaurant_location]
      properties:
        order_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/OrderState'
        dispatch_state:
          oneOf:
            - $ref: '#/components/schemas/DispatchState'
            - type: 'null'
        eta_at:
          type: [string, 'null']
          format: date-time
        eta_window_minutes:
          type: [integer, 'null']
          format: int32
          description: 'Rendered as "Arriving HH:MM–HH:MM". There is no terminal "Calculating…" state.'
        restaurant_location:
          $ref: '#/components/schemas/GeoPoint'
        destination_location:
          oneOf:
            - $ref: '#/components/schemas/GeoPoint'
            - type: 'null'
        rider_location:
          oneOf:
            - $ref: '#/components/schemas/RiderLocation'
            - type: 'null'
          description: |
            Present only while the order is `PICKED_UP` or `ARRIVED`. The rider's position en
            route to the restaurant is **not** exposed to the customer.
        rider:
          oneOf:
            - $ref: '#/components/schemas/RiderPublicProfile'
            - type: 'null'
        delivery_code:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: |
            The 4-digit code the customer reads to the rider at a met handover, so the rider can
            record proof of delivery (`submitProofOfDelivery`). Set only while the order is
            `PICKED_UP` or `ARRIVED` **and** its delivery instruction is a met handover
            (`MEET_AT_DOOR` or `MEET_IN_LOBBY`, proof method `OTP`). Null in every other state,
            for an unattended drop (proof is a photo), and once five wrong codes have locked it
            (the order is then with support). This is the polling twin of
            `OrderCustomerView.delivery_code`, on a `CUSTOMER`-only operation: the rider is never
            sent it, and no push, SMS, email or realtime event carries it
            ([round-2 decisions, "Orders and delivery"](https://github.com/shaiknoorullah/hg-mono/blob/main/docs/decisions/README.md#orders-and-delivery); [#180](https://github.com/shaiknoorullah/hg-mono/issues/180); [security review on #183](https://github.com/shaiknoorullah/hg-mono/issues/183)).
            Stored encrypted at rest (AES-GCM under `APP_DATA_KEY`, like `totp_secret_enc`),
            not as a hash, because the server shows it again
            ([#289](https://github.com/shaiknoorullah/hg-mono/issues/289)).
          examples: ['4827']
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/OrderTransition'
    OrderTransition:
      type: object
      additionalProperties: false
      required: [to_state, actor_kind, at]
      properties:
        from_state:
          oneOf:
            - $ref: '#/components/schemas/OrderState'
            - type: 'null'
        to_state:
          $ref: '#/components/schemas/OrderState'
        actor_kind:
          $ref: '#/components/schemas/OrderActorKind'
        reason:
          type: [string, 'null']
        at:
          $ref: '#/components/schemas/Timestamp'
    GeoPoint:
      type: object
      # `additionalProperties: false` is intentionally absent: this schema is an `allOf` base
      # (see the composed schema that extends it). In JSON Schema an `additionalProperties`
      # assertion only sees the properties of *its own* branch, so leaving it here would make
      # every extended field an error and the composed schema unsatisfiable.
      required: [latitude, longitude]
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
    RiderLocation:
      allOf:
        - $ref: '#/components/schemas/GeoPoint'
        - type: object
          required: [recorded_at]
          properties:
            heading_deg:
              type: [number, 'null']
            speed_mps:
              type: [number, 'null']
            accuracy_m:
              type: [number, 'null']
            recorded_at:
              $ref: '#/components/schemas/Timestamp'
            is_coarse:
              type: boolean
              description: 'True when the audience receives coordinates rounded to roughly 100 m (restaurant projection).'
    OrderCancellationInput:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code:
          $ref: '#/components/schemas/CustomerCancellationReasonCode'
        note:
          type: string
          minLength: 5
          maxLength: 200
          description: 'Required when `reason_code` is `OTHER`.'
    FoodRating:
      type: object
      additionalProperties: false
      required: [order_id, restaurant_id, score, status, created_at, updated_at]
      description: 'C-38 target 1: the order''s food, bound to the restaurant.'
      properties:
        order_id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        score:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        review:
          type: [string, 'null']
          maxLength: 1000
        tags:
          type: array
          items:
            type: string
            enum: ['Food quality', 'Portion size', 'Packaging', 'Value', 'Speed']
        status:
          $ref: '#/components/schemas/RatingStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    RiderRating:
      type: object
      additionalProperties: false
      required: [order_id, score, status, created_at, updated_at]
      description: |
        C-38 target 3: the rider. Rider ratings are never shown to the customer population
        (C-18 rule 3) — this shape is only ever returned to the customer who submitted it, on
        `getOrderRating`/`submitOrderRating`, never on a public rider profile.
      properties:
        order_id:
          type: string
          format: uuid
        score:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        comment:
          type: [string, 'null']
          maxLength: 500
        tags:
          type: array
          items:
            type: string
            enum: ['On time', 'Polite', 'Careful handling', 'Followed instructions', 'Late', 'Rude', 'Wrong drop-off']
        status:
          $ref: '#/components/schemas/RatingStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    RatingStatus:
      type: string
      enum: [PUBLISHED, PENDING_MODERATION, REMOVED]
    OrderRating:
      type: object
      additionalProperties: false
      required: [order_id, food, rider]
      description: |
        Either half may be null — "not rated yet" is a valid, non-error state (C-38: skipping is
        first-class).
      properties:
        order_id:
          type: string
          format: uuid
        food:
          oneOf:
            - $ref: '#/components/schemas/FoodRating'
            - type: 'null'
        rider:
          oneOf:
            - $ref: '#/components/schemas/RiderRating'
            - type: 'null'
    OrderRatingInput:
      type: object
      additionalProperties: false
      description: |
        Both fields are optional but at least one must be present — submitting neither is a
        client error, not a silent no-op.
      properties:
        food:
          oneOf:
            - type: object
              additionalProperties: false
              required: [score]
              properties:
                score:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 5
                review:
                  type: [string, 'null']
                  maxLength: 1000
                tags:
                  type: array
                  items:
                    type: string
                    enum: ['Food quality', 'Portion size', 'Packaging', 'Value', 'Speed']
            - type: 'null'
        rider:
          oneOf:
            - type: object
              additionalProperties: false
              required: [score]
              properties:
                score:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 5
                comment:
                  type: [string, 'null']
                  maxLength: 500
                tags:
                  type: array
                  items:
                    type: string
                    enum: ['On time', 'Polite', 'Careful handling', 'Followed instructions', 'Late', 'Rude', 'Wrong drop-off']
            - type: 'null'
    Receipt:
      type: object
      additionalProperties: false
      required: [order_id, receipt_number, issued_at, money, lines, payment]
      description: |
        P-10. Rendered from the immutable `receipt_snapshot`, never by re-querying live data —
        a later price, menu or restaurant-name change must not alter an issued receipt. The
        sum of displayed lines equals `total_cents` exactly; there is no "rounding adjustment"
        line, because there is nothing to adjust.
      properties:
        order_id:
          type: string
          format: uuid
        order_code:
          type: string
        receipt_number:
          type: string
          examples: ['HG-2026-00000123']
        issued_at:
          $ref: '#/components/schemas/Timestamp'
        platform_legal_name:
          type: string
        platform_tax_registration_number:
          type: [string, 'null']
          description: 'Rendered only when configured; a placeholder token is never printed.'
        restaurant_legal_name:
          type: string
        restaurant_tax_registration_number:
          type: [string, 'null']
          description: 'Present when the restaurant is the supplier of record.'
        delivery_address:
          oneOf:
            - $ref: '#/components/schemas/PublicAddress'
            - type: 'null'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        money:
          $ref: '#/components/schemas/OrderMoney'
        payment:
          $ref: '#/components/schemas/ReceiptPayment'
        refunds:
          type: array
          description: 'Appended as a supplementary section; the original snapshot is never touched.'
          items:
            $ref: '#/components/schemas/Refund'
        placed_at:
          $ref: '#/components/schemas/Timestamp'
        delivered_at:
          type: [string, 'null']
          format: date-time
    ReceiptPayment:
      type: object
      additionalProperties: false
      required: [amount_charged_cents, currency]
      properties:
        card_brand:
          type: [string, 'null']
        card_last4:
          type: [string, 'null']
        wallet:
          type: [string, 'null']
        amount_charged_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
    PaymentMethod:
      type: object
      additionalProperties: false
      required: [id, brand, last4, exp_month, exp_year, is_default]
      description: 'No PAN, no CVV, no full expiry beyond these display fields. Ever.'
      properties:
        id:
          type: string
          format: uuid
        brand:
          type: string
        last4:
          type: string
          pattern: '^[0-9]{4}$'
        exp_month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        exp_year:
          type: integer
          format: int32
        is_default:
          type: boolean
    SetupIntent:
      type: object
      additionalProperties: false
      required: [client_secret]
      properties:
        client_secret:
          type: string
    OrderPayment:
      type: object
      additionalProperties: false
      required: [order_id, state, amount_authorized_cents, amount_captured_cents, amount_refunded_cents, currency]
      properties:
        order_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/PaymentState'
        kind:
          $ref: '#/components/schemas/PaymentIntentKind'
        amount_authorized_cents:
          $ref: '#/components/schemas/Cents'
        amount_captured_cents:
          $ref: '#/components/schemas/Cents'
        amount_refunded_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
        card_brand:
          type: [string, 'null']
        card_last4:
          type: [string, 'null']
        wallet:
          type: [string, 'null']
        failure_code:
          type: [string, 'null']
        decline_code:
          type: [string, 'null']
          description: 'Mapped to one of a fixed set of customer messages; raw provider text is never shown.'
        client_secret:
          type: [string, 'null']
          description: 'Re-issued only while the intent still requires an action.'
        authorized_at:
          type: [string, 'null']
          format: date-time
        captured_at:
          type: [string, 'null']
          format: date-time
    RefundInput:
      type: object
      additionalProperties: false
      required: [order_id, kind, reason_code]
      description: |
        `amount_cents` is **absent from this DTO entirely** — customer- and support-initiated
        refunds never propose an amount. The admin `issueRefund` operation carries the single
        allowlisted `amount_cents` field, for `GOODWILL` only.
      properties:
        order_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/RefundKind'
        reason_code:
          $ref: '#/components/schemas/RefundReasonCode'
        lines:
          type: array
          description: 'Required for `PARTIAL_ITEMS`. Quantities only; the money is computed.'
          items:
            type: object
            additionalProperties: false
            required: [order_line_no, quantity]
            properties:
              order_line_no:
                type: integer
                format: int32
              quantity:
                type: integer
                format: int32
                minimum: 1
        note:
          type: string
          maxLength: 1000
        evidence_object_ids:
          type: array
          maxItems: 3
          items:
            type: string
            format: uuid
    Refund:
      type: object
      additionalProperties: false
      required: [id, order_id, kind, reason_code, amount_cents, currency, state, requested_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/RefundKind'
        scope:
          oneOf:
            - $ref: '#/components/schemas/RefundScope'
            - type: 'null'
        reason_code:
          $ref: '#/components/schemas/RefundReasonCode'
        amount_cents:
          $ref: '#/components/schemas/Cents'
          description: 'Server-computed for every kind except `GOODWILL`.'
        tax_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
        state:
          $ref: '#/components/schemas/RefundState'
        liability_split:
          oneOf:
            - $ref: '#/components/schemas/RefundLiabilitySplit'
            - type: 'null'
        note:
          type: [string, 'null']
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        settled_at:
          type: [string, 'null']
          format: date-time
        failure_message:
          type: [string, 'null']
    RefundLiabilitySplit:
      type: object
      additionalProperties: false
      required: [platform_cents, restaurant_cents, rider_cents]
      description: |
        P-18 / A-33. Computed at authorisation from the reason code and stored, because this
        table is what makes the ledger balance and what the bearing party may dispute.
      properties:
        platform_cents:
          $ref: '#/components/schemas/Cents'
        restaurant_cents:
          $ref: '#/components/schemas/Cents'
        rider_cents:
          $ref: '#/components/schemas/Cents'
    UploadInput:
      type: object
      additionalProperties: false
      required: [purpose, content_type, byte_size, sha256]
      description: 'The client declares what it is about to upload; the signature then binds it to exactly that.'
      properties:
        purpose:
          $ref: '#/components/schemas/StoredObjectPurpose'
        content_type:
          type: string
          examples: ['application/pdf']
        byte_size:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        order_id:
          type: [string, 'null']
          format: uuid
          description: 'Required for `POD`; the rider must own the in-flight dispatch.'
    PresignedUpload:
      type: object
      additionalProperties: false
      required: [upload_id, url, method, expires_at, required_headers]
      properties:
        upload_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        required_headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Headers the client must send verbatim, including `Content-Type`,
            `Content-Length` and `x-amz-checksum-sha256`. Altering any of them invalidates the
            signature — which is how a 1 MiB JPEG signature cannot be used to push a 9 MiB PDF.
    PresignedDownload:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: 'At most 120 s for KYC documents, 300 s for a halal certificate view.'
    StoredObject:
      type: object
      additionalProperties: false
      required: [id, purpose, state, content_type, byte_size]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/StoredObjectPurpose'
        state:
          $ref: '#/components/schemas/StoredObjectState'
        content_type:
          type: string
        byte_size:
          type: integer
          format: int64
        reject_reason:
          type: [string, 'null']
    ConnectStatus:
      type: object
      additionalProperties: false
      required: [charges_enabled, payouts_enabled, details_submitted, requirements]
      properties:
        stripe_account_id:
          type: [string, 'null']
        charges_enabled:
          type: boolean
          description: 'Stays false by design — connected accounts never take card payments directly.'
        payouts_enabled:
          type: boolean
        details_submitted:
          type: boolean
        requirements:
          type: object
          additionalProperties: false
          required: [currently_due, eventually_due, past_due]
          description: 'Surfaced verbatim from Stripe to the partner, never paraphrased or guessed at.'
          properties:
            currently_due:
              type: array
              items:
                type: string
            eventually_due:
              type: array
              items:
                type: string
            past_due:
              type: array
              items:
                type: string
            disabled_reason:
              type: [string, 'null']
            deadline:
              type: [string, 'null']
              format: date-time
        bank_last4:
          type: [string, 'null']
          description: 'Display only. No account, transit, institution number or SIN is ever stored here.'
        payout_interval:
          $ref: '#/components/schemas/PayoutInterval'
    ConnectOnboardingLink:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    Payout:
      type: object
      # `additionalProperties: false` is intentionally absent: this schema is an `allOf` base
      # (see the composed schema that extends it). In JSON Schema an `additionalProperties`
      # assertion only sees the properties of *its own* branch, so leaving it here would make
      # every extended field an error and the composed schema unsatisfiable.
      required: [id, period_start, period_end, amount_cents, currency, state]
      properties:
        id:
          type: string
          format: uuid
        period_start:
          $ref: '#/components/schemas/Timestamp'
        period_end:
          $ref: '#/components/schemas/Timestamp'
        amount_cents:
          $ref: '#/components/schemas/Cents'
          description: 'Exactly the sum of the ledger entries stamped with this payout''s id.'
        currency:
          $ref: '#/components/schemas/Currency'
        state:
          $ref: '#/components/schemas/PayoutState'
        hold_reason:
          type: [string, 'null']
        entry_count:
          type: integer
          format: int32
        paid_at:
          type: [string, 'null']
          format: date-time
        failure_message:
          type: [string, 'null']
    PayoutDetail:
      allOf:
        - $ref: '#/components/schemas/Payout'
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items:
                $ref: '#/components/schemas/EarningEntry'
    RestaurantOnboardingStatus:
      type: object
      additionalProperties: false
      required: [onboarding_state, account_state, current_step, progress_percent, steps_completed]
      properties:
        onboarding_state:
          $ref: '#/components/schemas/RestaurantOnboardingState'
        account_state:
          $ref: '#/components/schemas/RestaurantAccountState'
        current_step:
          type: string
          enum: [PROFILE, DOCUMENTS, AWAITING_REVIEW, FIX_DOCUMENTS, PAYOUT, MENU, DONE]
        progress_percent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 'Server-computed with fixed weights. The client never computes it.'
        steps_completed:
          type: object
          additionalProperties: false
          required: [profile, documents_uploaded, documents_submitted, documents_approved, payout_account, menu_published]
          properties:
            profile:
              type: boolean
            documents_uploaded:
              type: boolean
            documents_submitted:
              type: boolean
            documents_approved:
              type: boolean
            payout_account:
              type: boolean
            menu_published:
              type: boolean
        blocking_reason:
          type: [string, 'null']
        review_cycle:
          type: integer
          format: int32
        rejection:
          oneOf:
            - type: object
              additionalProperties: false
              required: [documents]
              properties:
                reason_code:
                  type: [string, 'null']
                note:
                  type: [string, 'null']
                documents:
                  type: array
                  items:
                    $ref: '#/components/schemas/KycDocument'
            - type: 'null'
    RestaurantProfile:
      type: object
      additionalProperties: false
      required: [id, legal_name, display_name, address, timezone, account_state, onboarding_state]
      properties:
        id:
          type: string
          format: uuid
        legal_name:
          type: string
        display_name:
          type: string
        description:
          type: [string, 'null']
        owner_first_name:
          type: [string, 'null']
        owner_last_name:
          type: [string, 'null']
        phone_e164:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        public_phone_e164:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        gst_hst_number:
          type: [string, 'null']
          pattern: '^[0-9]{9}RT[0-9]{4}$'
          description: 'CRA business number plus programme identifier. An Indian GSTIN is rejected.'
        address:
          $ref: '#/components/schemas/PublicAddress'
        timezone:
          $ref: '#/components/schemas/Timezone'
        cuisine_ids:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
        avg_prep_minutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 120
        delivery_radius_m:
          type: integer
          format: int32
        account_state:
          $ref: '#/components/schemas/RestaurantAccountState'
        onboarding_state:
          $ref: '#/components/schemas/RestaurantOnboardingState'
        halal:
          $ref: '#/components/schemas/HalalBadge'
        commission_rate_bps:
          type: integer
          format: int32
          readOnly: true
          description: |
            **0 at launch** (decision R-01, overriding the platform spec's 20%, the restaurant
            spec's 18% and the admin spec's 15%). Read-only to the partner and switchable
            without a release.
    RestaurantProfileInput:
      type: object
      additionalProperties: false
      required:
        - display_name
        - legal_name
        - phone_e164
        - description
        - line1
        - city
        - province
        - postal_code
        - latitude
        - longitude
        - cuisine_ids
        - avg_prep_minutes
      description: |
        Server-controlled fields (`account_state`, `onboarding_state`, `halal_status`,
        `commission_rate_bps`, `is_approved`, anything `_cents`) are **absent from this DTO**,
        so mass assignment is structurally impossible rather than filtered.
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 120
        legal_name:
          type: string
          minLength: 2
          maxLength: 120
        owner_first_name:
          type: string
          maxLength: 50
        owner_last_name:
          type: string
          maxLength: 50
        phone_e164:
          type: string
          pattern: '^\+1[2-9][0-9]{9}$'
          description: 'Canadian NANP only. The legacy `+91` default is a defect and is not ported.'
        public_phone_e164:
          type: string
          pattern: '^\+1[2-9][0-9]{9}$'
        gst_hst_number:
          type: string
          pattern: '^[0-9]{9}RT[0-9]{4}$'
        description:
          type: string
          minLength: 20
          maxLength: 1000
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        province:
          $ref: '#/components/schemas/Province'
        postal_code:
          $ref: '#/components/schemas/PostalCode'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        timezone:
          $ref: '#/components/schemas/Timezone'
        cuisine_ids:
          type: array
          minItems: 1
          maxItems: 5
          description: 'From the server-managed lookup. Free-text cuisine is rejected.'
          items:
            type: string
            format: uuid
        avg_prep_minutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 120
    RestaurantHours:
      type: object
      additionalProperties: false
      required: [timezone, intervals, overrides]
      properties:
        timezone:
          $ref: '#/components/schemas/Timezone'
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/TradingInterval'
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/HoursOverride'
    HoursOverride:
      type: object
      additionalProperties: false
      required: [date, is_closed]
      properties:
        date:
          type: string
          format: date
        is_closed:
          type: boolean
        opens_at:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closes_at:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        reason:
          type: [string, 'null']
    RestaurantHoursInput:
      type: object
      additionalProperties: false
      required: [intervals]
      properties:
        intervals:
          type: array
          maxItems: 21
          items:
            $ref: '#/components/schemas/TradingInterval'
        overrides:
          type: array
          maxItems: 90
          items:
            $ref: '#/components/schemas/HoursOverride'
    RestaurantAvailability:
      type: object
      additionalProperties: false
      required: [open_state, is_accepting_orders, reason]
      properties:
        open_state:
          $ref: '#/components/schemas/RestaurantOpenState'
        is_accepting_orders:
          type: boolean
          description: 'The stored toggle, read back from the database after any write.'
        pause_until:
          type: [string, 'null']
          format: date-time
        last_heartbeat_at:
          type: [string, 'null']
          format: date-time
        missed_order_count:
          type: integer
          format: int32
          description: 'Two consecutive expired offers force the toggle off; any accepted order resets it.'
        reason:
          type: string
          description: 'Plain language, safe to render directly.'
        resolvable_by:
          type: string
          enum: [RESTAURANT, ADMIN, TIME]
    RestaurantHeartbeat:
      type: object
      additionalProperties: false
      required: [open_state, received_at]
      properties:
        open_state:
          $ref: '#/components/schemas/RestaurantOpenState'
        received_at:
          $ref: '#/components/schemas/Timestamp'
    KycDocument:
      type: object
      additionalProperties: false
      required: [id, subject_type, doc_type, state, version, created_at]
      description: |
        P-27/P-29. Documents live in a **private** bucket and are reachable only through a
        short-lived presigned URL issued after an authorization check and written to the audit
        trail. Approving or rejecting is always attributed to a real admin account — no code
        path accepts an `admin_id` from a request body.
      properties:
        id:
          type: string
          format: uuid
        subject_type:
          type: string
          enum: [RESTAURANT, RIDER]
        subject_id:
          type: string
          format: uuid
        doc_type:
          oneOf:
            - $ref: '#/components/schemas/RestaurantDocType'
            - $ref: '#/components/schemas/RiderDocType'
        state:
          $ref: '#/components/schemas/KycDocumentState'
        issuer:
          type: [string, 'null']
        certificate_number:
          type: [string, 'null']
        issued_on:
          type: [string, 'null']
          format: date
        valid_until:
          type: [string, 'null']
          format: date
        version:
          type: integer
          format: int32
        rejection_reason_code:
          oneOf:
            - $ref: '#/components/schemas/DocumentRejectionReasonCode'
            - type: 'null'
        review_note:
          type: [string, 'null']
          description: 'Shown to the partner verbatim so remediation is unambiguous.'
        reviewed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
    RestaurantDocumentInput:
      type: object
      additionalProperties: false
      required: [doc_type, stored_object_id]
      properties:
        doc_type:
          $ref: '#/components/schemas/RestaurantDocType'
        stored_object_id:
          type: string
          format: uuid
          description: 'Must be a `READY` object owned by this restaurant.'
        issuer:
          type: string
          maxLength: 200
          description: |
            For `HALAL_CERTIFICATE` this must name a body in the accepted registry. Free text
            is what makes a halal claim unverifiable, so it is not permitted here.
        issuer_body_id:
          type: string
          format: uuid
        certificate_number:
          type: string
          maxLength: 100
        issued_on:
          type: string
          format: date
        valid_until:
          type: string
          format: date
          description: 'Required for `HALAL_CERTIFICATE`, `FOOD_SAFETY` and `OWNER_ID`; must be in the future.'
    OwnedMenu:
      type: object
      additionalProperties: false
      required: [restaurant_id, categories]
      properties:
        restaurant_id:
          type: string
          format: uuid
        categories:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/MenuCategory'
              - type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItemOwnerView'
    MenuCategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          maxLength: 500
        sort_order:
          type: integer
          format: int32
    MenuCategoryUpdateInput:
      type: object
      additionalProperties: false
      description: |
        Partial update of a menu category — every field is optional. All of it is
        operational and live at once: a category carries no halal claim and is never
        reviewed.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          maxLength: 500
        sort_order:
          type: integer
          format: int32
        is_active:
          type: boolean
    MenuItemInput:
      type: object
      additionalProperties: false
      required: [category_id, name, price_cents]
      description: |
        `price_cents` is the **one** monetary field on a partner inbound DTO. It is not a
        customer-facing price submission — it is the restaurant setting its own catalogue
        price, which the server then uses as the base for every quote. G-3 forbids a *client*
        from pricing an order, not a merchant from pricing its menu.
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 600
        ingredients_text:
          type: string
          maxLength: 1000
        price_cents:
          type: integer
          format: int64
          minimum: 50
          maximum: 50000
          description: 'CAD 0.50 – CAD 500.00. Outside the band is `422 PRICE_OUT_OF_RANGE`.'
        dietary_tags:
          type: array
          maxItems: 6
          description: '`HALAL_CERTIFIED` here is `403 FIELD_NOT_WRITABLE` — it is platform-derived.'
          items:
            $ref: '#/components/schemas/DietaryTag'
        allergen_tags:
          type: array
          items:
            $ref: '#/components/schemas/AllergenTag'
        allergens_declared:
          type: boolean
          description: 'Explicit acknowledgement that an empty allergen list is intentional.'
        image_object_id:
          type: string
          format: uuid
        prep_minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
        sort_order:
          type: integer
          format: int32
    MenuItemUpdateInput:
      type: object
      additionalProperties: false
      description: |
        Partial update — every field is optional. Operational fields (`price_cents`,
        `sort_order`, `category_id`, `prep_minutes`) apply immediately; claim-bearing fields
        (`name`, `description`, `ingredients_text`, `dietary_tags`, `allergen_tags`,
        `image_object_id`) create or replace the pending version and leave the live one alone.
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 600
        ingredients_text:
          type: string
          maxLength: 1000
        price_cents:
          type: integer
          format: int64
          minimum: 50
          maximum: 50000
        dietary_tags:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/DietaryTag'
        allergen_tags:
          type: array
          items:
            $ref: '#/components/schemas/AllergenTag'
        allergens_declared:
          type: boolean
        image_object_id:
          type: string
          format: uuid
        prep_minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
        sort_order:
          type: integer
          format: int32
    MenuItemAvailabilityInput:
      type: object
      additionalProperties: false
      required: [availability_state]
      properties:
        availability_state:
          type: string
          enum: [AVAILABLE, OUT_OF_STOCK]
          description: '`HIDDEN` and `BLOCKED` are system- and admin-set and cannot be requested here.'
        out_of_stock_until:
          type: [string, 'null']
          format: date-time
          description: 'Null means indefinitely; those items surface in the weekly stale-item digest.'
    MenuItemOwnerView:
      allOf:
        - $ref: '#/components/schemas/MenuItem'
        - type: object
          required: [category_id]
          properties:
            category_id:
              type: string
              format: uuid
            live_version:
              oneOf:
                - $ref: '#/components/schemas/MenuItemVersion'
                - type: 'null'
            pending_version:
              oneOf:
                - $ref: '#/components/schemas/MenuItemVersion'
                - type: 'null'
              description: 'Set when a claim-bearing field has been edited but not yet approved.'
            sort_order:
              type: integer
              format: int32
    MenuItemVersion:
      type: object
      additionalProperties: false
      required: [id, menu_item_id, version, review_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        menu_item_id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: [string, 'null']
        ingredients_text:
          type: [string, 'null']
        dietary_tags:
          type: array
          items:
            $ref: '#/components/schemas/DietaryTag'
        allergen_tags:
          type: array
          items:
            $ref: '#/components/schemas/AllergenTag'
        image_url:
          type: [string, 'null']
          format: uri
        review_status:
          $ref: '#/components/schemas/MenuReviewStatus'
        rejection_reason_code:
          oneOf:
            - $ref: '#/components/schemas/MenuRejectionReasonCode'
            - type: 'null'
        review_note:
          type: [string, 'null']
        submitted_at:
          type: [string, 'null']
          format: date-time
        reviewed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
    MenuVersionDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reason_code:
          $ref: '#/components/schemas/MenuRejectionReasonCode'
        review_note:
          type: string
          maxLength: 1000
          description: 'At least 20 characters when the reason code is `OTHER`.'
    OrderAcceptInput:
      type: object
      additionalProperties: false
      description: 'The only adjustable value at accept time, bounded so the kitchen cannot promise the impossible.'
      properties:
        prep_eta_minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
        accepted_note:
          type: string
          maxLength: 200
    OrderRejectInput:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code:
          $ref: '#/components/schemas/RestaurantRejectReasonCode'
        note:
          type: string
          maxLength: 500
          description: 'At least 20 characters when the reason code is `OTHER`.'
        unavailable_menu_item_ids:
          type: array
          maxItems: 50
          description: 'Prompts (never forces) marking those items out of stock.'
          items:
            type: string
            format: uuid
    OrderDelayInput:
      type: object
      additionalProperties: false
      required: [added_minutes, reason_code]
      properties:
        added_minutes:
          type: integer
          format: int32
          enum: [5, 10, 15, 20]
        reason_code:
          $ref: '#/components/schemas/DelayReasonCode'
    RiderMe:
      type: object
      additionalProperties: false
      required: [account_id, onboarding_state, account_status, availability_state, next_route]
      properties:
        account_id:
          type: string
          format: uuid
        first_name:
          type: [string, 'null']
        last_name:
          type: [string, 'null']
        phone_e164:
          $ref: '#/components/schemas/PhoneE164'
        photo_url:
          type: [string, 'null']
          format: uri
        onboarding_state:
          $ref: '#/components/schemas/RiderOnboardingState'
        account_status:
          $ref: '#/components/schemas/RiderAccountStatus'
        availability_state:
          $ref: '#/components/schemas/RiderAvailabilityState'
        vehicle:
          oneOf:
            - $ref: '#/components/schemas/RiderVehicle'
            - type: 'null'
        active_assignment_id:
          type: [string, 'null']
          format: uuid
        rating_avg:
          type: [number, 'null']
          minimum: 0
          maximum: 5
        timezone:
          $ref: '#/components/schemas/Timezone'
        next_route:
          $ref: '#/components/schemas/NextRoute'
    RiderProfile:
      type: object
      additionalProperties: false
      required: [account_id, first_name, last_name, date_of_birth]
      properties:
        account_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: [string, 'null']
          format: email
        date_of_birth:
          type: string
          format: date
          description: 'Immutable after documents are approved; changing it requires support and re-verification.'
        timezone:
          $ref: '#/components/schemas/Timezone'
    RiderProfileInput:
      type: object
      additionalProperties: false
      required: [first_name, last_name, date_of_birth]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 50
        last_name:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        date_of_birth:
          type: string
          format: date
          description: 'Age is computed server-side; under 18 is `422 UNDERAGE`. The client mirrors the rule but the server is authoritative.'
        timezone:
          $ref: '#/components/schemas/Timezone'
    RiderVehicle:
      type: object
      additionalProperties: false
      required: [id, vehicle_type, is_active]
      properties:
        id:
          type: string
          format: uuid
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        make:
          type: [string, 'null']
        model:
          type: [string, 'null']
        year:
          type: [integer, 'null']
          format: int32
        colour:
          type: [string, 'null']
        licence_plate:
          type: [string, 'null']
        is_active:
          type: boolean
    RiderVehicleInput:
      type: object
      additionalProperties: false
      required: [vehicle_type]
      description: |
        For `BICYCLE` and `ON_FOOT` the plate, make, model and year fields must be **absent**;
        supplying one is `422 FIELD_NOT_APPLICABLE` rather than a silently stored `"N/A"`.
      properties:
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        make:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 50
        year:
          type: integer
          format: int32
          minimum: 1990
        colour:
          type: string
          maxLength: 30
        licence_plate:
          type: string
          minLength: 2
          maxLength: 8
    RiderDocumentInput:
      type: object
      additionalProperties: false
      required: [doc_type, stored_object_id]
      properties:
        doc_type:
          $ref: '#/components/schemas/RiderDocType'
        stored_object_id:
          type: string
          format: uuid
        expires_on:
          type: string
          format: date
          description: 'Required for every type except `PROFILE_PHOTO`; at least 30 days in the future.'
    RiderOnboardingStatus:
      type: object
      additionalProperties: false
      required: [onboarding_state, account_status, progress_percent, next_step, documents, steps_completed]
      properties:
        onboarding_state:
          $ref: '#/components/schemas/RiderOnboardingState'
        account_status:
          $ref: '#/components/schemas/RiderAccountStatus'
        progress_percent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        next_step:
          type: string
          enum: [PROFILE, VEHICLE, DOCUMENTS, AWAITING_REVIEW, FIX_DOCUMENTS, PAYOUT, DONE]
        next_route:
          $ref: '#/components/schemas/NextRoute'
        submitted_at:
          type: [string, 'null']
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        attempt_number:
          type: integer
          format: int32
          description: 'Maximum 3 resubmissions; a fourth rejection deactivates the account.'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KycDocument'
        steps_completed:
          type: object
          additionalProperties: false
          required: [phone_verified, profile, vehicle, documents_submitted, documents_approved, payout_onboarded]
          properties:
            phone_verified:
              type: boolean
            profile:
              type: boolean
            vehicle:
              type: boolean
            documents_submitted:
              type: boolean
            documents_approved:
              type: boolean
            payout_onboarded:
              type: boolean
    RiderAvailabilityInput:
      type: object
      additionalProperties: false
      required: [is_online]
      properties:
        is_online:
          type: boolean
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        accuracy_m:
          type: number
          minimum: 0
        go_offline_after_delivery:
          type: boolean
          description: 'The supported way to end a shift while `ON_DELIVERY`.'
    RiderAvailability:
      type: object
      additionalProperties: false
      required: [availability_state, since, can_receive_offers, blocking_reasons]
      properties:
        availability_state:
          $ref: '#/components/schemas/RiderAvailabilityState'
        since:
          $ref: '#/components/schemas/Timestamp'
        can_receive_offers:
          type: boolean
        go_offline_after_delivery:
          type: boolean
        blocking_reasons:
          type: array
          description: 'Machine codes so the app can deep-link to each fix.'
          items:
            type: string
            enum:
              - ONBOARDING_INCOMPLETE
              - ACCOUNT_NOT_ACTIVE
              - PAYOUT_ACCOUNT_INCOMPLETE
              - FOREGROUND_LOCATION_PERMISSION
              - BACKGROUND_LOCATION_PERMISSION
              - NOTIFICATION_PERMISSION
              - STALE_LOCATION_FIX
              - DOCUMENT_EXPIRED
              - CONTINUOUS_ONLINE_CAP
    RiderDashboard:
      type: object
      additionalProperties: false
      required: [mode, today, active_assignment, current_offer]
      properties:
        mode:
          $ref: '#/components/schemas/RiderAvailabilityState'
        today:
          type: object
          additionalProperties: false
          required: [gross_cents, currency, trips, online_seconds]
          properties:
            gross_cents:
              $ref: '#/components/schemas/Cents'
            currency:
              $ref: '#/components/schemas/Currency'
            trips:
              type: integer
              format: int32
            online_seconds:
              type: integer
              format: int64
        active_assignment:
          oneOf:
            - $ref: '#/components/schemas/Assignment'
            - type: 'null'
        current_offer:
          oneOf:
            - $ref: '#/components/schemas/DispatchOffer'
            - type: 'null'
        tracking_health:
          oneOf:
            - $ref: '#/components/schemas/TrackingHealth'
            - type: 'null'
        blocking_reasons:
          type: array
          items:
            type: string
    RiderPositionBatchInput:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [latitude, longitude, recorded_at]
            properties:
              latitude:
                $ref: '#/components/schemas/Latitude'
              longitude:
                $ref: '#/components/schemas/Longitude'
              accuracy_m:
                type: number
                minimum: 0
              heading_deg:
                type: number
                minimum: 0
                maximum: 360
              speed_mps:
                type: number
                minimum: 0
              battery_pct:
                type: integer
                format: int32
                minimum: 0
                maximum: 100
              recorded_at:
                $ref: '#/components/schemas/Timestamp'
              assignment_id:
                type: [string, 'null']
                format: uuid
    RiderPositionAck:
      type: object
      additionalProperties: false
      required: [accepted, rejected]
      properties:
        accepted:
          type: integer
          format: int32
        rejected:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, code]
            properties:
              index:
                type: integer
                format: int32
              code:
                type: string
                enum: [STALE_POINT, FUTURE_POINT, LOW_ACCURACY]
        current_position_recorded_at:
          type: [string, 'null']
          format: date-time
    DispatchOffer:
      type: object
      additionalProperties: false
      required: [offer_id, order_id, expires_at, server_time, pickup, dropoff, earnings, items_count]
      description: |
        D-14. The **pre-accept** projection. It deliberately omits the customer's unit number
        and phone alias; only the drop-off street and neighbourhood are shown. The countdown
        is computed from `expires_at` minus `server_time`, never from a local constant.
      properties:
        offer_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/OfferState'
        wave:
          type: integer
          format: int32
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        server_time:
          $ref: '#/components/schemas/Timestamp'
          description: 'Used to correct device clock skew before rendering the countdown.'
        pickup:
          type: object
          additionalProperties: false
          required: [restaurant_name, address_short, latitude, longitude]
          properties:
            restaurant_name:
              type: string
            address_short:
              type: string
            latitude:
              $ref: '#/components/schemas/Latitude'
            longitude:
              $ref: '#/components/schemas/Longitude'
        dropoff:
          type: object
          additionalProperties: false
          required: [area, latitude, longitude]
          properties:
            area:
              type: string
              description: 'Street and neighbourhood only. The unit number arrives on accept.'
            latitude:
              $ref: '#/components/schemas/Latitude'
            longitude:
              $ref: '#/components/schemas/Longitude'
        distance_m:
          type: integer
          format: int32
        est_duration_s:
          type: integer
          format: int32
        earnings:
          $ref: '#/components/schemas/OfferEarningsEstimate'
        items_count:
          type: integer
          format: int32
    OfferEarningsEstimate:
      type: object
      additionalProperties: false
      required: [estimated_total_cents, currency]
      description: |
        Broken into components so the rider can see what they are being offered. Under the
        launch model the rider's earnings are the delivery fee as a **pure pass-through** plus
        100% of the tip (decisions S-03 and R-02, which override the specs' independent rate
        card of $3.50 + $0.80/km with a $6.00 floor — see `contracts/README.md`
        §"Spec contradictions", item 7).
      properties:
        base_cents:
          $ref: '#/components/schemas/Cents'
        distance_cents:
          $ref: '#/components/schemas/Cents'
        surge_cents:
          $ref: '#/components/schemas/Cents'
        tip_so_far_cents:
          $ref: '#/components/schemas/Cents'
        estimated_total_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
    OfferRejectInput:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code:
          $ref: '#/components/schemas/OfferRejectReasonCode'
        note:
          type: string
          minLength: 5
          maxLength: 200
          description: 'Required when the reason code is `OTHER`.'
    Assignment:
      type: object
      additionalProperties: false
      required: [id, order_id, state, pickup, dropoff, items, required_pod_method, assigned_at]
      description: |
        D-19. The **post-accept** projection: full address, unit, buzzer and the proxied phone
        alias. Item prices and order totals are never present — the order is prepaid and the
        basket value is none of the rider's business, which removes a whole class of dispute.
        Neither handover code is ever present: the rider hears the pickup code from the
        kitchen and the delivery code from the customer, and types each one in.
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        order_code:
          type: string
        state:
          $ref: '#/components/schemas/AssignmentState'
        pickup:
          type: object
          additionalProperties: false
          required: [restaurant_name, address, latitude, longitude, order_state]
          properties:
            restaurant_name:
              type: string
            address:
              type: string
            latitude:
              $ref: '#/components/schemas/Latitude'
            longitude:
              $ref: '#/components/schemas/Longitude'
            phone_alias:
              type: [string, 'null']
              description: 'A proxy number. The restaurant''s real line is never sent to the rider.'
            pickup_notes:
              type: [string, 'null']
            order_state:
              $ref: '#/components/schemas/OrderState'
        dropoff:
          type: object
          additionalProperties: false
          required: [address, latitude, longitude, customer_display_name]
          properties:
            address:
              type: string
            unit:
              type: [string, 'null']
            buzzer:
              type: [string, 'null']
            latitude:
              $ref: '#/components/schemas/Latitude'
            longitude:
              $ref: '#/components/schemas/Longitude'
            customer_display_name:
              type: string
              description: 'First name and last initial only.'
            phone_alias:
              type: [string, 'null']
              description: 'Proxy number, deactivated 30 minutes after the assignment terminates.'
            delivery_instructions:
              type: array
              items:
                $ref: '#/components/schemas/DeliveryInstruction'
            special_instructions:
              type: [string, 'null']
        items:
          type: array
          description: 'Name, quantity, variant, add-ons and notes. **No prices.**'
          items:
            type: object
            additionalProperties: false
            required: [name, quantity]
            properties:
              name:
                type: string
              quantity:
                type: integer
                format: int32
              variant_name:
                type: [string, 'null']
              addon_names:
                type: array
                items:
                  type: string
              note:
                type: [string, 'null']
              allergen_tags:
                type: array
                items:
                  $ref: '#/components/schemas/AllergenTag'
        payment_status:
          type: string
          enum: [PREPAID]
        earnings:
          $ref: '#/components/schemas/OfferEarningsEstimate'
        required_pod_method:
          $ref: '#/components/schemas/PodMethod'
        pod_recorded:
          type: boolean
        handover_method:
          oneOf:
            - $ref: '#/components/schemas/HandoverMethod'
            - type: 'null'
        tracking_health:
          $ref: '#/components/schemas/TrackingHealth'
        billable_distance_m:
          type: [integer, 'null']
          format: int32
        pickup_wait_seconds:
          type: [integer, 'null']
          format: int32
        assigned_at:
          $ref: '#/components/schemas/Timestamp'
        arrived_pickup_at:
          type: [string, 'null']
          format: date-time
        picked_up_at:
          type: [string, 'null']
          format: date-time
        arrived_dropoff_at:
          type: [string, 'null']
          format: date-time
        delivered_at:
          type: [string, 'null']
          format: date-time
    AssignmentTransitionInput:
      description: |
        One of two shapes, chosen by `to_state`. `PICKED_UP` is accepted **only** as
        `PickupTransitionInput`, whose `pickup_code` is required; every other step is
        `AssignmentStepInput`, which cannot carry `PICKED_UP` or a code. So there is no
        pickup without a code and no field a rider can use to skip one
        ([security review on #183](https://github.com/shaiknoorullah/hg-mono/issues/183)).
        See `createAssignmentTransition` for the attempt limit and what happens after it.
      oneOf:
        - $ref: '#/components/schemas/AssignmentStepInput'
        - $ref: '#/components/schemas/PickupTransitionInput'
    AssignmentStepInput:
      type: object
      additionalProperties: false
      required: [to_state, occurred_at]
      description: |
        Every rider step except `PICKED_UP`. `DELIVERED` is one of these steps, and it
        commits only on a proof of delivery already recorded with `submitProofOfDelivery`
        (`422 POD_REQUIRED` otherwise); at a met handover that proof is the customer's
        delivery code.
      properties:
        to_state:
          allOf:
            - $ref: '#/components/schemas/AssignmentState'
          not:
            enum: [PICKED_UP]
          description: 'Any `AssignmentState` except `PICKED_UP`, which is `PickupTransitionInput`.'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        accuracy_m:
          type: number
          minimum: 0
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        override_reason:
          type: string
          minLength: 5
          maxLength: 200
          description: |
            Mandatory when the geofence check fails. The step is still allowed — a rider is
            never trapped by GPS — but it is flagged for operations, and repeated overrides
            trigger a review. It covers the geofence and nothing else: it never stands in for
            a handover code or a proof of delivery.
    PickupTransitionInput:
      type: object
      additionalProperties: false
      required: [to_state, occurred_at, pickup_code]
      description: |
        The rider confirms pickup with the code the kitchen reads out. `pickup_code` is
        required, and there is no `override_reason`: a matching code is the proof that the
        rider was at the counter, so pickup has no geofence check, and when the code cannot
        be used only support or an admin can confirm the pickup (`overrideHandoverCode`).
        Wrong code: `422 PICKUP_CODE_INCORRECT`; five wrong codes per order:
        `423 PICKUP_CODE_LOCKED` and the order goes to support. See
        `createAssignmentTransition`.
      properties:
        to_state:
          type: string
          enum: [PICKED_UP]
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        accuracy_m:
          type: number
          minimum: 0
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        pickup_code:
          type: string
          pattern: '^[0-9]{4}$'
          writeOnly: true
          description: |
            The 4-digit code the kitchen reads out from its order screen
            (`OrderRestaurantView.pickup_code`). The rider is never shown it, and no response
            or error ever echoes it.
    ProofOfDeliveryInput:
      description: |
        One of three shapes, chosen by `method`, and each one requires its proof: there is
        no optional code and no method a rider can use to skip one
        ([security review on #183](https://github.com/shaiknoorullah/hg-mono/issues/183)).
        `method` must be the assignment's `required_pod_method`, except that where a photo
        is required a photo with a statement is accepted too. A met handover (`OTP`) is
        proved only by `OtpProofInput`. See `submitProofOfDelivery`.
      oneOf:
        - $ref: '#/components/schemas/OtpProofInput'
        - $ref: '#/components/schemas/PhotoProofInput'
        - $ref: '#/components/schemas/PhotoWithAttestationProofInput'
    OtpProofInput:
      type: object
      additionalProperties: false
      required: [method, otp_code]
      description: |
        A met handover (`MEET_AT_DOOR`, `MEET_IN_LOBBY`): the customer reads their delivery
        code to the rider, who types it in. Wrong code: `422 DELIVERY_CODE_INCORRECT`; five
        wrong codes per order: `423 DELIVERY_CODE_LOCKED` and the order goes to support.
      properties:
        method:
          type: string
          enum: [OTP]
        otp_code:
          type: string
          pattern: '^[0-9]{4}$'
          writeOnly: true
          description: |
            The customer's 4-digit delivery code (`OrderCustomerView.delivery_code`), read
            out by the customer. The rider is never shown it, and no response or error ever
            echoes it.
        handover_method:
          $ref: '#/components/schemas/HandoverMethod'
    PhotoProofInput:
      type: object
      additionalProperties: false
      required: [method, photo_object_id]
      description: 'An unattended drop (`LEAVE_AT_DOOR`, `DO_NOT_RING_BELL`): a photo of the placed order.'
      properties:
        method:
          type: string
          enum: [PHOTO]
        photo_object_id:
          type: string
          format: uuid
          description: 'A `READY` object with purpose `POD`, uploaded by the assigned rider.'
        handover_method:
          $ref: '#/components/schemas/HandoverMethod'
    PhotoWithAttestationProofInput:
      type: object
      additionalProperties: false
      required: [method, photo_object_id, attestation_reason]
      description: |
        An unattended drop with a statement, accepted straight away wherever a photo is
        required ([round-2 decisions, "Leave at door"](https://github.com/shaiknoorullah/hg-mono/blob/main/docs/decisions/README.md#orders-and-delivery)).
        Never accepted for a met handover: where `required_pod_method` is `OTP` it is
        `422 POD_METHOD_MISMATCH`, before or after the delivery code locks.
      properties:
        method:
          type: string
          enum: [PHOTO_WITH_ATTESTATION]
        photo_object_id:
          type: string
          format: uuid
          description: 'A `READY` object with purpose `POD`, uploaded by the assigned rider.'
        handover_method:
          $ref: '#/components/schemas/HandoverMethod'
        attestation_reason:
          type: string
          minLength: 5
          maxLength: 500
          description: "The rider's statement of where and how the order was left."
    PackageSealStatus:
      type: string
      description: |
        The seal's lifecycle. `ISSUED` is platform-known stock not yet bound to an order;
        every other member requires `order_id` and `qr_token` to be set.
      enum: [ISSUED, BOUND, PICKUP_VERIFIED, DELIVERY_VERIFIED, TAMPER_REPORTED]
    HandoffEventType:
      type: string
      enum: [SEAL, PICKUP, DELIVERY, TAMPER_REPORT]
    HandoffActor:
      type: string
      description: 'Only the rider ever scans; the customer''s only handoff event is a tamper report.'
      enum: [RESTAURANT, RIDER, CUSTOMER]
    HandoffMethod:
      type: string
      enum: [QR, OTP, PHOTO]
    SealBindInput:
      type: object
      additionalProperties: false
      required: [seal_code]
      properties:
        seal_code:
          type: string
          minLength: 4
          maxLength: 64
          description: 'The pre-coded label printed on the physical tamper-evident seal.'
    PickupScanInput:
      type: object
      additionalProperties: false
      required: [qr_token, seal_intact]
      properties:
        qr_token:
          type: string
          minLength: 16
          description: 'The signed QR payload scanned off the package.'
        seal_intact:
          type: boolean
          description: 'Visual check at the point of scan. `false` is recorded as tamper evidence; it never blocks the transition.'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        photo_object_id:
          type: string
          format: uuid
          description: 'Optional. A `READY` object with purpose `POD`, uploaded by the scanning rider.'
    DeliveryScanInput:
      type: object
      additionalProperties: false
      required: [qr_token, seal_intact]
      properties:
        qr_token:
          type: string
          minLength: 16
          description: 'The same signed QR payload scanned at pickup, scanned again at the door.'
        seal_intact:
          type: boolean
          description: 'Visual check at the point of scan. `false` is recorded as tamper evidence; it never blocks the transition.'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        photo_object_id:
          type: string
          format: uuid
          description: 'Optional. A `READY` object with purpose `POD`, uploaded by the scanning rider.'
    TamperReportInput:
      type: object
      additionalProperties: false
      required: [photo_object_id, note]
      properties:
        photo_object_id:
          type: string
          format: uuid
          description: 'A `READY` object with purpose `POD`, uploaded by the reporting customer.'
        note:
          type: string
          minLength: 5
          maxLength: 500
    PackageSeal:
      type: object
      additionalProperties: false
      required: [id, seal_code, restaurant_id, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        seal_code:
          type: string
        order_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        restaurant_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PackageSealStatus'
        qr_token:
          type: [string, 'null']
          description: 'The signed QR payload, present once `status` is no longer `ISSUED`. No price, no PII — only `{order_id, seal_id, nonce}`.'
        bound_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        pickup_verified_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        delivery_verified_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    HandoffEvent:
      type: object
      additionalProperties: false
      required: [id, order_id, type, actor, method, at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        seal_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        type:
          $ref: '#/components/schemas/HandoffEventType'
        actor:
          $ref: '#/components/schemas/HandoffActor'
        actor_account_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        method:
          $ref: '#/components/schemas/HandoffMethod'
        seal_intact:
          type: [boolean, 'null']
        latitude:
          oneOf:
            - $ref: '#/components/schemas/Latitude'
            - type: 'null'
        longitude:
          oneOf:
            - $ref: '#/components/schemas/Longitude'
            - type: 'null'
        photo_object_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        note:
          type: [string, 'null']
        at:
          $ref: '#/components/schemas/Timestamp'
    HandoffScanResult:
      type: object
      additionalProperties: false
      required: [seal, event, order_state]
      description: 'The proof and its effect: the seal''s new state, the event just appended, and the order state it gated.'
      properties:
        seal:
          $ref: '#/components/schemas/PackageSeal'
        event:
          $ref: '#/components/schemas/HandoffEvent'
        order_state:
          $ref: '#/components/schemas/OrderState'
    EarningEntry:
      type: object
      additionalProperties: false
      required: [id, type, status, gross_cents, currency, formula_version, earned_at]
      description: |
        D-26. Every component is stored, so the entry is reproducible from its inputs and its
        `formula_version`. Append-only: a correction is a new `ADJUSTMENT` or `CLAWBACK` row
        referencing this one, never a mutation.
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: [string, 'null']
          format: uuid
        order_code:
          type: [string, 'null']
        type:
          $ref: '#/components/schemas/EarningEntryType'
        status:
          $ref: '#/components/schemas/EarningEntryStatus'
        base_cents:
          $ref: '#/components/schemas/Cents'
        distance_cents:
          $ref: '#/components/schemas/Cents'
        wait_cents:
          $ref: '#/components/schemas/Cents'
        surge_multiplier:
          type: string
          description: 'Exact decimal string, frozen at offer time. Never a float.'
          examples: ['1.00']
        guarantee_topup_cents:
          $ref: '#/components/schemas/Cents'
        tip_cents:
          $ref: '#/components/schemas/Cents'
          description: '100% pass-through. A post-delivery tip creates a second `TIP` entry rather than mutating this one.'
        adjustment_cents:
          $ref: '#/components/schemas/Cents'
        gross_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
        billable_distance_m:
          type: [integer, 'null']
          format: int32
        distance_source:
          oneOf:
            - $ref: '#/components/schemas/RouteSource'
            - type: 'null'
        formula_version:
          type: integer
          format: int32
        payout_id:
          type: [string, 'null']
          format: uuid
        earned_at:
          $ref: '#/components/schemas/Timestamp'
    EarningsSummary:
      type: object
      additionalProperties: false
      required: [period, buckets, total, unpaid_balance_cents, currency]
      properties:
        period:
          $ref: '#/components/schemas/EarningsPeriod'
        buckets:
          type: array
          description: 'Zero-filled for empty periods so a chart cannot lie by omission.'
          items:
            $ref: '#/components/schemas/EarningsBucket'
        total:
          $ref: '#/components/schemas/EarningsBucket'
        unpaid_balance_cents:
          $ref: '#/components/schemas/Cents'
        next_payout_at:
          type: [string, 'null']
          format: date-time
        currency:
          $ref: '#/components/schemas/Currency'
    EarningsBucket:
      type: object
      additionalProperties: false
      required: [bucket_start, gross_cents, trips]
      properties:
        bucket_start:
          $ref: '#/components/schemas/Timestamp'
        gross_cents:
          $ref: '#/components/schemas/Cents'
        delivery_cents:
          $ref: '#/components/schemas/Cents'
        tip_cents:
          $ref: '#/components/schemas/Cents'
        bonus_cents:
          $ref: '#/components/schemas/Cents'
        adjustment_cents:
          $ref: '#/components/schemas/Cents'
        trips:
          type: integer
          format: int32
        online_seconds:
          type: integer
          format: int64
        distance_m:
          type: integer
          format: int64
        effective_cents_per_hour:
          oneOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
    StaffUser:
      type: object
      additionalProperties: false
      required: [id, email, full_name, role, status, mfa_enrolled, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/StaffStatus'
        mfa_enrolled:
          type: boolean
          description: 'Mandatory for `SUPPORT_AGENT`, `ADMIN` and `SUPER_ADMIN`; there is no grace period.'
        last_login_at:
          type: [string, 'null']
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
    StaffUserInput:
      type: object
      additionalProperties: false
      required: [email, full_name, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          minLength: 2
          maxLength: 120
        role:
          type: string
          enum: [SUPPORT_AGENT, ADMIN, SUPER_ADMIN]
    RestaurantStaffUser:
      type: object
      additionalProperties: false
      required: [id, email, full_name, role, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [RESTAURANT_MANAGER, RESTAURANT_STAFF]
        status:
          $ref: '#/components/schemas/StaffStatus'
        last_login_at:
          type: [string, 'null']
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
    RestaurantStaffUserInput:
      type: object
      additionalProperties: false
      required: [email, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          minLength: 2
          maxLength: 120
    RestaurantApplicationSummary:
      type: object
      # `additionalProperties: false` is intentionally absent: this schema is an `allOf` base
      # (see the composed schema that extends it). In JSON Schema an `additionalProperties`
      # assertion only sees the properties of *its own* branch, so leaving it here would make
      # every extended field an error and the composed schema unsatisfiable.
      required: [restaurant_id, display_name, onboarding_state, submitted_at, sla_due_at]
      properties:
        restaurant_id:
          type: string
          format: uuid
        display_name:
          type: string
        city:
          type: string
        province:
          $ref: '#/components/schemas/Province'
        onboarding_state:
          $ref: '#/components/schemas/RestaurantOnboardingState'
        submission_count:
          type: integer
          format: int32
        assigned_admin_id:
          type: [string, 'null']
          format: uuid
        review_lock_expires_at:
          type: [string, 'null']
          format: date-time
        submitted_at:
          $ref: '#/components/schemas/Timestamp'
        sla_due_at:
          $ref: '#/components/schemas/Timestamp'
          description: '48 business hours. **There is no auto-approval on breach, ever** — only a P2 case.'
    RestaurantApplication:
      allOf:
        - $ref: '#/components/schemas/RestaurantApplicationSummary'
        - type: object
          required: [profile, documents, blockers]
          properties:
            profile:
              $ref: '#/components/schemas/RestaurantProfile'
            documents:
              type: array
              items:
                $ref: '#/components/schemas/KycDocument'
            halal_certificate:
              oneOf:
                - $ref: '#/components/schemas/HalalCertificate'
                - type: 'null'
            blockers:
              type: array
              description: 'Everything currently preventing approval, evaluated live.'
              items:
                type: string
            address_pin_warning:
              type: [string, 'null']
              description: 'Soft warning when the map pin is more than 5 km from the postal-code centroid.'
    RestaurantDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, reason_code, reason_text]
      description: |
        Every state-changing admin action requires both a `reason_code` from a closed enum and
        a `reason_text`; missing either is a `422`. `reason_text` is sent verbatim to the
        restaurant — internal remarks go in `internal_note`, which is never transmitted.
      properties:
        decision:
          $ref: '#/components/schemas/RestaurantDecision'
        reason_code:
          oneOf:
            - $ref: '#/components/schemas/RestaurantApproveReasonCode'
            - $ref: '#/components/schemas/RestaurantRejectApplicationReasonCode'
        reason_text:
          type: string
          minLength: 10
          maxLength: 1000
        internal_note:
          type: string
          maxLength: 2000
        documents_to_redo:
          type: array
          description: 'Required for `REQUEST_CHANGES`: names exactly which documents to redo.'
          items:
            $ref: '#/components/schemas/RestaurantDocType'
    DocumentReviewInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        rejection_reason_code:
          $ref: '#/components/schemas/DocumentRejectionReasonCode'
        review_note:
          type: string
          maxLength: 1000
          description: 'At least 20 characters when the reason code is `OTHER`.'
        checks:
          type: array
          description: 'The recorded per-document checklist — what was actually checked, kept answerable for years.'
          items:
            type: object
            additionalProperties: false
            required: [check_key, result]
            properties:
              check_key:
                type: string
              result:
                $ref: '#/components/schemas/HalalCheckResult'
              note:
                type: string
                maxLength: 500
    HalalCertificate:
      type: object
      additionalProperties: false
      required: [id, restaurant_id, status, checklist_version, checks]
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        document_id:
          type: [string, 'null']
          format: uuid
          description: 'Withheld from support agents.'
        certificate_number:
          type: [string, 'null']
        issuing_body:
          oneOf:
            - $ref: '#/components/schemas/HalalIssuingBody'
            - type: 'null'
        certified_legal_name:
          type: [string, 'null']
        certified_address:
          type: [string, 'null']
          description: 'Withheld from support agents.'
        scope:
          oneOf:
            - $ref: '#/components/schemas/HalalCertificateScope'
            - type: 'null'
        issued_on:
          type: [string, 'null']
          format: date
        expires_on:
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/HalalCertificateStatus'
        checklist_version:
          type: integer
          format: int32
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HalalCheck'
        rejection_reason_code:
          oneOf:
            - $ref: '#/components/schemas/HalalRejectionReasonCode'
            - type: 'null'
        rejection_reason_text:
          type: [string, 'null']
        verified_by:
          type: [string, 'null']
          format: uuid
        verified_at:
          type: [string, 'null']
          format: date-time
    HalalCheck:
      type: object
      additionalProperties: false
      required: [check_key, result, overridable]
      properties:
        check_key:
          $ref: '#/components/schemas/HalalCheckKey'
        result:
          $ref: '#/components/schemas/HalalCheckResult'
        computed_result:
          oneOf:
            - $ref: '#/components/schemas/HalalCheckResult'
            - type: 'null'
          description: 'The server''s own evaluation, where the check is auto-evaluable.'
        overridable:
          type: boolean
          description: 'False for `H5_DATES_VALID` and `H7_UNIQUE_NOT_REUSED`. No human may override those.'
        note:
          type: [string, 'null']
        checked_at:
          type: [string, 'null']
          format: date-time
    HalalTranscriptionInput:
      type: object
      additionalProperties: false
      required:
        - certificate_number
        - issuing_body_id
        - certified_legal_name
        - certified_address
        - scope
        - issued_on
        - expires_on
      properties:
        certificate_number:
          type: string
          minLength: 1
          maxLength: 100
        issuing_body_id:
          type: string
          format: uuid
          description: 'From the registry. Free text is not permitted — it would make the badge meaningless.'
        certified_legal_name:
          type: string
          maxLength: 200
        certified_address:
          type: string
          maxLength: 300
        scope:
          $ref: '#/components/schemas/HalalCertificateScope'
        issued_on:
          type: string
          format: date
        expires_on:
          type: string
          format: date
    HalalChecksInput:
      type: object
      additionalProperties: false
      required: [checks]
      properties:
        checks:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [check_key, result]
            properties:
              check_key:
                $ref: '#/components/schemas/HalalCheckKey'
              result:
                $ref: '#/components/schemas/HalalCheckResult'
              note:
                type: string
                minLength: 20
                maxLength: 1000
                description: 'Mandatory for any human override of a system suggestion.'
    HalalDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, REVOKE]
        reason_code:
          $ref: '#/components/schemas/HalalRejectionReasonCode'
        reason_text:
          type: string
          minLength: 10
          maxLength: 1000
    HalalIssuingBody:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        aliases:
          type: array
          description: 'For matching what is actually printed on a certificate.'
          items:
            type: string
        country:
          type: [string, 'null']
        region:
          type: [string, 'null']
        website:
          type: [string, 'null']
          format: uri
        accreditation_ref:
          type: [string, 'null']
        requires_issuer_confirmation:
          type: boolean
          description: 'When true, an out-of-band confirmation record is required before approval.'
        status:
          $ref: '#/components/schemas/HalalIssuingBodyStatus'
        notes:
          type: [string, 'null']
    HalalIssuingBodyInput:
      type: object
      additionalProperties: false
      required: [name, justification]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        aliases:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
        country:
          type: string
          maxLength: 2
        region:
          type: string
          maxLength: 100
        website:
          type: string
          format: uri
        accreditation_ref:
          type: string
          maxLength: 200
        justification:
          type: string
          minLength: 20
          maxLength: 2000
          description: 'Mandatory. Adding a body widens what the platform will call halal.'
    HalalIssuingBodyStatusInput:
      type: object
      additionalProperties: false
      required: [status, justification]
      properties:
        status:
          $ref: '#/components/schemas/HalalIssuingBodyStatus'
        requires_issuer_confirmation:
          type: boolean
        justification:
          type: string
          minLength: 20
          maxLength: 2000
    RiderApplicationSummary:
      type: object
      # `additionalProperties: false` is intentionally absent: this schema is an `allOf` base
      # (see the composed schema that extends it). In JSON Schema an `additionalProperties`
      # assertion only sees the properties of *its own* branch, so leaving it here would make
      # every extended field an error and the composed schema unsatisfiable.
      required: [rider_account_id, display_name, onboarding_state, submitted_at, sla_due_at]
      properties:
        rider_account_id:
          type: string
          format: uuid
        display_name:
          type: string
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        onboarding_state:
          $ref: '#/components/schemas/RiderOnboardingState'
        attempt_number:
          type: integer
          format: int32
        assigned_admin_id:
          type: [string, 'null']
          format: uuid
        review_lock_expires_at:
          type: [string, 'null']
          format: date-time
        submitted_at:
          $ref: '#/components/schemas/Timestamp'
        sla_due_at:
          $ref: '#/components/schemas/Timestamp'
    RiderApplication:
      allOf:
        - $ref: '#/components/schemas/RiderApplicationSummary'
        - type: object
          required: [profile, documents, blockers]
          properties:
            profile:
              $ref: '#/components/schemas/RiderProfile'
            vehicle:
              oneOf:
                - $ref: '#/components/schemas/RiderVehicle'
                - type: 'null'
            documents:
              type: array
              items:
                $ref: '#/components/schemas/KycDocument'
            computed_age_years:
              type: [integer, 'null']
              format: int32
              description: 'Computed from the ID''s date of birth. Under 18 blocks approval and cannot be overridden.'
            blockers:
              type: array
              items:
                type: string
    RiderDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, reason_code, reason_text]
      properties:
        decision:
          $ref: '#/components/schemas/RestaurantDecision'
        reason_code:
          $ref: '#/components/schemas/DocumentRejectionReasonCode'
        reason_text:
          type: string
          minLength: 10
          maxLength: 1000
          description: 'Sent verbatim to the rider with the specific remediation step.'
        documents_to_redo:
          type: array
          items:
            $ref: '#/components/schemas/RiderDocType'
    OrderAdminView:
      allOf:
        - $ref: '#/components/schemas/OrderCustomerView'
        - type: object
          required: [timeline, payment, refunds, internal_money]
          properties:
            delivery_code:
              type: 'null'
              description: |
                Always null for support and admin. The customer's delivery code is shown
                only to the customer, so nobody at HalalGoes can read a code out to a rider;
                a handover that cannot use its code is confirmed with `overrideHandoverCode`
                instead ([security review on #183](https://github.com/shaiknoorullah/hg-mono/issues/183)).
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/OrderTransition'
            dispatch_state:
              oneOf:
                - $ref: '#/components/schemas/DispatchState'
                - type: 'null'
            dispatch_history:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [state, at]
                properties:
                  state:
                    $ref: '#/components/schemas/DispatchState'
                  wave:
                    type: [integer, 'null']
                    format: int32
                  radius_m:
                    type: [integer, 'null']
                    format: int32
                  rider_account_id:
                    type: [string, 'null']
                    format: uuid
                  offer_outcome:
                    oneOf:
                      - $ref: '#/components/schemas/DispatchOfferOutcome'
                      - type: 'null'
                  at:
                    $ref: '#/components/schemas/Timestamp'
            payment:
              $ref: '#/components/schemas/OrderPayment'
            refunds:
              type: array
              items:
                $ref: '#/components/schemas/Refund'
            internal_money:
              $ref: '#/components/schemas/OrderInternalMoney'
            pii_revealed:
              type: boolean
              description: 'True when the caller passed a justified reveal, which is itself audited.'
            restaurant_location:
              oneOf:
                - $ref: '#/components/schemas/GeoPoint'
                - type: 'null'
              description: |
                The restaurant's map coordinates, for LiveMapBox. Null only when the restaurant
                row itself has no geocoded location yet (should not happen post-onboarding).
            destination_location:
              oneOf:
                - $ref: '#/components/schemas/GeoPoint'
                - type: 'null'
              description: 'The delivery address coordinates, for LiveMapBox.'
            rider_location:
              oneOf:
                - $ref: '#/components/schemas/RiderLocation'
                - type: 'null'
              description: |
                The rider's live position. Unlike the customer-scoped OrderTracking (which hides
                this before PICKED_UP), admin sees it whenever a rider is assigned and has a
                fresh ping — admin oversight is not subject to the customer's pickup-only gate.
    OrderInternalMoney:
      type: object
      additionalProperties: false
      required: [commission_cents, restaurant_net_cents, rider_earnings_cents, platform_gross_cents, currency]
      description: |
        P-09 step 9 and P-13. The internal split, frozen at acceptance. Staff-only: it is never
        present in a customer, restaurant or rider projection. Every order's ledger entries
        sum to zero — that decomposition is the invariant this view exists to make inspectable.
      properties:
        commission_cents:
          $ref: '#/components/schemas/Cents'
        restaurant_net_cents:
          $ref: '#/components/schemas/Cents'
        rider_earnings_cents:
          $ref: '#/components/schemas/Cents'
        platform_gross_cents:
          $ref: '#/components/schemas/Cents'
        ledger_residual_cents:
          $ref: '#/components/schemas/Cents'
          description: 'Must be 0 for any order in a terminal money state. A non-zero value is an incident.'
        ledger_entries:
          type: array
          description: 'The double-entry postings for this order, in batch order. Append-only.'
          items:
            $ref: '#/components/schemas/LedgerEntry'
        currency:
          $ref: '#/components/schemas/Currency'
    AdminOrderCancellationInput:
      type: object
      additionalProperties: false
      required: [reason_code, reason_text, case_id]
      description: 'Every intervention requires a linked case — there are no context-free order mutations.'
      properties:
        reason_code:
          $ref: '#/components/schemas/OrderCancellationReasonCode'
        reason_text:
          type: string
          minLength: 10
          maxLength: 1000
        case_id:
          type: string
          format: uuid
        refund_kind:
          $ref: '#/components/schemas/RefundKind'
          description: 'Applied only when the order was already captured; ignored pre-capture, where the auth is voided.'
    HandoverCodeKind:
      type: string
      description: |
        Which handover code a support override stands in for: `PICKUP`, the code the kitchen
        reads to the rider at the counter, or `DELIVERY`, the code the customer reads to the
        rider at a met handover.
      enum: [PICKUP, DELIVERY]
    HandoverOverrideInput:
      type: object
      additionalProperties: false
      required: [handover, reason, case_id]
      description: 'Every intervention requires a linked case — there are no context-free order mutations.'
      properties:
        handover:
          $ref: '#/components/schemas/HandoverCodeKind'
        reason:
          type: string
          minLength: 10
          maxLength: 1000
          description: |
            What support checked and why the code could not be used, for example "Code
            locked after 5 tries; called the kitchen, who confirmed they handed the bag to
            the rider". Kept on the audit record and the order's timeline.
        case_id:
          type: string
          format: uuid
    HandoverOverride:
      type: object
      additionalProperties: false
      required:
        - id
        - order_id
        - handover
        - reason
        - case_id
        - actor_account_id
        - actor_kind
        - wrong_code_attempts
        - order_state
        - created_at
      description: |
        The append-only audit record `overrideHandoverCode` writes, in the same transaction
        as the transition it performs. It never contains either code.
      properties:
        id:
          type: string
          format: uuid
          description: 'The audit record. Quote it in the support case.'
        order_id:
          type: string
          format: uuid
        handover:
          $ref: '#/components/schemas/HandoverCodeKind'
        reason:
          type: string
        case_id:
          type: string
          format: uuid
        actor_account_id:
          type: string
          format: uuid
        actor_kind:
          type: string
          enum: [SUPPORT, ADMIN]
          description: '`SUPPORT` for a support agent, `ADMIN` for an admin or super admin.'
        wrong_code_attempts:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: 'How many wrong codes had been tried for this handover; 5 means the code had locked.'
        order_state:
          $ref: '#/components/schemas/OrderState'
          description: 'The order state after the override: `PICKED_UP` or `DELIVERED`.'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AdminRefundInput:
      type: object
      additionalProperties: false
      required: [order_id, scope, reason_code, reason_text]
      description: |
        `amount_cents` is the **only** inbound monetary field on any staff route and is
        accepted solely with `scope: PARTIAL_AMOUNT` and `reason_code: GOODWILL` (G-3's
        explicit allowlist). For every other scope the amount is computed from the order and
        supplying one is `422 UNKNOWN_FIELD`.
      properties:
        order_id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/RefundScope'
        reason_code:
          $ref: '#/components/schemas/RefundReasonCode'
        reason_text:
          type: string
          minLength: 10
          maxLength: 1000
        amount_cents:
          $ref: '#/components/schemas/Cents'
        line_items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [order_line_no, quantity]
            properties:
              order_line_no:
                type: integer
                format: int32
              quantity:
                type: integer
                format: int32
                minimum: 1
        case_id:
          type: [string, 'null']
          format: uuid
    RefundApprovalRequest:
      type: object
      additionalProperties: false
      required: [id, required_role, status, requested_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        proposed_amount_cents:
          $ref: '#/components/schemas/Cents'
        currency:
          $ref: '#/components/schemas/Currency'
        required_role:
          $ref: '#/components/schemas/Role'
        case_id:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [PENDING, APPROVED, DECLINED]
        requested_at:
          $ref: '#/components/schemas/Timestamp'
    LedgerEntry:
      type: object
      additionalProperties: false
      required: [account, component, amount_cents, currency, posted_at]
      description: |
        P-13. One posting. A batch's entries sum to zero (deferred constraint trigger) and an
        order's entries sum to zero once it reaches a terminal money state — that is *the*
        decomposition invariant. The table is append-only: corrections are new `ADJUSTMENT`
        batches, never updates.
      properties:
        batch_id:
          type: string
          format: uuid
        batch_kind:
          type: string
          enum: [CAPTURE, SETTLE, REFUND, PAYOUT, ADJUSTMENT, PSP_FEE]
        account:
          $ref: '#/components/schemas/LedgerAccount'
        component:
          $ref: '#/components/schemas/LedgerComponent'
        counterparty_type:
          type: [string, 'null']
          enum: [RESTAURANT, RIDER, CUSTOMER, PLATFORM, CRA, null]
        counterparty_id:
          type: [string, 'null']
          format: uuid
        amount_cents:
          $ref: '#/components/schemas/Cents'
          description: 'Signed. The sum over a batch is always exactly zero.'
        currency:
          $ref: '#/components/schemas/Currency'
        memo:
          type: [string, 'null']
        posted_at:
          $ref: '#/components/schemas/Timestamp'
