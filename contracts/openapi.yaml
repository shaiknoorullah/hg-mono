            `CART_HAS_UNAVAILABLE_ITEMS`, `ACTIVE_ORDER_EXISTS`, `RESTAURANT_UNAVAILABLE`,
            `IDEMPOTENCY_KEY_REUSE`, `IDEMPOTENCY_IN_PROGRESS`.
