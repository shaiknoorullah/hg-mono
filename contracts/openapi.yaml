        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderAcceptInput'
      responses:
        '200':
          description: Accepted, captured, and now `PREPARING`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OrderRestaurantView'
        '409':
          description: '`OFFER_EXPIRED`, `ILLEGAL_TRANSITION`, `CAPTURE_FAILED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
