  /v1/restaurant/orders/{orderId}/accept:
    post:
      operationId: acceptOrder
      tags: [restaurant]
      summary: Accept an offered order within the 180-second window
      description: |
        T6 / R-24 / P-16. One transaction: `RESTAURANT_PENDING → PREPARING`, set
        `accepted_at` and `promised_ready_at`, reset the missed-order counter, **capture**
        the authorisation for exactly `order.total_cents`, and create the dispatch row.

        If capture fails permanently the order does **not** enter `PREPARING`: it reaches
        `CANCELLED` with `cancel_reason=CAPTURE_FAILED`, no dispatch is enqueued, and the
        restaurant is told specifically that payment failed. There is no path on which a
        failed money operation lets the flow continue.

        Expiry is server-authoritative. A late accept is `409 OFFER_EXPIRED` with the final
        state — never a partial success. Closing the dialog, refreshing, or losing the
        socket never rejects an order.
      x-roles: [RESTAURANT_OWNER, RESTAURANT_MANAGER, RESTAURANT_STAFF]
      x-version: V0
      x-rate-class: MONEY
      parameters:
