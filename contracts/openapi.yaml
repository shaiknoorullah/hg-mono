            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionGrant'
        '422':
          description: '`INVALID_CREDENTIALS` (wrong current password), `BREACHED_PASSWORD`, `VALIDATION_FAILED`.'
