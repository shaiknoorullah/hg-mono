<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flipbook POC</title>
<style>
  html,body{margin:0;background:#FFFAEA}
  .spacer{height:100vh;display:grid;place-items:center;font:600 24px/1.2 system-ui;color:#1B3B31}
  .stage{position:sticky;top:0;height:100vh;display:grid;place-items:center}
  /* frame 0 as a plain <img> is the LCP candidate; the canvas replaces it after load */
  #poster,#cv{width:360px;height:480px;display:block}
  #cv{display:none}
  .track{height:400vh}
</style></head>
<body>
<div class="spacer">scroll ↓</div>
<div class="track"><div class="stage">
  <img id="poster" src="webp/q80/000.webp" width="360" height="480" fetchpriority="high" alt="Halal certified record on a phone">
  <canvas id="cv" width="720" height="960"></canvas>
</div></div>
<div class="spacer">end</div>
<script>
const N = 60, cv = document.getElementById('cv'), ctx = cv.getContext('2d', { alpha: false });
const poster = document.getElementById('poster');
const imgs = new Array(N); let decoded = 0, t0 = 0, tAll = 0;
window.__metrics = () => { const a=(window.__draws||[]).slice().sort((x,y)=>x-y); return { decoded, decodeMs: tAll, draws: a.length, meanDrawMs: a.length? +(a.reduce((s,v)=>s+v,0)/a.length).toFixed(2):0, p95DrawMs: a.length? +a[Math.floor(a.length*0.95)].toFixed(2):0, maxDrawMs: a.length? +a[a.length-1].toFixed(2):0 }; };
function start() {
  t0 = performance.now();
  let pending = N;
  for (let i = 0; i < N; i++) {
    const im = new Image();
    im.src = `webp/q80/${String(i).padStart(3,'0')}.webp`;
    im.decode().then(() => { imgs[i] = im; decoded++; if (--pending === 0) ready(); })
                .catch(() => { if (--pending === 0) ready(); });
  }
}
function ready() {
  tAll = Math.round(performance.now() - t0);
  poster.style.display = 'none'; cv.style.display = 'block';
  draw(); window.addEventListener('scroll', onScroll, { passive: true });
  window.__ready = true;
}
let raf = 0;
function onScroll(){ if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }
function draw() {
  const track = document.querySelector('.track').getBoundingClientRect();
  const p = Math.min(1, Math.max(0, -track.top / (track.height - innerHeight)));
  const i = Math.min(N - 1, Math.round(p * (N - 1)));
  const im = imgs[i]; if (!im) return;
  const s = performance.now();
  ctx.drawImage(im, 0, 0, cv.width, cv.height);
  const d = performance.now() - s;
  (window.__draws = window.__draws || []).push(d);
  window.__frame = i;
}
if (document.readyState === 'complete') start(); else addEventListener('load', start);
</script></body></html>
