# HalalGoes — the whole stack, locally, in the shape production runs in.
#
#   docker compose --env-file .env up --build
#
# Design notes that are easy to undo by accident:
#
#   * The API publishes no host port. The only way in is through Traefik, which
#     is how production works, so "it worked locally" and "it works behind the
#     proxy" cannot diverge.
#   * The API runs 2 replicas and Traefik load-balances them. Anything that only
#     works with one replica — in-memory sessions, a local rate-limit counter, a
#     per-process WebSocket registry — breaks here rather than in production.
#   * Every dependency is addressed by its compose service name, never by
#     localhost. G-7 refuses to boot on a loopback dependency outside local, and
#     /debug/deps shows the address actually connected to.
#   * /internal and /debug are blocked at the edge. They are reachable from
#     inside the network and from a `docker compose exec`, never from outside.

name: hg

x-api-env: &api-env
  # Every variable internal/config declares required appears here by name. When
  # a module adds one, it is added in both places in the same commit — P-27's
  # CI check parses this file and the config loader and fails on a mismatch,
  # because MINIO_ACCESS_SECRET vs MINIO_SECRET_KEY once made MinIO unreachable.
  HG_ENV: ${HG_ENV:?set HG_ENV in .env}
  HG_SERVICE_VERSION: ${HG_SERVICE_VERSION:-dev}
  HG_HTTP_ADDR: ":8080"
  HG_LOG_LEVEL: ${HG_LOG_LEVEL:-info}
  HG_SHUTDOWN_TIMEOUT: ${HG_SHUTDOWN_TIMEOUT:-20s}
  HG_CORS_ALLOWED_ORIGINS: ${HG_CORS_ALLOWED_ORIGINS:?set HG_CORS_ALLOWED_ORIGINS in .env}
  HG_REALTIME_MAX_SOCKETS: ${HG_REALTIME_MAX_SOCKETS:-2000}
  # Traefik's network, so the API reads the client address Traefik forwards
  # rather than Traefik's own. Required, not defaulted: this stack always runs
  # the API behind Traefik, and an empty list there makes every per-IP limit
  # one limit for the whole platform (see .env.example).
  HG_TRUSTED_PROXY_CIDRS: ${HG_TRUSTED_PROXY_CIDRS:?set HG_TRUSTED_PROXY_CIDRS in .env (see .env.example)}

  # hg logs in as hg_app: no superuser, no owner, no DDL, so it cannot switch
  # off the ledger's append-only trigger. The pgroles service below creates it.
  HG_POSTGRES_DSN: postgres://hg_app:${HG_DB_APP_PASSWORD:?set HG_DB_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  HG_POSTGRES_MAX_CONNS: ${HG_POSTGRES_MAX_CONNS:-10}
  HG_POSTGRES_MIN_CONNS: ${HG_POSTGRES_MIN_CONNS:-2}

  HG_REDIS_ADDR: redis:6379
  HG_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  HG_REDIS_DB: ${HG_REDIS_DB:-0}

  HG_MINIO_ENDPOINT: minio:9000
  HG_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
  HG_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  HG_MINIO_USE_SSL: "false"
  HG_MINIO_REGION: ${MINIO_REGION:-ca-central-1}
  # Presigned links are signed for this host, not minio:9000, which no phone or
  # browser can resolve. Required outside local.
  HG_MINIO_PRESIGN_BASE_URL: ${HG_MINIO_PRESIGN_BASE_URL:-http://localhost:${MINIO_API_PORT:-9000}}

  # auth (P-02/P-04). The auth module refuses to boot without these two — added
  # here the same commit they became required, per the P-27 parity rule above.
  HG_OTP_PEPPER: ${HG_OTP_PEPPER:?set HG_OTP_PEPPER in .env}
  HG_AUTH_SIGNING_KEY_SEED: ${HG_AUTH_SIGNING_KEY_SEED:?set HG_AUTH_SIGNING_KEY_SEED in .env}
  HG_AUTH_SIGNING_KID: ${HG_AUTH_SIGNING_KID:-k1}
  HG_AUTH_TERMS_VERSION: ${HG_AUTH_TERMS_VERSION:-2026-01}
  HG_APP_DATA_KEY: ${HG_APP_DATA_KEY:-}
  HG_AUTH_HASH_CONCURRENCY: ${HG_AUTH_HASH_CONCURRENCY:-3}
  HG_AUTH_HASH_WAIT: ${HG_AUTH_HASH_WAIT:-2s}
  HG_AUTH_HASH_MAX_WAITERS: ${HG_AUTH_HASH_MAX_WAITERS:-}

services:
  # ---------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------
  traefik:
    # Pinned by digest, the same image as the production override. v3.3 speaks
    # Docker API 1.24, which Docker 29 refuses, so routing silently 404s (#228).
    image: docker.io/library/traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    restart: unless-stopped
    command:
      - --api.dashboard=true
      # The dashboard is insecure-mode and bound to a separate port. Acceptable
      # locally; in staging or production put it behind auth or drop these lines.
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hg-net
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --ping=true
    ports:
      - "${HG_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      # Read-only: Traefik reads container labels and must never write here.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [hg-net]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # The API — 2 replicas behind Traefik
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../services/hg
      dockerfile: Dockerfile
      args:
        VERSION: ${HG_SERVICE_VERSION:-dev}
    restart: unless-stopped
    environment: *api-env
    # No container_name and no published ports: both would make replicas
    # collide, and the second one is the point.
    deploy:
      replicas: 2
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      pgroles:
        condition: service_completed_successfully
    networks: [hg-net]
    labels:
      - traefik.enable=true
      - traefik.docker.network=hg-net

      # Public router: everything the contract exposes.
      - traefik.http.routers.hg-api.rule=PathPrefix(`/`)
      - traefik.http.routers.hg-api.entrypoints=web
      - traefik.http.routers.hg-api.priority=1
      - traefik.http.routers.hg-api.service=hg-api

      # Diagnostics router: same service, higher priority, blocked at the edge.
      # G-7 says /internal/deps is never exposed through Traefik to the public
      # internet; the allowlist makes that a proxy rule rather than a promise.
      - traefik.http.routers.hg-internal.rule=PathPrefix(`/internal`) || PathPrefix(`/debug`)
      - traefik.http.routers.hg-internal.entrypoints=web
      - traefik.http.routers.hg-internal.priority=10
      - traefik.http.routers.hg-internal.service=hg-api
      - traefik.http.routers.hg-internal.middlewares=hg-internal-only@docker
      - traefik.http.middlewares.hg-internal-only.ipallowlist.sourcerange=127.0.0.1/32

      - traefik.http.services.hg-api.loadbalancer.server.port=8080
      # Traefik polls readiness and pulls an unready replica out of rotation —
      # which is what /health/ready returning 503 with the failing dependency
      # named is for.
      - traefik.http.services.hg-api.loadbalancer.healthcheck.path=/health/ready
      - traefik.http.services.hg-api.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.hg-api.loadbalancer.healthcheck.timeout=3s

  # ---------------------------------------------------------------------------
  # Dependencies
  # ---------------------------------------------------------------------------
  postgres:
    # PostGIS is not optional: P-30 puts a geography(Point,4326) column on every
    # locatable entity, and plain postgres:17 would fail the boot probe.
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Timestamps are stored in UTC, always (G-9).
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published for psql and migrations from the host. Drop this in production.
      - "${POSTGRES_PORT:-5432}:5432"
    networks: [hg-net]
    healthcheck:
      # Over TCP, not the socket. On an empty volume the image first runs a
      # socket-only server to initialise the database, then restarts. A socket
      # check passes against that first server, and `pgroles`, the first thing
      # to connect over the network, then finds the port closed.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    # Valkey, the open-source (BSD) continuation of Redis: same protocol, same
    # commands, same flags. The service keeps the name `redis` so HG_REDIS_ADDR
    # and every client stay as they are. Pinned by release and digest, so a
    # retagged or deleted tag cannot change what boots (issue #202:
    # https://github.com/shaiknoorullah/hg-mono/issues/202).
    image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    # The cache is disposable: it holds cache, pub/sub fan-out, rate-limit
    # counters and OTP codes, and every key names its Postgres rebuild source
    # (docs/spec/01-platform.md, "Postgres is the only source of truth").
    # appendonly is on so a restart is not a thundering herd, not for durability.
    command: >
      valkey-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: [hg-net]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Silo, the maintained open-source (AGPL) fork of MinIO. It keeps MinIO's
    # environment variables, S3 API and on-disk format, so the service name, the
    # MINIO_* settings and the minio-go client stay as they are. The MinIO
    # images this file pinned before can no longer be pulled (issue #202:
    # https://github.com/shaiknoorullah/hg-mono/issues/202). Pinned by release
    # and digest, per the "Object storage" row of docs/decisions/README.md.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_REGION: ${MINIO_REGION:-ca-central-1}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [hg-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket layout (docs/spec/01-platform.md, "Bucket layout and
  # private-by-default") and sets exactly one bucket public.
  # The API's boot probe independently verifies the result, so a mistake here
  # fails the API's boot rather than quietly shipping world-readable KYC.
  #
  # Every step must succeed. `sh -e` stops at the first failure, and the API
  # waits for this job to complete successfully, so a failed step keeps the API
  # down. Never silence a step with `|| true`: that hid failed expiry rules.
  #
  # Every bucket is versioned, so an overwrite or a delete made by hand can be
  # undone. Old versions are deleted 35 days after they stop being current. When
  # the API deletes an object it removes every version of the key at once
  # (services/hg/internal/files/objects.go). Lifecycle rules
  # are imported, not added: an import replaces the bucket's whole rule set, so
  # running this job again leaves the same rules instead of duplicates.
  createbuckets:
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    networks: [hg-net]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set hg http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"

        # lifecycle BUCKET [DAYS]: old versions expire 35 days after they stop
        # being current. With DAYS, the current version also expires DAYS days
        # after it is written.
        lifecycle() {
          current=''
          if [ -n "$${2:-}" ]; then current="\"Expiration\":{\"Days\":$$2},"; fi
          printf '{"Rules":[{"ID":"hg-retention","Status":"Enabled",%s"NoncurrentVersionExpiration":{"NoncurrentDays":35}}]}' "$$current" \
            | mc ilm import "hg/$$1"
        }

        for b in hg-kyc hg-pod hg-media hg-exports hg-tmp; do
          mc mb --ignore-existing "hg/$$b"
          mc version enable "hg/$$b"
        done

        mc anonymous set none hg/hg-kyc
        mc anonymous set none hg/hg-pod
        mc anonymous set none hg/hg-exports
        mc anonymous set none hg/hg-tmp
        # Media stays public-read until the owner decides otherwise in issue
        # #200: https://github.com/shaiknoorullah/hg-mono/issues/200
        #
        # Anonymous readers get s3:GetObject on hg-media and nothing else. Do
        # not use `mc anonymous set download`: that preset also grants
        # s3:ListBucket, and Silo accepts ListBucket for `?versions`, so anyone
        # could list every old version and delete marker and then download
        # deleted or overwritten media for 35 days. Without ListBucket, old
        # version IDs (random UUIDs) cannot be discovered. Do not add a Deny on
        # s3:GetObjectVersion either: Silo checks it on a plain GET too, so it
        # would hide current media as well.
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::hg-media/*"]}]}' > /tmp/media.json
        mc anonymous set-json /tmp/media.json hg/hg-media

        lifecycle hg-kyc
        lifecycle hg-media
        lifecycle hg-pod 90
        lifecycle hg-exports 30
        lifecycle hg-tmp 1

        echo 'buckets ready: all five versioned; hg-kyc, hg-pod, hg-exports, hg-tmp private; hg-media public-read, objects only'

  # Creates the database roles, as the superuser, before anything else logs in:
  # hg_migrator, which owns the schema and is the only role goose runs as;
  # hg_app, the least-privilege role the API runs as; and hg_monitor, for a
  # metrics exporter. Idempotent; it runs on every `up` and before every
  # `migrate`. The SQL and the reasons are in services/hg/migrations/roles/roles.sql.
  pgroles:
    image: postgis/postgis:17-3.5
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hg-net]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      HG_DB_MIGRATOR_PASSWORD: ${HG_DB_MIGRATOR_PASSWORD:?set HG_DB_MIGRATOR_PASSWORD in .env}
      HG_DB_APP_PASSWORD: ${HG_DB_APP_PASSWORD:?set HG_DB_APP_PASSWORD in .env}
      # Optional: hg_monitor may log in only when this is set.
      HG_DB_MONITOR_PASSWORD: ${HG_DB_MONITOR_PASSWORD:-}
    volumes:
      - ../services/hg/migrations/roles:/roles:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/roles/roles.sql"]

  # ---------------------------------------------------------------------------
  # Migrations — profile-gated, run on demand:
  #   docker compose --profile tools run --rm migrate
  #   docker compose --profile tools run --rm migrate status
  # ---------------------------------------------------------------------------
  #
  # The schema in services/hg/migrations is goose-annotated (-- +goose Up), so
  # goose is the runner. It is built from the API's own Dockerfile rather than
  # pulled as a third-party image, so the migration tool and the server share a
  # toolchain and a base image.
  migrate:
    build:
      context: ../services/hg
      dockerfile: Dockerfile
      target: migrate
    profiles: ["tools"]
    depends_on:
      pgroles:
        condition: service_completed_successfully
    environment:
      GOOSE_DRIVER: postgres
      # goose runs as hg_migrator, the schema's owner — never as the superuser.
      GOOSE_DBSTRING: postgres://hg_migrator:${HG_DB_MIGRATOR_PASSWORD:?set HG_DB_MIGRATOR_PASSWORD in .env}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      # Read-only: a migration runner has no business writing to the source tree.
      - ../services/hg/migrations:/migrations:ro
    networks: [hg-net]
    command: ["up"]

networks:
  hg-net:
    name: hg-net
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
