# HalalGoes server set-up. Run every command from this directory (deploy/host).
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ./.collections:~/.ansible/collections:/usr/share/ansible/collections
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = false
forks = 5

[ssh_connection]
pipelining = true
# accept-new: trust a server's host key on first contact, refuse it if it later changes.
# After a rebuild, remove the old key first: ssh-keygen -R <address>
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
