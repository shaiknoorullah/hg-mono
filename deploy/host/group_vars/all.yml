# Settings shared by every host and role. Per-owner values (addresses, keys, email) go in
# inventory/hosts.yml, written by provision.sh from inventory/hosts.example.yml.
# Secrets never go here: see the README, "Secrets".

hg_domain: halalgoes.com
# Every operational schedule (backups, reboots, drills) is in Toronto time; the OS clock stays UTC.
hg_ops_timezone: America/Toronto

# true only in the disposable-container test (tests/): a container must not change the host
# kernel's swap or vm.* settings, set the hostname, or bring up WireGuard.
hg_in_container: false

# ---------------------------------------------------------------------------- access
hg_admin_user: hg
# Set in the inventory, never here (these group_vars outrank the inventory's): hg_admin_ssh_keys,
# hg_wg_peers (the owner's laptop and backup machine) and hg_alert_email_to.
hg_pull_user: hg-pull
# The only WireGuard addresses the pull account accepts: the owner's backup machines.
hg_pull_sources: "{{ (groups['offline'] | default([])) | map('extract', hostvars, 'ansible_host') | list }}"
hg_wg_interface: wg0
hg_wg_port: 51820
hg_wg_prefix: 10.66.0
hg_wg_subnet: "{{ hg_wg_prefix }}.0/24"
# true only while a new server is reachable by its public address and nobody's tunnel is up
# yet. provision.sh sets it; the next run over WireGuard closes public SSH.
hg_ssh_public: false
# The internet-facing interfaces (the DOCKER-USER guard and the traffic alert watch them).
hg_public_interfaces: "{{ [ansible_default_ipv4.interface | default(''), ansible_default_ipv6.interface | default('')] | select | unique | list }}"
# Inbound from the internet: Traefik. The standby sets [] (WireGuard only).
hg_firewall_public_tcp_ports: [80, 443]

# ---------------------------------------------------------------------------- secrets
# Where secrets come from. "sops": age-encrypted files decrypted on the machine that runs
# Ansible (README, "Secrets"). A self-hosted vault (#235) is pending the owner's approval and
# would plug in here as another backend; no other role reads secrets from anywhere else.
hg_secrets_backend: sops
hg_secrets_dir: >-
  {{ lookup('ansible.builtin.env', 'HALALGOES_SECRETS_DIR')
     | default(lookup('ansible.builtin.env', 'HOME') ~ '/.config/halalgoes/secrets', true) }}

# ---------------------------------------------------------------------------- layout on the server
hg_app_dir: /srv/hg            # the production compose files, .env and acme.json (#208)
hg_dev_dir: /srv/hg-dev        # the dev environment (never backed up)
hg_ops_dir: /srv/hg-ops        # compose projects this playbook owns
hg_backup_root: /srv/backup    # backup repositories, apart from all data
hg_config_dir: /etc/hg
hg_textfile_dir: /var/lib/prometheus/node-exporter

# The production stack (#208) runs as compose project "hg", so its containers are hg-<service>-1.
hg_postgres_container: hg-postgres-1
hg_postgres_superuser: hg
hg_postgres_db: hg
hg_pgbackrest_stanza: hg
# Production's services by the production-only aliases the production compose file gives them
# (deploy/docker-compose.prod.yml, "Names"), never by service name: Docker's DNS answers a name
# for every container on a network that claims it, so a stray container calling itself
# "postgres" would receive some of the connections.
hg_postgres_host: hg-prod-postgres
hg_silo_endpoint: http://hg-prod-silo:9000
hg_silo_region: ca-central-1
hg_buckets: [hg-kyc, hg-pod, hg-media, hg-exports, hg-tmp]

# ---------------------------------------------------------------------------- Docker networks
# Created by the docker role so every compose project can declare them external. The names
# and subnets are the network table in deploy/docker-compose.prod.yml ("Networks, in tiers");
# change the two together. Every network that needs no way out is internal: no route off the
# box, and no published port.
hg_networks:
  # Traefik and the production API only: the one range the API trusts for forwarded client
  # addresses (HG_TRUSTED_PROXY_CIDRS). /29: Traefik plus four API replicas during a rollout.
  proxy: {name: hg-proxy, subnet: 10.88.0.0/29, internal: true}
  # The same for dev: Traefik and the dev API only. Dev never joins hg-proxy.
  dev_proxy: {name: hg-dev-proxy, subnet: 10.88.0.8/29, internal: true}
  # The API, Postgres, Valkey and migrations; postgres-exporter. Containers get addresses from
  # the upper half only, so 172.30.0.10 stays free for Postgres's fixed address, which the
  # standby's relay will need (README, "Next month"). The gateway is set because Docker
  # otherwise takes the first address of the range.
  data: {name: hg-data, subnet: 172.30.0.0/24, ip_range: 172.30.0.128/25, gateway: 172.30.0.1, internal: true}
  # The API, Silo and the bucket job; the bucket backups. Silo sits at 172.30.5.10, outside the
  # range containers draw from, so the console can be reached by an SSH tunnel.
  storage: {name: hg-storage, subnet: 172.30.5.0/24, ip_range: 172.30.5.128/25, gateway: 172.30.5.1, internal: true}
  # Scraping and log shipping: VictoriaMetrics, postgres-exporter, VictoriaLogs and Fluent Bit.
  monitoring: {name: hg-monitoring, subnet: 172.30.6.0/24, internal: true}
  # The way out, for Alertmanager (email through Resend), Gatus (the public checks) and
  # freshclam. The dashboards join it too: a port published on the WireGuard address needs a
  # network that is not internal.
  ops: {name: hg-ops, subnet: 172.30.1.0/24, internal: false, bridge: br-hg-ops}
  socket: {name: hg-socket, subnet: 172.30.2.0/24, internal: true}         # Traefik to the socket proxy
  scan: {name: hg-scan, subnet: 172.30.3.0/24, internal: true}             # hg to clamd
  dev: {name: hg-dev-net, subnet: 172.30.10.0/24, internal: true}          # dev data services
  dev_edge: {name: hg-dev-edge, subnet: 172.30.11.0/24, internal: false}   # Traefik to the dev API
# Networks the production compose project creates itself, all inside 10.88.0.0/24. Nothing in
# hg_networks may overlap them, or each other; the docker role checks before creating any.
hg_compose_networks:
  hg-analytics-proxy: 10.88.0.16/29
  hg-files: 10.88.0.24/29
  hg-egress: 10.88.0.32/29
  hg-edge: 10.88.0.40/29
  umami-net: 10.88.0.48/29      # Umami's own (deploy/umami/docker-compose.tls.yml)
hg_clamd_address: 172.30.3.10
# Silo's fixed address on hg-storage (the console's SSH tunnel), and the one Postgres will
# have on hg-data once the standby is switched on (the relay's target).
hg_silo_address: 172.30.5.10
hg_postgres_address: 172.30.0.10
# What the production API trusts for X-Forwarded-For: exactly the proxy network.
hg_trusted_proxy_cidrs: "{{ hg_networks.proxy.subnet }}"

# ---------------------------------------------------------------------------- the standby (#210)
# Off until next month. While false, nothing standby-related is configured or opened:
# no WireGuard peer, no replication role, no Postgres relay, no Silo replication.
hg_standby_enabled: false
# Buckets the standby's Silo receives. hg-exports are regenerated reports and hg-tmp is
# scratch, so neither is copied.
hg_standby_replicated_buckets: [hg-kyc, hg-pod, hg-media]

# ---------------------------------------------------------------------------- ClamAV
# The inventory host that runs clamd. Next month, set it to the standby and run standby.yml:
# clamd starts there, listening on its WireGuard address, and stops here.
hg_clamav_host: hg-prod

# ---------------------------------------------------------------------------- Traefik (#208, #51)
# Names the production Traefik uses; the dev environment's routes refer to them.
hg_traefik_entrypoint: websecure
hg_traefik_certresolver: letsencrypt

# ---------------------------------------------------------------------------- alerts
hg_alert_email_from: HalalGoes alerts <alerts@mail.halalgoes.com>
hg_alert_smtp_host: smtp.resend.com
hg_alert_smtp_port: 587
hg_alert_smtp_user: resend

# ---------------------------------------------------------------------------- images
# Pinned by tag and digest. Update them in one reviewed PR, never on the server.
# The object-storage decision asks for Silo in a registry HalalGoes controls; these come
# from Docker Hub, by digest, the same as #278. Mirroring them is the open question there.
hg_images:
  socket_proxy: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
  clamav: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
  victoriametrics: victoriametrics/victoria-metrics:v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd
  vmalert: victoriametrics/vmalert:v1.153.0@sha256:0c1c7718b54b03e8559d0f257f31f1bd79ef7fa32ac6e9ed90d7b92a74a4fe76
  victorialogs: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
  alertmanager: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
  gatus: twinproduction/gatus:v5.37.0@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
  fluent_bit: fluent/fluent-bit:5.1.3@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
  rclone: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
  postgres_exporter: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
  silo: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
  mc: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
  postgis: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
  valkey: valkey/valkey:9.0.6-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
  cadvisor: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
  nginx: nginx:1.30.5-alpine-slim@sha256:32463212baf0e7d91aded2e9b843a4f2b9e017804b8c9d5bae7b51dcef64389c

# Which of hg_networks the docker role creates. The production compose file (#296) needs all of
# them; the layout running today (current.yml) needs only these three.
hg_networks_enabled: "{{ hg_networks.keys() | list }}"
hg_app_repo: /srv/hg/repo
