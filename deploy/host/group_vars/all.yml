# Settings shared by every host and role. Per-owner values (addresses, keys, email) go in
# inventory/hosts.yml, written by provision.sh from inventory/hosts.example.yml.
# Secrets never go here: see the README, "Secrets".

hg_domain: halalgoes.com
# Every operational schedule (backups, reboots, drills) is in Toronto time; the OS clock stays UTC.
hg_ops_timezone: America/Toronto

# true only in the disposable-container test (tests/): a container must not change the host
# kernel's swap or vm.* settings, set the hostname, or bring up WireGuard.
hg_in_container: false

# ---------------------------------------------------------------------------- access
hg_admin_user: ops
# Set in the inventory, never here (these group_vars outrank the inventory's): hg_admin_ssh_keys,
# hg_wg_peers (the owner's laptop and backup machine) and hg_alert_email_to.
hg_pull_user: hg-pull
# The only WireGuard addresses the pull account accepts: the owner's backup machines.
hg_pull_sources: "{{ (groups['offline'] | default([])) | map('extract', hostvars, 'ansible_host') | list }}"
hg_wg_interface: wg0
hg_wg_port: 51820
hg_wg_prefix: 10.66.0
hg_wg_subnet: "{{ hg_wg_prefix }}.0/24"
# true only while a new server is reachable by its public address and nobody's tunnel is up
# yet. provision.sh sets it; the next run over WireGuard closes public SSH.
hg_ssh_public: false
# The internet-facing interfaces (the DOCKER-USER guard and the traffic alert watch them).
hg_public_interfaces: "{{ [ansible_default_ipv4.interface | default(''), ansible_default_ipv6.interface | default('')] | select | unique | list }}"
# Inbound from the internet: Traefik. The standby sets [] (WireGuard only).
hg_firewall_public_tcp_ports: [80, 443]

# ---------------------------------------------------------------------------- secrets
# Where secrets come from. "sops": age-encrypted files decrypted on the machine that runs
# Ansible (README, "Secrets"). A self-hosted vault (#235) is pending the owner's approval and
# would plug in here as another backend; no other role reads secrets from anywhere else.
hg_secrets_backend: sops
hg_secrets_dir: >-
  {{ lookup('ansible.builtin.env', 'HALALGOES_SECRETS_DIR')
     | default(lookup('ansible.builtin.env', 'HOME') ~ '/.config/halalgoes/secrets', true) }}

# ---------------------------------------------------------------------------- layout on the server
hg_app_dir: /srv/hg            # the production compose files, .env and acme.json (#208)
hg_dev_dir: /srv/hg-dev        # the dev environment (never backed up)
hg_ops_dir: /srv/hg-ops        # compose projects this playbook owns
hg_backup_root: /srv/backup    # backup repositories, apart from all data
hg_config_dir: /etc/hg
hg_textfile_dir: /var/lib/prometheus/node-exporter

# The production stack (#208) runs as compose project "hg", so its containers are hg-<service>-1.
hg_postgres_container: hg-postgres-1
hg_postgres_superuser: hg
hg_postgres_db: hg
hg_pgbackrest_stanza: hg
# Silo's S3 endpoint inside the production network. The service is still called "minio" in
# deploy/docker-compose.yml; change this if #202 renames it.
hg_silo_endpoint: http://minio:9000
hg_silo_region: ca-central-1
hg_buckets: [hg-kyc, hg-pod, hg-media, hg-exports, hg-tmp]

# ---------------------------------------------------------------------------- Docker networks
# Created by the docker role so every compose project can declare them external.
hg_networks:
  # Traefik and the production API only: the one range the API trusts for forwarded client
  # addresses (HG_TRUSTED_PROXY_CIDRS). /29: Traefik plus four API replicas during a rollout.
  proxy: {name: hg-proxy, subnet: 10.88.0.0/29, internal: true}
  # The same for dev: Traefik and the dev API only. Dev never joins hg-proxy.
  dev_proxy: {name: hg-dev-proxy, subnet: 10.88.0.8/29, internal: true}
  app: {name: hg-net, subnet: 172.30.0.0/24, internal: false}              # production stack
  ops: {name: hg-ops, subnet: 172.30.1.0/24, internal: false, bridge: br-hg-ops}  # monitoring, logging
  socket: {name: hg-socket, subnet: 172.30.2.0/24, internal: true}         # Traefik to the socket proxy
  scan: {name: hg-scan, subnet: 172.30.3.0/24, internal: true}             # hg to clamd
  dev: {name: hg-dev-net, subnet: 172.30.10.0/24, internal: true}          # dev data services
  dev_edge: {name: hg-dev-edge, subnet: 172.30.11.0/24, internal: false}   # Traefik to the dev API
hg_clamd_address: 172.30.3.10
# What the production API trusts for X-Forwarded-For: exactly the proxy network.
hg_trusted_proxy_cidrs: "{{ hg_networks.proxy.subnet }}"

# ---------------------------------------------------------------------------- the standby (#210)
# Off until next month. While false, nothing standby-related is configured or opened:
# no WireGuard peer, no replication role, no published Postgres, no Silo replication.
hg_standby_enabled: false
# Buckets the standby's Silo receives. hg-exports are regenerated reports and hg-tmp is
# scratch, so neither is copied.
hg_standby_replicated_buckets: [hg-kyc, hg-pod, hg-media]

# ---------------------------------------------------------------------------- ClamAV
# The inventory host that runs clamd. Next month, set it to the standby and run standby.yml:
# clamd starts there, listening on its WireGuard address, and stops here.
hg_clamav_host: hg-prod

# ---------------------------------------------------------------------------- Traefik (#208, #51)
# Names the production Traefik uses; the dev environment's routes refer to them.
hg_traefik_entrypoint: websecure
hg_traefik_certresolver: letsencrypt

# ---------------------------------------------------------------------------- alerts
hg_alert_email_from: HalalGoes alerts <alerts@mail.halalgoes.com>
hg_alert_smtp_host: smtp.resend.com
hg_alert_smtp_port: 587
hg_alert_smtp_user: resend

