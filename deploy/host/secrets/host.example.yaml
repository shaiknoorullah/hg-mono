# The server's own secrets, as plain YAML. Shape only: never fill this file in.
# provision.sh creates the real one, host.sops.yaml, in the secrets folder outside the
# repository (README, "Secrets"): random values, encrypted with your age key at once.
# Edit it later with: sops ~/.config/halalgoes/secrets/host.sops.yaml

# Console login for the ops account (Contabo's VNC or rescue console only; SSH never takes
# passwords). The password itself is kept so it can be copied into the password manager.
hg_admin_console_password: ""
hg_admin_password_hash: ""            # openssl passwd -6 of the password above

# WireGuard private keys, one per server. Kept here so a rebuilt server keeps its key and
# no peer has to change anything but the endpoint address.
hg_wg_private_keys:
  hg-prod: ""
  hg-standby: ""

# Backups (#64). Losing these makes the backups unreadable: keep them in the offline
# password manager too.
hg_restic_password: ""                # the server's restic repository
hg_offline_restic_password: ""        # the copy on the owner's machine
hg_pgbackrest_cipher_pass: ""         # pgBackRest's repository encryption

# Read-only Silo account the bucket backups use (#203 creates it). Empty: the bucket
# backup jobs fail and alert until it is set.
hg_backup_silo_access_key: ""
hg_backup_silo_secret_key: ""

# Monitoring (#65)
hg_alert_smtp_password: ""            # a Resend API key with sending access only
hg_monitor_postgres_password: ""      # the hg_monitor role, a member of pg_monitor (#215)

# Next month: the standby (#210)
hg_standby_replication_password: ""   # the replicator role on prod's Postgres
hg_prod_silo_root_user: ""            # prod Silo's root user, to set up replication
hg_prod_silo_root_password: ""
hg_standby_silo_root_user: ""
hg_standby_silo_root_password: ""
