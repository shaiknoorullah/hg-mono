# Production's side of the warm standby (#210): a replication role for the replica, and
# bucket replication to the standby's Silo. Run by standby.yml, next month.
- name: Refuse to start without the standby's secrets
  ansible.builtin.assert:
    that:
      - hg_standby_replication_password | default('') | length >= 20
      - hg_prod_silo_root_user | default('') | length > 0
      - hg_prod_silo_root_password | default('') | length > 0
      - hg_standby_silo_root_user | default('') | length > 0
    fail_msg: "host.sops.yaml needs the standby entries (hg_standby_*, hg_prod_silo_root_*)."
    quiet: true

- name: Check that production's Postgres is published on the WireGuard address
  ansible.builtin.wait_for:
    host: "{{ hg_wg_address }}"
    port: 5432
    timeout: 5
  # The production compose file (#208) publishes it on {{ hg_wg_address }}:5432 for the
  # replica, and nowhere else.

- name: Create the replication role
  ansible.builtin.command:
    argv: [docker, exec, -i, -e, PW, "{{ hg_postgres_container }}", psql, -U, "{{ hg_postgres_superuser }}",
           -d, "{{ hg_postgres_db }}", -v, ON_ERROR_STOP=1, -f, "-"]
    # The password travels in the environment, never on a command line other users can read.
    stdin: |
      \getenv pw PW
      SELECT format(CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'replicator')
        THEN 'ALTER ROLE replicator WITH REPLICATION LOGIN PASSWORD %L'
        ELSE 'CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD %L' END, :'pw') \gexec
  environment:
    PW: "{{ hg_standby_replication_password }}"
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Let only the standby connect for replication
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ hg_postgres_container }}"
      - sh
      - -c
      - >-
        f="$PGDATA/pg_hba.conf";
        line="host replication replicator {{ hostvars[hg_standby_host].hg_wg_address }}/32 scram-sha-256";
        grep -qxF "$line" "$f" && echo unchanged || { echo "$line" >> "$f" && echo added; }
  register: hg_hba
  changed_when: "'added' in hg_hba.stdout"
  when: not ansible_check_mode

- name: Reload Postgres's access rules
  ansible.builtin.command:
    argv: [docker, exec, "{{ hg_postgres_container }}", psql, -U, "{{ hg_postgres_superuser }}",
           -d, "{{ hg_postgres_db }}", -c, "SELECT pg_reload_conf()"]
  when: not ansible_check_mode and hg_hba is changed
  changed_when: true

- name: Replicate every bucket to the standby's Silo
  ansible.builtin.command: >-
    docker run --rm --network {{ hg_networks.app.name }} -e PU -e PP -e SU -e SP --entrypoint /usr/bin/sh {{ hg_images.mc }} -c
    'mc alias set p {{ hg_silo_endpoint }} "$PU" "$PP" >/dev/null &&
     for b in {{ hg_buckets | join(" ") }}; do
       mc version enable "p/$b" &&
       { mc replicate ls "p/$b" --json | grep -q "{{ hostvars[hg_standby_host].hg_wg_address }}" ||
         mc replicate add "p/$b" --remote-bucket "http://$SU:$SP@{{ hostvars[hg_standby_host].hg_wg_address }}:9000/$b"
           --replicate "delete,delete-marker,existing-objects"; };
     done'
  environment:
    PU: "{{ hg_prod_silo_root_user }}"
    PP: "{{ hg_prod_silo_root_password }}"
    SU: "{{ hg_standby_silo_root_user }}"
    SP: "{{ hg_standby_silo_root_password }}"
  changed_when: false
  no_log: true
  when: not ansible_check_mode
