# The warm standby (#210): a streaming replica of production's Postgres and a replica of its
# Silo. Run by standby.yml, next month; site.yml never applies it.
- name: Refuse to start without what a replica needs
  ansible.builtin.assert:
    that:
      - hg_postgres_image | length > 0
      - hg_standby_replication_password | default('') | length >= 20
      - hg_standby_silo_root_user | default('') | length > 0
      - hg_standby_silo_root_password | default('') | length >= 20
    fail_msg: "Set hg_postgres_image (inventory) and the standby secrets in host.sops.yaml."
    quiet: true

- name: Create the standby's folder
  ansible.builtin.file:
    path: "{{ hg_standby_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the standby's compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ hg_standby_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Write the standby Silo's root account, readable by root only
  ansible.builtin.copy:
    content: |
      MINIO_ROOT_USER={{ hg_standby_silo_root_user }}
      MINIO_ROOT_PASSWORD={{ hg_standby_silo_root_password }}
    dest: "{{ hg_standby_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Check whether the replica has data yet
  ansible.builtin.command: >-
    docker run --rm --entrypoint test -v hg-standby_pgdata:/var/lib/postgresql/data
    {{ hg_postgres_image }} -f /var/lib/postgresql/data/PG_VERSION
  register: hg_replica_seeded
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Copy production's database into the replica over WireGuard (once)
  ansible.builtin.command: >-
    docker run --rm --user 0 -e PGPASSWORD -v hg-standby_pgdata:/var/lib/postgresql/data
    --entrypoint sh {{ hg_postgres_image }} -c
    'pg_basebackup -h {{ hostvars[hg_primary_host].hg_wg_address }} -p 5432 -U replicator
     -D /var/lib/postgresql/data -R -X stream -C -S {{ hg_standby_slot }} -P
     && chown -R 999:999 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data'
  environment:
    PGPASSWORD: "{{ hg_standby_replication_password }}"
  when: not ansible_check_mode and hg_replica_seeded.rc != 0
  changed_when: true
  no_log: true

- name: Run the replica and the Silo replica
  community.docker.docker_compose_v2:
    project_src: "{{ hg_standby_dir }}"
    state: present
    pull: missing
  when: hg_docker_ready

- name: Create the buckets, versioned, for production to replicate into
  ansible.builtin.command: >-
    docker run --rm --network hg-standby_default -e U -e P --entrypoint /usr/bin/sh {{ hg_images.mc }} -c
    'mc alias set s http://silo:9000 "$U" "$P" >/dev/null &&
     for b in {{ hg_buckets | join(" ") }}; do mc mb --ignore-existing "s/$b" && mc version enable "s/$b"; done'
  environment:
    U: "{{ hg_standby_silo_root_user }}"
    P: "{{ hg_standby_silo_root_password }}"
  when: not ansible_check_mode
  changed_when: false
  no_log: true
