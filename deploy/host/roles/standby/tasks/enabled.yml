- name: Refuse to start without what a replica needs
  ansible.builtin.assert:
    that:
      - hg_postgres_image | length > 0
      - hg_standby_replication_password | default('') | length >= 20
      - hg_standby_silo_root_user | default('') | length > 0
      - hg_standby_silo_root_password | default('') | length >= 20
      - hg_standby_silo_replication_access_key | default('') | length >= 16
      - hg_standby_silo_replication_secret_key | default('') | length >= 32
    fail_msg: "Set hg_postgres_image (inventory) and the standby secrets in host.sops.yaml."
    quiet: true

- name: Create the standby's folder
  ansible.builtin.file:
    path: "{{ hg_standby_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the standby's compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ hg_standby_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Write the standby Silo's root account, readable by root only
  ansible.builtin.copy:
    content: |
      MINIO_ROOT_USER={{ hg_standby_silo_root_user }}
      MINIO_ROOT_PASSWORD={{ hg_standby_silo_root_password }}
    dest: "{{ hg_standby_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Check whether the replica has data yet
  ansible.builtin.command: >-
    docker run --rm --entrypoint test -v hg-standby_pgdata:/var/lib/postgresql/data
    {{ hg_postgres_image }} -f /var/lib/postgresql/data/PG_VERSION
  register: hg_replica_seeded
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Copy production's database into the replica over WireGuard (once)
  ansible.builtin.command: >-
    docker run --rm --user 0 -e PGPASSWORD -v hg-standby_pgdata:/var/lib/postgresql/data
    --entrypoint sh {{ hg_postgres_image }} -c
    'pg_basebackup -h {{ hostvars[hg_primary_host].hg_wg_address }} -p 5432 -U replicator
     -D /var/lib/postgresql/data -R -X stream -C -S {{ hg_standby_slot }} -P
     && chown -R 999:999 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data'
  environment:
    PGPASSWORD: "{{ hg_standby_replication_password }}"
  when: not ansible_check_mode and hg_replica_seeded.rc != 0
  changed_when: true
  no_log: true

- name: Run the replica and the Silo replica
  community.docker.docker_compose_v2:
    project_src: "{{ hg_standby_dir }}"
    state: present
    pull: missing
  when: hg_docker_ready

# The identity production's Silo replicates with: it can write the named buckets on this
# Silo and nothing else, and it exists only here, so nothing on this server can write to
# production. Keys go to mc on stdin and through MC_HOST_*, never as arguments.
- name: Write the replication target's policy (the named buckets only)
  ansible.builtin.template:
    src: replication-target-policy.json.j2
    dest: "{{ hg_standby_dir }}/replication-target-policy.json"
    owner: root
    group: root
    mode: "0644"

- name: Create the versioned buckets and the scoped replication identity
  ansible.builtin.command:
    argv: [docker, run, --rm, -i, --network, hg-standby_default, -e, MC_HOST_s, -e, AK, -e, SK,
           -v, "{{ hg_standby_dir }}/replication-target-policy.json:/policy.json:ro",
           --entrypoint, /usr/bin/sh, "{{ hg_images.mc }}", -s]
    stdin: |
      set -eu
      for b in {{ hg_standby_replicated_buckets | join(' ') }}; do
        mc mb --ignore-existing "s/$b"
        mc version enable "s/$b"
      done
      mc admin policy create s hg-replication-target /policy.json
      mc admin user info s "$AK" >/dev/null 2>&1 || printf '%s\n%s\n' "$AK" "$SK" | mc admin user add s
      mc admin policy attach s hg-replication-target --user "$AK" 2>/dev/null || true
  environment:
    MC_HOST_s: >-
      http://{{ hg_standby_silo_root_user | urlencode }}:{{ hg_standby_silo_root_password | urlencode }}@silo:9000
    AK: "{{ hg_standby_silo_replication_access_key }}"
    SK: "{{ hg_standby_silo_replication_secret_key }}"
  changed_when: false
  no_log: true
  when: not ansible_check_mode
