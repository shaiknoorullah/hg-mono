- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Turn ufw off if the image has it (this table is the host firewall)
  ansible.builtin.command: ufw --force disable
  register: hg_ufw
  changed_when: "'stopped and disabled' in hg_ufw.stdout"
  when: ansible_facts.packages['ufw'] is defined and not ansible_check_mode

- name: Create the nftables drop-in folder
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Never let stopping nftables flush Docker's rules
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/10-hg.conf
    content: |
      # Managed by Ansible (deploy/host/roles/firewall).
      # Debian's unit runs "nft flush ruleset" on stop, which deletes Docker's chains too.
      # Remove only our own table.
      [Service]
      ExecStop=
      ExecStop=-/usr/sbin/nft delete table inet host
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Write the host firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload the host firewall

- name: Apply systemd changes before starting the firewall
  ansible.builtin.meta: flush_handlers

- name: Turn the firewall on now and at every boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
  # On a fresh server in check mode the unit is not installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
