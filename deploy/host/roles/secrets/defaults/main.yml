# App env files decrypted onto the server. Each is skipped while its encrypted file does not
# exist yet (prod.sops.env arrives with the production compose file, #208).
hg_secrets_env_files:
  - {name: prod.sops.env, dest: "{{ hg_app_dir }}/.env"}
  - {name: dev.sops.env, dest: "{{ hg_dev_dir }}/.env"}
