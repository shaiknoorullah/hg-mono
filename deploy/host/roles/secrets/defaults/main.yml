# App env files decrypted onto the server. Each is skipped while its encrypted file does not
# exist yet (prod.sops.env arrives with the production compose file, #208).
hg_secrets_env_files:
  - {name: prod.sops.env, dest: "{{ hg_app_dir }}/.env"}
  - {name: dev.sops.env, dest: "{{ hg_dev_dir }}/.env"}

# Production's secret files (deploy/docker-compose.prod.yml, "Secrets"): written from the same
# prod.sops.env entries as .env, so the two copies cannot differ. Compose bind-mounts each file
# as it is here, ignoring a secret's uid and mode, so each is 0400 and owned by the uid that
# reads it inside its container. The folder is 0700 root: no account on the host can reach
# them, whatever its uid.
hg_secrets_files_dir: "{{ hg_app_dir }}/secrets"
hg_secrets_files:
  # Postgres's entrypoint reads it as root, before it switches to the postgres user.
  - {name: postgres_password, key: POSTGRES_PASSWORD, owner: 0}
  # Valkey runs as its image's valkey user, uid 999.
  - {name: redis_password, key: REDIS_PASSWORD, owner: 999}
  # Silo and the bucket job, as root.
  - {name: minio_root_user, key: MINIO_ROOT_USER, owner: 0}
  - {name: minio_root_password, key: MINIO_ROOT_PASSWORD, owner: 0}
