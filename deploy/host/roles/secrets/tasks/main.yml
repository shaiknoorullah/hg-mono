# The one place secrets enter. Other roles read the variables this role loads and the files
# it writes; none of them knows where the secrets came from. A vault backend (#235, pending
# the owner's approval) would be a second task file here, producing the same two things.
- name: Refuse a secrets backend that is not built
  ansible.builtin.assert:
    that: hg_secrets_backend in ['sops']
    fail_msg: >-
      hg_secrets_backend is "{{ hg_secrets_backend }}". The only backend built is "sops"
      (age-encrypted files). A self-hosted vault (#235) is pending the owner's approval.
    quiet: true

- name: Load secrets with sops
  ansible.builtin.include_tasks: sops.yml
  when: hg_secrets_backend == 'sops'
