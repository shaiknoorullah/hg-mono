- name: Check that the encrypted server secrets exist
  ansible.builtin.stat:
    path: "{{ hg_secrets_dir }}/host.sops.yaml"
  delegate_to: localhost
  become: false
  register: hg_secrets_host_file

- name: Stop when there is nothing to decrypt
  ansible.builtin.assert:
    that: hg_secrets_host_file.stat.exists
    fail_msg: >-
      {{ hg_secrets_dir }}/host.sops.yaml is missing. provision.sh creates it on its first
      run; see deploy/host/README.md, "Secrets".
    quiet: true

- name: Decrypt the server's own secrets into variables
  community.sops.load_vars:
    file: "{{ hg_secrets_dir }}/host.sops.yaml"
    expressions: ignore
  no_log: true

- name: Find the app env files that exist
  ansible.builtin.stat:
    path: "{{ hg_secrets_dir }}/{{ item.name }}"
  loop: "{{ hg_secrets_env_files }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  register: hg_secrets_env_stat

- name: Create the folders the env files go in
  ansible.builtin.file:
    path: "{{ item.item.dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop: "{{ hg_secrets_env_stat.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: item.stat.exists

- name: Write each app env file, decrypted, readable by root only
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', hg_secrets_dir ~ '/' ~ item.item.name, input_type='dotenv', output_type='dotenv') }}\n"
    dest: "{{ item.item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ hg_secrets_env_stat.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: item.stat.exists
  no_log: true
  diff: false

# ---------------------------------------------------------------- production's secret files
- name: Remember whether production's settings exist yet
  ansible.builtin.set_fact:
    hg_secrets_prod_exists: >-
      {{ hg_secrets_env_stat.results | selectattr('item.name', 'equalto', 'prod.sops.env')
         | map(attribute='stat.exists') | first | default(false) }}

- name: Decrypt production's settings for its secret files
  ansible.builtin.set_fact:
    hg_secrets_prod: "{{ lookup('community.sops.sops', hg_secrets_dir ~ '/prod.sops.env', input_type='dotenv', output_type='json') | from_json }}"
  when: hg_secrets_prod_exists
  no_log: true

- name: Stop if production's settings lack a value its secret files are written from
  vars:
    hg_secrets_missing: >-
      {{ hg_secrets_files | map(attribute='key')
         | reject('in', hg_secrets_prod | dict2items | rejectattr('value', 'equalto', '') | map(attribute='key') | list)
         | list }}
  ansible.builtin.assert:
    that: hg_secrets_missing | length == 0
    fail_msg: >-
      prod.sops.env has no value for {{ hg_secrets_missing | join(', ') }}. Production's
      containers read each from a secret file; add it with:
      sops edit {{ hg_secrets_dir }}/prod.sops.env
    quiet: true
  when: hg_secrets_prod_exists

- name: Stop if the Valkey password is not one word
  # Valkey's start-up line writes it into a "requirepass" config line, which a space or a
  # quote would break. openssl rand -hex 32 gives one that fits.
  ansible.builtin.assert:
    that: hg_secrets_prod.REDIS_PASSWORD is match('^[A-Za-z0-9._~+/=-]+$')
    fail_msg: >-
      REDIS_PASSWORD in prod.sops.env must be one word of letters, digits and . _ ~ + / = -
      (for example, openssl rand -hex 32).
    quiet: true
  when: hg_secrets_prod_exists

- name: Create the folder for production's secret files, reachable by root only
  ansible.builtin.file:
    path: "{{ hg_secrets_files_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: hg_secrets_prod_exists

- name: Write each secret file, readable only by the uid that reads it in its container
  # A changed value reaches a container when the container is recreated.
  ansible.builtin.copy:
    content: "{{ hg_secrets_prod[item.key] }}"
    dest: "{{ hg_secrets_files_dir }}/{{ item.name }}"
    owner: "{{ item.owner }}"
    group: root
    mode: "0400"
  loop: "{{ hg_secrets_files }}"
  loop_control:
    label: "{{ item.name }}"
  when: hg_secrets_prod_exists
  no_log: true
  diff: false
