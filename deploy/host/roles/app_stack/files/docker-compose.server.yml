# Managed by Ansible (deploy/host/roles/app_stack), copied to /srv/hg/repo/deploy/ on the server.
# HalalGoes single-server override (5 Oct 2026, launch week): HTTPS for the API, file links and the
# partner and admin web apps on one box, on top of deploy/docker-compose.yml.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.server.yml up -d --build
services:
  traefik:
    command:
      - --providers.docker=true
      # Docker is read through the socket proxy (roles/socket_proxy: container list and inspect,
      # events, version and ping, nothing else), never through the raw socket.
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hg-net
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${HG_ACME_EMAIL:?set HG_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
      - --ping=true
    ports: !override
      - "80:80"
      - "443:443"
    # !override drops the base file's mount of the Docker socket.
    volumes: !override
      - letsencrypt:/letsencrypt
    networks: [hg-net, hg-socket]

  api:
    labels:
      - traefik.http.routers.hg-api-tls.rule=Host(`api.halalgoes.com`)
      - traefik.http.routers.hg-api-tls.entrypoints=websecure
      - traefik.http.routers.hg-api-tls.tls.certresolver=le
      - traefik.http.routers.hg-api-tls.service=hg-api
      - traefik.http.routers.hg-api-tls.middlewares=hg-hsts@docker
      # HSTS for every HTTPS host: one year, subdomains included, no preload yet (#460).
      # Each container that routes HTTPS defines the same middleware (Traefik merges identical
      # definitions), so a router never loses it when another container is down.
      - traefik.http.middlewares.hg-hsts.headers.stsseconds=31536000
      - traefik.http.middlewares.hg-hsts.headers.stsincludesubdomains=true
      - traefik.http.middlewares.hg-hsts.headers.stspreload=false

  minio:
    labels:
      - traefik.enable=true
      - traefik.http.routers.hg-files.rule=Host(`files.halalgoes.com`)
      - traefik.http.routers.hg-files.entrypoints=websecure
      - traefik.http.routers.hg-files.tls.certresolver=le
      - traefik.http.routers.hg-files.middlewares=hg-hsts@docker
      - traefik.http.middlewares.hg-hsts.headers.stsseconds=31536000
      - traefik.http.middlewares.hg-hsts.headers.stsincludesubdomains=true
      - traefik.http.middlewares.hg-hsts.headers.stspreload=false
      - traefik.http.services.hg-files.loadbalancer.server.port=9000

  partner-web:
    image: docker.io/library/nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - /srv/hg/web/partner:/usr/share/nginx/html:ro
      - /srv/hg/web/spa.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [hg-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.hg-partner.rule=Host(`partner.halalgoes.com`)
      - traefik.http.routers.hg-partner.entrypoints=websecure
      - traefik.http.routers.hg-partner.tls.certresolver=le
      - traefik.http.routers.hg-partner.middlewares=hg-hsts@docker
      - traefik.http.middlewares.hg-hsts.headers.stsseconds=31536000
      - traefik.http.middlewares.hg-hsts.headers.stsincludesubdomains=true
      - traefik.http.middlewares.hg-hsts.headers.stspreload=false
      - traefik.http.services.hg-partner.loadbalancer.server.port=80

  admin-web:
    image: docker.io/library/nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - /srv/hg/web/admin:/usr/share/nginx/html:ro
      - /srv/hg/web/spa.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [hg-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.hg-admin.rule=Host(`admin.halalgoes.com`)
      - traefik.http.routers.hg-admin.entrypoints=websecure
      - traefik.http.routers.hg-admin.tls.certresolver=le
      - traefik.http.routers.hg-admin.middlewares=hg-hsts@docker
      - traefik.http.middlewares.hg-hsts.headers.stsseconds=31536000
      - traefik.http.middlewares.hg-hsts.headers.stsincludesubdomains=true
      - traefik.http.middlewares.hg-hsts.headers.stspreload=false
      - traefik.http.services.hg-admin.loadbalancer.server.port=80

volumes:
  letsencrypt:

networks:
  # Created by roles/docker; internal, so nothing on it has a way off the box.
  hg-socket:
    external: true
