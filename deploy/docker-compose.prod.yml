# HalalGoes — production override, for one Contabo Cloud VPS 6 (6 vCPU, 12 GB)
# in US-East. At launch it is the only server: the warm standby comes next
# month (issue #210: https://github.com/shaiknoorullah/hg-mono/issues/210), and
# a permanent dev environment will run beside production on this same box
# (issue #235: https://github.com/shaiknoorullah/hg-mono/issues/235). The owner
# decided this on 4 Oct 2026 (issue #207:
# https://github.com/shaiknoorullah/hg-mono/issues/207#issuecomment-5976966570).
#
#   docker compose --env-file .env \
#     -f docker-compose.yml -f docker-compose.prod.yml config   # check first
#   docker compose --env-file .env \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The base file stays the shape of the stack. This file changes only what
# production needs, and every number comes from the memory budget in
# deploy/README.md, "Production", which also leaves room for the dev
# environment. Raise a limit here only after changing that table. Easy to undo
# by accident:
#
#   * Only Traefik publishes ports, and only 80 and 443. Docker's published
#     ports skip the host firewall, so a port the base file publishes for local
#     work (5432, 6379, 9000, 9001, 8081) is open to the internet whatever
#     nftables says (issue #200:
#     https://github.com/shaiknoorullah/hg-mono/issues/200). `!override`
#     replaces the base file's list; a plain list would be appended to it. The
#     one exception is the Silo console, on the host's loopback only.
#   * No `build:`. CI builds the images and pushes them to GHCR; the box pulls
#     them by digest. A digest cannot be retagged, so what was tested is what
#     runs. The `@` is written here and only the digest is a variable, so a tag
#     cannot be configured: `hg-api@latest` is not a valid image reference.
#   * memswap_limit equals mem_limit: Docker otherwise lets a container swap as
#     much again as its limit, which turns an out-of-memory kill into minutes
#     of a box too slow to answer.
#   * Every service logs to json-file, 20 MB x 5. Docker's default keeps logs
#     forever, and a full disk stops Postgres.
#   * Every container drops all Linux capabilities and adds back only what its
#     entrypoint uses, cannot gain privileges through setuid binaries
#     (no-new-privileges), and runs on a read-only root filesystem with tmpfs
#     where it writes scratch files. None is privileged.
#
# Maps and address search come from Mapbox through the API, so this stack
# serves no map files and runs no geocoder. GlitchTip, Umami, nginx, the
# metrics agents, Fluent Bit and the backup jobs are separate overrides; their
# memory is budgeted, not started here.
#
# ---------------------------------------------------------------------------
# The server this runs on
# ---------------------------------------------------------------------------
# The server playbook (deploy/host, PR #276:
# https://github.com/shaiknoorullah/hg-mono/pull/276; its README, "What
# production's compose file must do") provisions what this file assumes:
#
#   * the Docker networks marked `external` below, with fixed subnets;
#   * the Docker socket proxy (`docker-socket-proxy` on hg-socket), the only
#     container on the box that mounts /var/run/docker.sock. It answers reads
#     of containers, events, ping and version, and refuses every POST, so no
#     exec, no container start and no volume access. Traefik needs no more
#     than the container list, each container's inspect, events, version and
#     ping; any other read it allows (a container's files or logs) is wider
#     than this file asks for;
#   * ClamAV (issue #218: https://github.com/shaiknoorullah/hg-mono/issues/218),
#     listening at 172.30.3.10:3310 on hg-scan until the standby (#210) takes
#     it over;
#   * .env and the secret files (below), decrypted from sops.
#
# Networks. Each service joins only the networks it needs:
#
#   network       subnet          internal  who joins it
#   hg-proxy      10.88.0.0/29    yes       Traefik and the API, nothing else
#   hg-net        172.30.0.0/24   no        the API, Postgres, Valkey, Silo,
#                                           the bucket and migration jobs, and
#                                           the playbook's monitoring and backups
#   hg-files      172.30.5.0/24   yes       Traefik and Silo, nothing else
#   hg-edge       172.30.4.0/24   no        Traefik and the web containers of
#                                           other stacks (Umami's, deploy/umami)
#   hg-socket     172.30.2.0/24   yes       Traefik and the socket proxy
#   hg-scan       172.30.3.0/24   yes       the API and ClamAV
#   hg-dev-proxy  10.88.0.8/29    yes       Traefik and the dev API (#235)
#   hg-dev-edge   172.30.11.0/24  no        Traefik and dev's other public
#                                           containers
#
# Traefik is not on hg-net, and nothing on hg-edge or the dev networks is on
# hg-net or hg-files, so neither the edge nor dev can reach Postgres, Valkey or
# Silo's S3 API. Traefik reaches Silo only on hg-files, for the narrow files
# route below. hg-files and hg-edge belong to this project; the others are the
# playbook's.
#
# Client addresses. The API believes X-Forwarded-For only from hg-proxy
# (HG_TRUSTED_PROXY_CIDRS below), where Traefik is the only other member. Its
# /29 holds Traefik and up to four API replicas while docker-rollout runs.
# Traefik's entrypoints set no forwardedHeaders.insecure and no
# forwardedHeaders.trustedIPs: nothing sits in front of Traefik on this box, so
# it must delete any X-Forwarded-For or X-Real-Ip a client sends and write the
# address it saw (services/hg/internal/httpx/realip.go). No dev container ever
# joins hg-proxy; dev's API trusts hg-dev-proxy alone. Check both after every
# change; each must list only what the table says:
#   docker network inspect hg-proxy -f '{{range .Containers}}{{.Name}} {{end}}'
#   docker network inspect hg-files -f '{{range .Containers}}{{.Name}} {{end}}'
#
# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
# No secret is written in this file and none has a default. They reach the
# containers in one of two ways.
#
#   * As files, wherever the image can read one. Postgres
#     (POSTGRES_PASSWORD_FILE), Silo (MINIO_ROOT_USER_FILE,
#     MINIO_ROOT_PASSWORD_FILE), Valkey (its start-up line, below) and the
#     bucket job read their secrets from compose secrets: files in
#     $HG_SECRETS_DIR (/srv/hg/secrets unless set), mounted read-only at
#     /run/secrets/<name>. The values never appear in `docker inspect`, in
#     `docker compose config`, on a command line or in a log.
#
#     Compose bind-mounts each file as it is on the host, ignoring a secret's
#     uid, gid and mode, so on the host each file must be mode 0400 and owned
#     by the user that reads it inside the container:
#
#       file                 owner     read by
#       postgres_password    0         Postgres's entrypoint, as root, before
#                                      it switches to the postgres user
#       redis_password       999       Valkey, which runs as uid 999 here
#       minio_root_user      0         Silo and the bucket job
#       minio_root_password  0         Silo and the bucket job
#
#   * As environment variables, for the two images that read nothing else.
#     The API (services/hg/internal/config reads only os.Getenv) and the
#     migration runner (goose reads GOOSE_DBSTRING) are distroless binaries
#     with no shell to read a file at start-up. Their secrets come from .env,
#     which compose reads on the host. The trade-off: those values sit in the
#     two containers' environment, so whatever can inspect containers can
#     read them: root on the box (the admin account uses sudo and is not in
#     the docker group), and Traefik, whose label reads through the socket
#     proxy return each container's environment too. Reading them from files
#     needs *_FILE support in services/hg/internal/config. .env is mode 0600,
#     written from the sops-encrypted prod.sops.env, and never committed
#     (.gitignore).
#     The base file also requires POSTGRES_PASSWORD, MINIO_ROOT_USER and
#     MINIO_ROOT_PASSWORD in .env, because it interpolates them.
#
# The secret files and .env must both be written by the playbook's secrets
# role from the same prod.sops.env entries (POSTGRES_PASSWORD, REDIS_PASSWORD,
# MINIO_ROOT_USER, MINIO_ROOT_PASSWORD), so the two copies cannot differ.
#
# ---------------------------------------------------------------------------
# The seam for the dev environment (#235)
# ---------------------------------------------------------------------------
# Dev is its own compose project (deploy/host, roles/dev_env) with its own
# network, database, cache, buckets, volumes and secrets. Traefik is the only
# thing the two share: it joins hg-dev-proxy and hg-dev-edge to route the dev
# hosts.
#
# Traefik reads the labels of every container on the box and merges routers,
# services and middlewares by name across them. A dev stack built from the
# base docker-compose.yml inherits its hg-api and hg-internal names, and
# compose merges list-form labels key by key, so adding hg-dev-* labels does
# not remove them. Production's router hg-api would then be defined twice with
# different rules, and Traefik drops it (production answers 404); service
# hg-api would merge dev's API into production's load balancer. So dev's
# override must:
#   - use `labels: !override` on every service that carries labels in the base
#     file (api), and on any it borrows from this file (minio, if dev routes
#     it);
#   - start every router, service and middleware name with hg-dev-;
#   - carry traefik.docker.network on each container: hg-dev-proxy for the
#     API, hg-dev-edge for the rest. Traefik's default network is hg-proxy,
#     which dev is never on.
# Before dev's `up`, this must print nothing:
#   docker compose -p hg-dev <files> config \
#     | grep -E 'traefik\.http\.(routers|services|middlewares)\.hg-' \
#     | grep -v '\.hg-dev-'
#
# Dev's memory comes out of the "Left for dev" row of the budget, and when the
# box runs short, dev stops first (docs/ops/runbook.md).

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Edge — the only container reachable from the internet.
  # ---------------------------------------------------------------------------
  traefik:
    image: docker.io/library/traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    command: !override
      # No dashboard and no insecure API: they would show the whole routing
      # table to anyone who found the port.
      #
      # Traefik reads container labels through the playbook's read-only socket
      # proxy on hg-socket, never through docker.sock itself: mounting the
      # socket read-only does not make Docker's API read-only, and anything
      # that can reach it can start a privileged container.
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hg-proxy

      # Plain HTTP only redirects. Nothing is served over port 80.
      #
      # Neither entrypoint sets forwardedHeaders.insecure or
      # forwardedHeaders.trustedIPs, and none may: every client's
      # X-Forwarded-For would then reach the API as if Traefik had written it,
      # and anyone could choose the address the per-IP limits count.
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      - --entrypoints.websecure.address=:443
      # Every router on 443 gets a Let's Encrypt certificate without its own
      # tls labels.
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      # 300 s so a 15 MiB document upload from a slow phone finishes. Traefik
      # sets this per entrypoint, not per router; hg's own 30 s read timeout
      # still guards the API.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=300s

      # TLS-ALPN-01: the challenge is answered on 443, so port 80 never has to
      # serve anything but the redirect.
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}

      # The access log keeps no headers: they carry bearer tokens and cookies.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --ping=true
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    environment:
      GOMEMLIMIT: 96MiB
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      # acme.json holds the certificates' private keys; it is in the daily
      # config backup.
      - letsencrypt:/letsencrypt
    networks: !override
      # Traefik's way out (to Let's Encrypt) and in (the published ports):
      # this project's own edge network, not dev's.
      hg-edge:
        gw_priority: 1
      hg-proxy: {}
      hg-files: {}
      hg-socket: {}
      hg-dev-proxy: {}
      hg-dev-edge: {}
    # It runs as root to bind 80 and 443, and needs no other capability. It
    # writes only acme.json, on its volume.
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    logging: *logging

  # ---------------------------------------------------------------------------
  # The API — 2 replicas, deployed with docker-rollout (deploy/README.md).
  # ---------------------------------------------------------------------------
  api:
    build: !reset null
    image: ${HG_IMAGE_REPO:-ghcr.io/shaiknoorullah}/hg-api@${HG_API_DIGEST:?set HG_API_DIGEST in .env to sha256:...}
    # Its secrets, here and in the base file's HG_POSTGRES_DSN, HG_MINIO_* and
    # HG_OTP_PEPPER, HG_AUTH_SIGNING_KEY_SEED, are environment variables from
    # .env: the binary reads nothing else. The trade-off is in "Secrets",
    # above.
    environment:
      # Fixed here, not read from .env: this file is production, and HG_ENV
      # turns on the boot checks that refuse loopback dependencies and a
      # missing data key.
      HG_ENV: production
      # 8 per replica: 16 connections, 32 while a deploy runs old and new
      # replicas side by side, inside Postgres's max_connections of 60.
      HG_POSTGRES_MAX_CONNS: 8
      HG_POSTGRES_MIN_CONNS: 2
      HG_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      HG_APP_DATA_KEY: ${HG_APP_DATA_KEY:?set HG_APP_DATA_KEY in .env}
      # Public hg-media links, and every signed upload and download link, are
      # built on the files host Traefik serves. A signature covers the host, so
      # a link signed for minio:9000 could not be fixed up afterwards.
      HG_MINIO_PUBLIC_BASE_URL: https://${HG_FILES_HOST:?set HG_FILES_HOST in .env, e.g. files.halalgoes.com}
      HG_MINIO_PRESIGN_BASE_URL: https://${HG_FILES_HOST}
      # Exactly hg-proxy's subnet, and never all of hg-net or Docker's private
      # ranges: only Traefik shares hg-proxy with the API, so only Traefik can
      # name a client address the per-IP limits count
      # (services/hg/internal/httpx/realip.go). The playbook's
      # hg_trusted_proxy_cidrs is the same value.
      HG_TRUSTED_PROXY_CIDRS: 10.88.0.0/29
      # The Go runtime collects harder as it nears this, well before the
      # container's 320 MB limit kills it.
      GOMEMLIMIT: 256MiB
    labels: !override
      - traefik.enable=true
      - traefik.docker.network=hg-proxy

      # Public router: the API host only. A bare PathPrefix(`/`) would also
      # catch the files host and hand Silo's paths to the API.
      - traefik.http.routers.hg-api.rule=Host(`${HG_API_HOST:?set HG_API_HOST in .env, e.g. api.halalgoes.com}`)
      - traefik.http.routers.hg-api.entrypoints=websecure
      - traefik.http.routers.hg-api.priority=1
      - traefik.http.routers.hg-api.service=hg-api
      - traefik.http.routers.hg-api.middlewares=hg-api-hsts@docker
      # Browsers that have seen the API over HTTPS refuse plain HTTP to it for
      # a year, so a network that strips the redirect gets nothing.
      - traefik.http.middlewares.hg-api-hsts.headers.stsseconds=31536000

      # /internal and /debug answer only to loopback, which no request through
      # the edge comes from: dependency addresses are never public
      # (docs/spec/01-platform.md, "Ground rules that bind every section",
      # fail loud on config).
      - traefik.http.routers.hg-internal.rule=Host(`${HG_API_HOST}`) && (PathPrefix(`/internal`) || PathPrefix(`/debug`))
      - traefik.http.routers.hg-internal.entrypoints=websecure
      - traefik.http.routers.hg-internal.priority=10
      - traefik.http.routers.hg-internal.service=hg-api
      - traefik.http.routers.hg-internal.middlewares=hg-internal-only@docker
      - traefik.http.middlewares.hg-internal-only.ipallowlist.sourcerange=127.0.0.1/32

      - traefik.http.services.hg-api.loadbalancer.server.port=8080
      - traefik.http.services.hg-api.loadbalancer.healthcheck.path=/health/ready
      - traefik.http.services.hg-api.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.hg-api.loadbalancer.healthcheck.timeout=3s
    # hg-proxy: Traefik in. hg-net: Postgres, Valkey, Silo, and the way out to
    # Stripe, Twilio and the rest. hg-scan: ClamAV, once the API scans KYC
    # documents (#218).
    networks: !override [hg-proxy, hg-net, hg-scan]
    # Longer than HG_SHUTDOWN_TIMEOUT (20 s), so in-flight requests finish
    # before Docker's SIGKILL rather than at Docker's default 10 s.
    stop_grace_period: 30s
    # Distroless, as uid 65532, on port 8080; it writes no files.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.5
    mem_limit: 320m
    memswap_limit: 320m
    logging: *logging

  # ---------------------------------------------------------------------------
  # Postgres 17 + PostGIS 3.5 + pgBackRest — the only source of truth.
  # ---------------------------------------------------------------------------
  postgres:
    # The CI-built image: the PostGIS image plus pgBackRest, which it does not
    # ship. The standby (#210) will run the same image.
    image: ${HG_IMAGE_REPO:-ghcr.io/shaiknoorullah}/hg-postgres@${HG_POSTGRES_DIGEST:?set HG_POSTGRES_DIGEST in .env to sha256:...}
    # Postgres's own page cache counts against the 2 GB limit, so the cache
    # settings fit inside it. max_connections leaves room for 32 API
    # connections during a deploy, the migration role, the replica and backups;
    # each role's CONNECTION LIMIT is set by the role migrations.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1280MB
      - -c
      - work_mem=8MB
      - -c
      - autovacuum_work_mem=32MB
      - -c
      - max_connections=60
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      # At most 60 s of changes wait in an unfinished WAL segment before
      # pgBackRest archives it (issue #64:
      # https://github.com/shaiknoorullah/hg-mono/issues/64); 1 GB of WAL stays
      # for the standby's replica (#210) to catch up from.
      - -c
      - archive_timeout=60
      - -c
      - wal_keep_size=1GB
    # The password comes from a file, never the environment: the image's
    # entrypoint reads POSTGRES_PASSWORD_FILE and would refuse to start with
    # both set, hence `!override`.
    environment: !override
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Timestamps are stored in UTC, always.
      TZ: UTC
      PGTZ: UTC
    secrets: [postgres_password]
    ports: !reset []
    networks: !override [hg-net]
    # The entrypoint starts as root to prepare its directories, then switches
    # to the postgres user: it walks and chowns the data directory
    # (DAC_READ_SEARCH, CHOWN), sets its mode (FOWNER) and switches user
    # (SETUID, SETGID). The data is on its volume, the socket and scratch
    # files on tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    # Docker's 64 MB default /dev/shm breaks parallel queries.
    shm_size: 256m
    # Fast shutdown checkpoints first; Docker's 10 s default would SIGKILL it
    # into crash recovery.
    stop_grace_period: 60s
    mem_limit: 2048m
    memswap_limit: 2048m
    mem_reservation: 1536m
    # Only matters when the whole host runs out: the kernel then kills
    # something else first. At the container's own limit Postgres is still
    # killed, and that pages.
    oom_score_adj: -500
    logging: *logging

  # ---------------------------------------------------------------------------
  # Valkey — disposable cache. Flushing it costs latency, never correctness
  # (docs/spec/01-platform.md, "Ground rules that bind every section").
  # ---------------------------------------------------------------------------
  redis:
    # The image's valkey user, so nothing has to switch users and no
    # capability is needed. It owns redis_password on the host.
    user: "999:1000"
    # Valkey cannot read its password from a file, and `--requirepass` on the
    # command line shows in `docker inspect` and in `ps` on the host. So the
    # start-up line copies the secret into a config file on tmpfs, readable by
    # this user alone, and starts Valkey from it. The password must be a single
    # word, such as `openssl rand -hex 32`.
    #
    # No persistence: nothing in here is the only copy of anything.
    command: !override
      - sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/valkey-auth.conf
        exec valkey-server /tmp/valkey-auth.conf --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    secrets: [redis_password]
    healthcheck:
      # Reads the password at each check; it is never in the environment.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" valkey-cli ping | grep -q PONG"]
    ports: !reset []
    volumes: !reset []
    networks: !override [hg-net]
    read_only: true
    # /data is the image's working directory; nothing is written there.
    tmpfs:
      - /tmp:size=1m
      - /data:size=1m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    logging: *logging

  # ---------------------------------------------------------------------------
  # Silo — object storage. Browsers reach it only through the narrow files
  # route below; the S3 port is never published.
  # ---------------------------------------------------------------------------
  minio:
    # The root account comes from files, never the environment.
    environment: !override
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_REGION: ${MINIO_REGION:-ca-central-1}
      GOMEMLIMIT: 400MiB
      MINIO_API_REQUESTS_MAX: 32
      MINIO_SCANNER_SPEED: slow
      # Browsers upload straight to Silo with signed links, so the admin and
      # restaurant origins need CORS. Exact origins, comma-separated.
      MINIO_API_CORS_ALLOW_ORIGIN: ${HG_UPLOAD_ORIGINS:?set HG_UPLOAD_ORIGINS in .env to the admin and restaurant origins}
      # MINIO_SERVER_URL stays unset, so the console talks to Silo directly
      # instead of through the public files host.
    secrets: [minio_root_user, minio_root_password]
    # The console, on the host's loopback only. Reach it with
    #   ssh -L 9001:127.0.0.1:9001 prod
    ports: !override
      - "127.0.0.1:9001:9001"
    # hg-net: the API, the bucket job and the playbook's backups. hg-files:
    # Traefik, for the files route, and nothing else.
    networks: !override [hg-net, hg-files]
    labels:
      - traefik.enable=true
      - traefik.docker.network=hg-files

      # files.<domain> reaches Silo only for an object in one of the five
      # buckets (docs/spec/01-platform.md, "P-27 — Bucket layout and
      # private-by-default"), and only to read it, upload it, or ask the browser's CORS
      # question. Everything else on this host matches no router and Traefik
      # answers 404, including:
      #   * /minio/..., Silo's admin, health and metrics API;
      #   * a bucket itself (/hg-kyc/, /hg-kyc?list-type=2): no listing;
      #   * POST and DELETE.
      # Requests carrying these headers are refused too, because no signed
      # link hg issues uses them:
      #   * X-Amz-Copy-Source: a server-side copy, which could read one
      #     bucket's object into another;
      #   * X-Amz-Trailer, or X-Amz-Content-Sha256 STREAMING-*: chunked
      #     streaming uploads, the S3 parser's least-trodden path;
      #   * X-Minio-Source-* and the replication status headers: replication
      #     to the standby (#210) will run over WireGuard, never through the
      #     edge.
      # The bucket names are the defaults; change both if HG_MINIO_BUCKET_*
      # ever changes.
      - >-
        traefik.http.routers.hg-files.rule=Host(`${HG_FILES_HOST}`)
        && PathRegexp(`^/(hg-kyc|hg-pod|hg-media|hg-exports|hg-tmp)/[^/]`)
        && (Method(`GET`) || Method(`HEAD`) || Method(`PUT`) || Method(`OPTIONS`))
        && !HeaderRegexp(`X-Amz-Copy-Source`, `.*`)
        && !HeaderRegexp(`X-Amz-Trailer`, `.*`)
        && !HeaderRegexp(`X-Amz-Content-Sha256`, `(?i)^STREAMING-`)
        && !HeaderRegexp(`X-Amz-Replication-Status`, `.*`)
        && !HeaderRegexp(`X-Minio-Source-Replication-Request`, `.*`)
        && !HeaderRegexp(`X-Minio-Source-Replication-Check`, `.*`)
        && !HeaderRegexp(`X-Minio-Source-Proxy-Request`, `.*`)
        && !HeaderRegexp(`X-Minio-Source-Mtime`, `.*`)
        && !HeaderRegexp(`X-Minio-Source-Etag`, `.*`)
        && !HeaderRegexp(`X-Minio-Source-Deletemarker`, `.*`)
        && !HeaderRegexp(`X-Minio-Source-Deletemarker-Delete`, `.*`)
        && !HeaderRegexp(`X-Minio-Replication-Reset-Status`, `.*`)
        && !HeaderRegexp(`X-Minio-Replication-Actual-Object-Size`, `.*`)
      - traefik.http.routers.hg-files.entrypoints=websecure
      - traefik.http.routers.hg-files.service=hg-files
      - traefik.http.routers.hg-files.middlewares=hg-files-hsts@docker
      - traefik.http.middlewares.hg-files-hsts.headers.stsseconds=31536000
      - traefik.http.services.hg-files.loadbalancer.server.port=9000
    # Runs as root, owner of its data volume, and needs no capability. Its
    # home and the health check's client config are in /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    logging: *logging

  # The base file's bucket script, unchanged. Only how it gets the root account
  # differs: this wrapper reads the secret files into the script's own
  # environment, so the account is in neither the container's environment
  # nor its command line. "$0" is the base file's script.
  createbuckets:
    entrypoint: !override
      - /bin/sh
      - -ec
      - |
        MINIO_ROOT_USER="$$(cat /run/secrets/minio_root_user)"
        MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)"
        export MINIO_ROOT_USER MINIO_ROOT_PASSWORD
        exec /bin/sh -ec "$$0"
    environment: !override
      # The client keeps its alias config here, on tmpfs.
      MC_CONFIG_DIR: /tmp/.mc
    secrets: [minio_root_user, minio_root_password]
    networks: !override [hg-net]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    memswap_limit: 64m
    logging: *logging

  # Migrations run as their own step before a deploy:
  #   docker compose ... --profile tools run --rm migrate
  # Distroless goose reads its connection string, password included, from the
  # environment only (see "Secrets", above).
  migrate:
    build: !reset null
    image: ${HG_IMAGE_REPO:-ghcr.io/shaiknoorullah}/hg-migrate@${HG_MIGRATE_DIGEST:?set HG_MIGRATE_DIGEST in .env to sha256:...}
    networks: !override [hg-net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    logging: *logging

secrets:
  # Mode 0400, each owned by the user that reads it (see "Secrets", above).
  postgres_password:
    file: ${HG_SECRETS_DIR:-/srv/hg/secrets}/postgres_password
  redis_password:
    file: ${HG_SECRETS_DIR:-/srv/hg/secrets}/redis_password
  minio_root_user:
    file: ${HG_SECRETS_DIR:-/srv/hg/secrets}/minio_root_user
  minio_root_password:
    file: ${HG_SECRETS_DIR:-/srv/hg/secrets}/minio_root_password

networks:
  # Created by the playbook (deploy/host, group_vars/all.yml, hg_networks),
  # with the subnets in the table above. External, so compose neither creates
  # them with other settings nor removes them on `down`.
  hg-net:
    external: true
    driver: !reset null
  hg-proxy:
    name: hg-proxy
    external: true
  hg-socket:
    name: hg-socket
    external: true
  hg-scan:
    name: hg-scan
    external: true
  hg-dev-proxy:
    name: hg-dev-proxy
    external: true
  hg-dev-edge:
    name: hg-dev-edge
    external: true

  # This project's own. Fixed subnets, outside every range the playbook
  # creates, so neither side can take the other's.
  #
  # Traefik and Silo only. internal: no route out.
  hg-files:
    name: hg-files
    internal: true
    ipam:
      config:
        - subnet: 172.30.5.0/24
  # Where Traefik meets the web containers of other stacks on the box: Umami's
  # (deploy/umami/docker-compose.tls.yml), and GlitchTip's when it comes.
  # Production's services are not on it, so a container here can reach Traefik
  # but not the API, Postgres, Valkey or Silo.
  hg-edge:
    name: hg-edge
    ipam:
      config:
        - subnet: 172.30.4.0/24

volumes:
  letsencrypt:
