# Vale config for the doc-sanitise check (issue #121). Run it through
#   node .github/scripts/doc-sanitise.mjs check
# which scopes it to docs/**, root *.md and apps/*/README*, and fails only on
# problems that are not in the committed baseline (.github/doc-sanitise/).
StylesPath = .vale/styles
MinAlertLevel = error
Vocab = HalalGoes

[*.{md,html}]
BasedOnStyles = HalalGoes
