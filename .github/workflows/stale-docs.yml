name: stale-docs

# A doc declares the code it describes in front matter (`covers:` globs, `reviewed:` date).
# On a PR: changing covered code without changing the doc fails, unless the PR has the
# `no-doc-change` label AND a description line `No doc change: <reason>`.
# Weekly: a doc whose `reviewed:` is older than its covered code's last commit gets an issue.
# Script: tools/stale-docs/check.mjs. PR labels and body are read from the event JSON file
# by the script — never interpolated into a shell.
on:
  pull_request:
    # labeled/unlabeled/edited: adding the label or the reason line re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: covered code changed without its doc
        run: node tools/stale-docs/check.mjs pr

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: file an issue per stale doc
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/stale-docs/check.mjs scan --file-issues
