name: migrations

# The schema's guarantee: the migrations apply to a real Postgres+PostGIS, roll
# all the way back, and the invariants they claim are the ones the database
# actually enforces. Every assertion in test/run_invariant_tests.sh is a thing
# the database must REFUSE; if any of them starts succeeding, this fails.
#
# Path-filtered at the workflow level (it has always been), so it is not behind ci.yml's gate.
# Runners and trust: docs/ci/self-hosted-runners.md.
on:
  push:
    branches: [main]
    paths: ['services/hg/migrations/**', 'contracts/openapi.yaml', '.github/workflows/migrations.yml']
  pull_request:
    paths: ['services/hg/migrations/**', 'contracts/openapi.yaml', '.github/workflows/migrations.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: services/hg/migrations

jobs:
  schema:
    # Trusted runs go to HG_RUNS_ON. Anything else goes to GitHub's runners, where the first step
    # fails and nothing is checked out.
    runs-on: ${{ ((github.event_name == 'schedule' || (contains(fromJSON(vars.HG_CI_TRUSTED_ACTORS || '["shaiknoorullah"]'), github.actor) && contains(fromJSON(vars.HG_CI_TRUSTED_ACTORS || '["shaiknoorullah"]'), github.triggering_actor))) && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.HG_CI_TRUSTED_ACTORS || '["shaiknoorullah"]'), github.event.pull_request.user.login)))) && fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: hg
          POSTGRES_PASSWORD: hg
          POSTGRES_DB: hg
        ports: ['55432:5432']
        # Ready over TCP, not the socket: the image's first-start setup runs a temporary server
        # on the socket only, so a socket check passes while the published port still resets.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U hg -d hg"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      # The superuser: creates the roles, and runs the lints, seed and tests.
      DATABASE_URL: postgres://hg:hg@localhost:55432/hg?sslmode=disable
      PGPASSWORD: hg
      # goose runs as the schema's owner, never as the superuser — as in compose.
      HG_DB_MIGRATOR_PASSWORD: migrator
      HG_DB_APP_PASSWORD: app
      MIGRATOR_URL: postgres://hg_migrator:migrator@localhost:55432/hg?sslmode=disable
      # Labels the containers this job starts itself, so the cleanup step removes exactly
      # those and never a developer's own.
      HG_CI_JOB: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    steps:
      # Every run starts here. An untrusted run (see "Who can run CI" in
      # docs/ci/self-hosted-runners.md) runs on GitHub's runners, checks out nothing and fails.
      - name: trusted author, actor and branch
        id: trust
        env:
          TRUSTED: ${{ (github.event_name == 'schedule' || (contains(fromJSON(vars.HG_CI_TRUSTED_ACTORS || '["shaiknoorullah"]'), github.actor) && contains(fromJSON(vars.HG_CI_TRUSTED_ACTORS || '["shaiknoorullah"]'), github.triggering_actor))) && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.HG_CI_TRUSTED_ACTORS || '["shaiknoorullah"]'), github.event.pull_request.user.login))) }}
        working-directory: .
        run: |
          if [ "$TRUSTED" != true ]; then
            echo "::error::Not run: CI runs only for this repository's branches, when the PR's author, the actor and whoever re-ran it are all in the HG_CI_TRUSTED_ACTORS repository variable (docs/ci/self-hosted-runners.md)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          clean: true
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23'
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: services/hg/go.sum

      - if: runner.environment == 'github-hosted'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Self-hosted (#287): use the machine's python3 in a private venv, since
      # setup-python has no builds for the workstation's distro and system pip is managed.
      - if: runner.environment != 'github-hosted'
        name: python (self-hosted venv)
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - run: pip install pyyaml
      # psql: from apt on GitHub's runners; on a self-hosted runner (#287) without psql,
      # a wrapper runs psql from the Postgres image against this job's database: as the
      # runner's own user (no root-owned files), with the working directory mounted read-only
      # (psql only reads), and labelled for the cleanup step. It passes the role passwords
      # through, because roles/roles.sql reads them from the environment.
      - name: psql client
        working-directory: .
        run: |
          if command -v psql >/dev/null; then exit 0; fi
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          else
            mkdir -p "$RUNNER_TEMP/bin"
            # shellcheck disable=SC2016 # expanded when the wrapper runs, not here
            printf '%s\n' '#!/bin/sh' 'exec docker run --rm -i --network host --user "$(id -u):$(id -g)" --label "hg-ci-job=$HG_CI_JOB" -e PGPASSWORD -e HG_DB_MIGRATOR_PASSWORD -e HG_DB_APP_PASSWORD -e HG_DB_MONITOR_PASSWORD -v "$PWD:$PWD:ro" -w "$PWD" postgis/postgis:17-3.5 psql "$@"' > "$RUNNER_TEMP/bin/psql"
            chmod +x "$RUNNER_TEMP/bin/psql"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0

      # 1. The enum migration is generated from the contract. If regenerating it
      #    produces a diff, the contract moved and the schema did not.
      - name: contract enums are up to date
        run: |
          python3 tools/gen_enums.py > "$RUNNER_TEMP/00002_enums.sql"
          diff -u 00002_enums.sql "$RUNNER_TEMP/00002_enums.sql"

      # 2. The migrations apply, as the migration role. The superuser only
      #    creates the roles (roles/roles.sql); it never runs goose.
      - name: database roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f roles/roles.sql
      - name: goose up
        run: goose -dir . postgres "$MIGRATOR_URL" up

      # 3. Money and geography lints against the finished schema. (00023 already
      #    gates on these, so a failure here means someone bypassed it.)
      - name: schema lint
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lint/schema_lint.sql

      # 4. Every contract enum has an identical pg type or an explained exclusion.
      - name: contract enums match the database
        run: python3 tools/check_enums.py

      # 5. Launch seed applies, and applies twice (it must be idempotent).
      - name: seed
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f seed/seed.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f seed/seed.sql

      # 6. The invariants: each case asserts the database refuses something.
      - name: invariant tests
        run: ./test/run_invariant_tests.sh

      # 7. Down migrations are real. Full rollback must leave nothing behind,
      #    and must be followed by a clean re-apply. The rollback runs as the
      #    superuser: 00001's down drops extensions, which only it may do.
      - name: goose reset, then up again
        run: |
          goose -dir . postgres "$DATABASE_URL" reset
          LEFTOVERS=$(psql "$DATABASE_URL" -At -c "
            SELECT tablename FROM pg_tables
             WHERE schemaname='public' AND tablename NOT IN ('goose_db_version','spatial_ref_sys')
            UNION ALL
            SELECT t.typname FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace
             WHERE n.nspname='public' AND t.typtype='e'")
          if [ -n "$LEFTOVERS" ]; then
            echo "rollback left objects behind:"; echo "$LEFTOVERS"; exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f roles/roles.sql
          goose -dir . postgres "$MIGRATOR_URL" up

      # 8. The local persona world resets, re-seeds, and checks itself.
      #    reset drops the schema, so this stays after the rollback proof.
      - name: dev world personas reset and re-seed
        working-directory: services/hg
        env:
          HG_ENV: local
          HG_POSTGRES_DSN: postgres://hg:hg@localhost:55432/hg?sslmode=disable
          GOTOOLCHAIN: auto
        run: |
          go run ./cmd/devworld reset
          go run ./cmd/devworld seed
          go run ./cmd/devworld verify

      # The Postgres service container is removed by the runner. This removes any psql
      # container a cancelled step left running.
      - name: remove this job's containers
        if: always()
        working-directory: .
        run: |
          command -v docker >/dev/null || exit 0
          docker ps -aq --filter "label=hg-ci-job=$HG_CI_JOB" | xargs -r docker rm -f
