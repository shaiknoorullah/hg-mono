name: e2e

# The HalalGoes apps driven end to end against the real API, built from this commit, with a small
# seeded world: the customer and rider APKs on an Android emulator (Maestro), the restaurant and
# admin web apps in Chromium (Playwright). One order goes through three apps. Screenshots of every
# step, Playwright traces on failure and the stack's logs are uploaded as artifacts.
# Goal: release 1.0 (#257). Emulator runs: #77. The regression pass: #91.
# How to run it, what each flow covers, what it costs: tools/e2e/README.md.
#
#   Run workflow (workflow_dispatch)      every flow (or the web flows only), on the branch picked
#   nightly at 05:30 UTC                  every flow, on main; skipped when main has not changed
#                                         since the last nightly run
#   a pull request labelled e2e           the web flows only: no APK build, no emulator
#   a pull request labelled e2e-full      every flow: the by-hand run for a PR, since a workflow
#                                         can only be dispatched once it is on main
#
# The emulator runs cost the most runner minutes (tools/e2e/README.md, "What it costs"), so they
# run only nightly and by hand (Run workflow, or the e2e-full label).
#
# Two builds of each app (MASTER-PLAN §5.3; tools/e2e/README.md, "Redesign"):
#   legacy    the redesign flag off, as release 1.0 ships: the existing specs and flows
#   redesign  VITE_HG_REDESIGN=1 / EXPO_PUBLIC_HG_REDESIGN=1: tools/e2e/web/redesign-<app>.*.spec.ts
#             and tools/e2e/native/<app>/redesign/*.yaml. A redesign build is made only for an app
#             that has such specs or flows, so it costs nothing until a track adds one. Redesign
#             APKs, like every APK, are built only when the emulator runs (e2e-full, nightly, Run
#             workflow with all).
#
# Trust rules:
# - Read-only token (contents: read; the plan job also reads past runs). No job reads a secret:
#   the API uses its fake payment client and logs sign-in codes, so nothing sends an SMS or
#   charges a card.
# - No pull_request_target. A PR from a fork runs with the fork's permissions and no secrets.
# - Every action is pinned to a commit. Maestro is downloaded at a pinned version and checked
#   against its published SHA-256.
# - Inputs reach scripts only through env, after an allow-list check.

on:
  workflow_dispatch:
    inputs:
      flows:
        description: 'Which flows: all (emulator and browser) or web (browser only, about a third of the minutes)'
        type: choice
        options: [all, web]
        default: all
  schedule:
    - cron: '30 5 * * *'
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # A run started by adding some other label does nothing, and must not cancel a real run: it
  # gets a group of its own.
  group: >-
    e2e-${{ github.event.pull_request.number || github.ref }}-${{
    github.event.action == 'labeled' && !startsWith(github.event.label.name, 'e2e') && github.run_id || 'run' }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: 1
  # The emulator reaches the runner at 10.0.2.2; Traefik publishes the API on 8080.
  E2E_DEVICE_API_URL: http://10.0.2.2:8080
  MAESTRO_VERSION: 2.10.0
  MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991

jobs:
  # Decides what this run does: all (APKs, emulator and browser), web (browser only) or none.
  # On a pull request without an e2e label nothing runs at all, so it costs no minutes; nor
  # when some other label is added to a labelled one.
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      ((contains(github.event.pull_request.labels.*.name, 'e2e') ||
      contains(github.event.pull_request.labels.*.name, 'e2e-full')) &&
      (github.event.action != 'labeled' || startsWith(github.event.label.name, 'e2e')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      apks: ${{ steps.apks.outputs.apks }}
    steps:
      # Only the flow folders, to see which apps have redesign flows; nothing here is run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: tools/e2e/native
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          IN_FLOWS: ${{ inputs.flows }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-full') }}
        run: |
          mode=none
          case "$EVENT" in
            workflow_dispatch)
              case "$IN_FLOWS" in all|web) mode="$IN_FLOWS" ;; *) echo "::error::flows must be all or web"; exit 1 ;; esac ;;
            pull_request)
              if [ "$FULL_LABEL" = true ]; then mode=all; else mode=web; fi ;;
            schedule)
              # The last nightly that finished, this one excepted. A failure is not retried every
              # night on the same commit: run it by hand, or push a fix.
              last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yml --event schedule \
                --status completed --limit 1 --json headSha --jq '.[0].headSha // ""')"
              if [ "$last" = "$GITHUB_SHA" ]; then
                echo "main is still at ${GITHUB_SHA::7}, which the last nightly run already tested: nothing to do."
              else
                mode=all
              fi ;;
          esac
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "Flows this run: **$mode**" >>"$GITHUB_STEP_SUMMARY"

      # The APKs to build: each app's legacy one, and a redesign one (EXPO_PUBLIC_HG_REDESIGN=1)
      # beside it for an app with flows in tools/e2e/native/<app>/redesign/ (missions/ excepted).
      - id: apks
        run: |
          entries=()
          for app in customer rider; do
            entries+=("{\"app\":\"$app\",\"variant\":\"legacy\",\"flag\":\"0\"}")
            if compgen -G "tools/e2e/native/$app/redesign/*.yaml" >/dev/null; then
              entries+=("{\"app\":\"$app\",\"variant\":\"redesign\",\"flag\":\"1\"}")
              echo "Redesign APK: **$app**" >>"$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "apks=[$(IFS=,; echo "${entries[*]}")]" >>"$GITHUB_OUTPUT"

  apk:
    needs: plan
    if: needs.plan.outputs.mode == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apks) }}
    name: apk (${{ matrix.app }}, ${{ matrix.variant }})
    env:
      APP: ${{ matrix.app }}
      VARIANT: ${{ matrix.variant }}
      # legacy: off, as release 1.0 ships; redesign: on. app-env.cjs passes it to the build.
      EXPO_PUBLIC_HG_REDESIGN: ${{ matrix.flag }}
      # customer.apk, or customer-redesign.apk beside it.
      APK_NAME: ${{ matrix.app }}${{ matrix.variant == 'redesign' && '-redesign' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore an APK built from the same sources
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: out/
          # Bump the leading version when the build steps below change.
          key: e2e-apk-v1-${{ matrix.app }}${{ matrix.variant == 'redesign' && '-redesign' || '' }}-${{ hashFiles(format('apps/{0}/**', matrix.app), 'packages/**', 'scripts/release/app-env.cjs', 'pnpm-lock.yaml', 'tools/e2e/android/**') }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.cache.outputs.cache-hit != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          # main's nightly run writes the Gradle cache; branches and PRs only read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Point the build at the runner's API
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          API_BASE_URL: ${{ env.E2E_DEVICE_API_URL }}
        run: node scripts/release/app-env.cjs dev --print | tee -a "$GITHUB_ENV"

      - name: Generate the native project
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/${{ matrix.app }}
        run: |
          pnpm exec expo prebuild --platform android --no-install
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\norg.gradle.workers.max=2\n' \
            >>android/gradle.properties
          bash ../../tools/e2e/android/allow-cleartext.sh android

      - name: Build the APK
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/${{ matrix.app }}/android
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PreactNativeArchitectures=x86_64 \
            -Pandroid.injected.signing.store.file="$PWD/app/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Check the APK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          apk="apps/$APP/android/app/build/outputs/apk/release/app-release.apk"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fail() { echo "::error title=APK check failed::$*"; exit 1; }
          badging="$("$tools/aapt2" dump badging "$apk" | sed -n 1p)"
          echo "$badging"
          [[ "$badging" == *"name='com.halalgoes.$APP.dev'"* ]] || fail "expected package com.halalgoes.$APP.dev"
          unzip -p "$apk" assets/index.android.bundle >"$RUNNER_TEMP/index.android.bundle"
          grep -aqF "$EXPO_PUBLIC_API_BASE_URL" "$RUNNER_TEMP/index.android.bundle" \
            || fail "the bundle does not contain $EXPO_PUBLIC_API_BASE_URL"
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q 'usesCleartextTraffic.*=true' \
            || fail "the APK does not allow cleartext HTTP to $EXPO_PUBLIC_API_BASE_URL"
          # The legacy APK is what release 1.0 ships: the same guard as release-builds.yml. The
          # redesign one reports whether its bundle carries the flag-on marker.
          if [ "$VARIANT" = legacy ]; then
            node scripts/release/redesign-off.cjs bundle "$RUNNER_TEMP/index.android.bundle" \
              || fail "the legacy APK has the redesign flag on"
          elif grep -aqF 'hg-redesign:on' "$RUNNER_TEMP/index.android.bundle"; then
            echo "::notice title=$APP redesign APK::the bundle carries the marker hg-redesign:on"
          else
            echo "::notice title=$APP redesign APK::no hg-redesign:on marker in the bundle (the app's flag module does not log it yet)"
          fi
          mkdir -p out
          cp "$apk" "out/$APK_NAME.apk"

      - name: Keep the APK for the next run with the same sources
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: out/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-apk-${{ env.APK_NAME }}
          path: out/${{ env.APK_NAME }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # One runner, one stack, for every flow: the API, the web apps and the emulator. The flows run
  # in order, because they share one order: the customer places it, the restaurant accepts it and
  # marks it ready, the rider is offered it, the admin opens it.
  flows:
    needs: [plan, apk]
    if: >-
      !cancelled() && needs.plan.outputs.mode != 'none' &&
      (needs.plan.outputs.mode == 'web' || needs.apk.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_OUT: ${{ github.workspace }}/e2e-out
      # Which flows: all (emulator and browser) or web. Their API: the real stack, never the mock.
      E2E_FLOWS: ${{ needs.plan.outputs.mode }}
      E2E_MODE: real
      # Real-mode captures go beside, not into, the directory design-diff reads. Every board the
      # real specs capture is also declared by a mock spec — three of them, measured — so comparing
      # both would count those boards twice and nothing dedupes by board (#1028, #1049).
      E2E_DESIGN_DIR: ${{ github.workspace }}/e2e-out/design-captures-real
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The web captures read each board's size from its canvas.json to capture a tall board at its
      # own height (tools/e2e/README.md, "Tall boards"); without the ref they fall back to the viewport.
      - name: Fetch the canvases
        run: git fetch --depth=1 origin claude/redesign-canvases:refs/remotes/origin/claude/redesign-canvases

      - name: Let the emulator use KVM
        if: env.E2E_FLOWS == 'all'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # For cmd/seedpw and cmd/seedtotp, which the seed runs. Maestro uses the runner's Java 17.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/hg/go.mod
          cache-dependency-path: services/hg/go.sum

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hg/e2e exec playwright install --with-deps chromium

      # The design boards and the captures compared with them must be drawn by ONE Chromium build
      # (tools/design-diff/src/browser.mjs, CHROMIUM_BUILD = 1223). The pinned Playwright 1.50.1
      # ships build 1155, which cannot parse `var(--icon-md)` in an SVG geometry attribute and so
      # fails to render 35 of the 55 restaurant/sign-in boards (#842). Until one Playwright is
      # pinned repo-wide, the build is fetched from the release that carries it — 1.60.0 is the
      # version whose bundled Chromium is revision 1223 — and resolveBrowser() then finds it
      # without an override, for the web captures here and for the reference renderer.
      #
      # Checked, not assumed: without this, CI captures recorded `"browser": "playwright default"`
      # and `"chromium": "133.0.6943.16"`, so every pair would have been BROWSER MISMATCH and no
      # board could be measured in CI at all.
      - name: Install the Chromium build the design boards are drawn with
        run: |
          npx -y playwright@1.60.0 install --with-deps chromium
          test -d "$HOME/.cache/ms-playwright/chromium-1223" || {
            echo "::error::playwright@1.60.0 did not provide Chromium build 1223; design-diff cannot compare a board with a capture from another build"
            exit 1
          }

      - name: Install Maestro
        if: env.E2E_FLOWS == 'all'
        run: |
          dir="$RUNNER_TEMP/maestro-dl"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $dir/maestro.zip" | sha256sum -c -
          unzip -q "$dir/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >>"$GITHUB_PATH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.E2E_FLOWS == 'all'
        with:
          pattern: e2e-apk-*
          path: ${{ env.E2E_OUT }}/apk
          merge-multiple: true

      - name: Boot the stack
        run: bash tools/e2e/stack/up.sh

      - name: Seed the world
        run: bash tools/e2e/seed/seed.sh

      # Each app twice when it has redesign specs: legacy on 4173/4174, VITE_HG_REDESIGN=1 on
      # 4175/4176 (tools/e2e/README.md, "Redesign").
      - name: Build and serve the web apps
        run: bash tools/e2e/web/serve.sh

      - name: Run the web flows
        if: env.E2E_FLOWS == 'web'
        run: bash tools/e2e/run.sh

      - name: Run every flow, on the emulator and in the browser
        if: env.E2E_FLOWS == 'all'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One command: the action runs each line of `script` as its own shell. A system
          # "isn't responding" dialog (the launcher, under load) must never cover the app under
          # test, so error dialogs are hidden first; more memory keeps the launcher responsive.
          #
          # `logcat -G 16M` grows the ring buffer before the flows start, which needs neither root
          # nor a restart. The default is small and ReactNativeJS and Maestro's driver are both
          # noisy, so a kill early in a 20-minute run would otherwise have scrolled away long before
          # kill-evidence.sh reads the buffer at the end.
          #
          # The design boards are 390 dp wide and a Pixel 6 is 411 dp, so the size and density are set
          # first and the measured size is printed in this log (tools/e2e/android/design-size.sh).
          script: adb shell settings put global hide_error_dialogs 1 && bash tools/e2e/android/design-size.sh && bash tools/e2e/android/measure-insets.sh && adb logcat -G 16M && { bash tools/e2e/run.sh; rc=$?; bash tools/e2e/android/kill-evidence.sh || true; node tools/e2e/native/check-hierarchies.mjs || rc=1; exit $rc; }

      - name: Collect the stack's logs
        if: always()
        run: |
          . tools/e2e/stack/compose.sh
          mkdir -p "$E2E_OUT/logs"
          compose ps -a >"$E2E_OUT/logs/compose-ps.txt" 2>&1 || true
          compose logs --no-color --timestamps >"$E2E_OUT/logs/compose.log" 2>&1 || true
          # Never upload the run's throwaway secrets.
          rm -f "$E2E_OUT/world.json"

      - name: Summary
        if: always()
        run: node tools/e2e/lib/summary.mjs >>"$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-screenshots-and-traces
          path: |
            ${{ env.E2E_OUT }}
            !${{ env.E2E_OUT }}/apk
          if-no-files-found: warn
          retention-days: 14

  # The design captures, taken against the mock.
  #
  # The boards draw states the real stack cannot produce on demand — a failed payout, an expired
  # certificate, a refused upload, a payment that failed — so the specs that capture them are written
  # against the mock and skip when E2E_MODE is real. The `flows` job runs the real stack, so for a
  # long time almost every capture spec skipped there: the first run that produced verdicts compared
  # 4 boards, where the one run done by hand compared 143 (#1049).
  #
  # Its own job, beside `flows` rather than after it, for three reasons: mock mode needs no compose
  # stack, no Go and no APKs, so it is cheap; it runs in parallel and adds nothing to the critical
  # path; and serve.sh serves one API mode at a time, so a second mode in the same job would mean
  # tearing down servers the real flows are still using.
  captures:
    needs: plan
    if: "!cancelled() && needs.plan.outputs.mode != 'none'"
    runs-on: ubuntu-24.04
    # One job per console. Both in one job ran past 30 minutes once the admin refunds, staff and
    # restaurant onboarding captures were in (run 39770582269), and took 39 on run 39783303279:
    # 13 to install, then 12 for restaurant and 13 for admin one after the other. Split, the two
    # run side by side, about 27 minutes each. fail-fast off: one console's crash must not cancel
    # the other's captures.
    strategy:
      fail-fast: false
      matrix:
        app: [restaurant, admin]
    name: captures (${{ matrix.app }})
    timeout-minutes: 45
    env:
      E2E_OUT: ${{ github.workspace }}/e2e-out
      E2E_MODE: mock
      E2E_APPS: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The web captures read each board's size from its canvas.json to capture a tall board at its
      # own height (tools/e2e/README.md, "Tall boards"); without the ref they fall back to the viewport.
      - name: Fetch the canvases
        run: git fetch --depth=1 origin claude/redesign-canvases:refs/remotes/origin/claude/redesign-canvases

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hg/e2e exec playwright install --with-deps chromium

      # A board and the capture compared with it must come from one Chromium build
      # (tools/design-diff/README.md, "One browser for both sides").
      - name: Install the Chromium build the design boards are drawn with
        run: |
          npx -y playwright@1.60.0 install --with-deps chromium
          test -d "$HOME/.cache/ms-playwright/chromium-1223" || {
            echo "::error::playwright@1.60.0 did not provide Chromium build 1223; captures could not be compared with the boards"
            exit 1
          }

      # Starts `pnpm mock` on :4010 itself and builds the redesign apps against it.
      - name: Build and serve the apps against the mock
        run: bash tools/e2e/web/serve.sh

      # Only the redesign projects: this job exists to take captures, not to run the suite twice.
      # It does not fail the run on a failing spec — a capture spec that fails has taken no capture,
      # which design-diff reports as a board with no capture, and that is the number to read. A
      # crash still fails the job.
      - name: Take the design captures
        run: |
          cd tools/e2e
          E2E_RUN="captures-$E2E_APPS" pnpm exec playwright test --config web/playwright.config.ts \
            --project "$E2E_APPS-redesign-*" --pass-with-no-tests || echo "::warning::$E2E_APPS capture specs had failures; boards they would have captured are reported as uncaptured"

      - name: Summary
        if: always()
        run: |
          n=$(find "$E2E_OUT/design-captures" -name '*.png' 2>/dev/null | wc -l)
          echo "## Design captures (mock, $E2E_APPS)" >>"$GITHUB_STEP_SUMMARY"
          echo "" >>"$GITHUB_STEP_SUMMARY"
          echo "$n captures taken against the mock API." >>"$GITHUB_STEP_SUMMARY"

      # A failing spec takes no capture, and a board with no capture reads as "uncaptured" — which
      # is also what a board nobody has written a capture for looks like. One is a regression and
      # the other is work not started, so the failures are named rather than left to the diff's
      # count, which cannot tell them apart.
      - name: The capture specs that failed
        if: always()
        run: node tools/e2e/web/capture-failures.mjs "$E2E_OUT/playwright" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: design-captures-mock-${{ matrix.app }}
          path: ${{ env.E2E_OUT }}/design-captures
          if-no-files-found: warn
          retention-days: 14

  # Whether every redesigned screen matches the board it names, on every run that captures one.
  #
  # Nothing used to answer that in CI: the harness was unit-tested and the captures were uploaded,
  # but no job ever rendered a board or compared one, so "pixel perfect" could only be shown by hand
  # on a developer's machine (#1034). The verdicts on record before this were run that way, once.
  #
  # Its own job, not a step in `flows`: it needs no emulator, no stack and no APKs, and a 20-minute
  # emulator run should not wait on rendering boards.
  design-diff:
    needs: [plan, flows, captures]
    # On the captures, not on the flows. Whether a screen matches its board and whether a journey
    # works against the real stack are different questions, and the boards' own states are reached
    # through the mock — so a broken API should not also cost the fidelity verdicts. It did: #1040
    # made the legacy live-orders queue read one `state` value and the real-stack specs timed out,
    # which under the old condition would have skipped this job entirely.
    # And on either console's captures: with one captures job per app, a crash in one fails the
    # matrix, and the other console's captures are still worth their verdicts.
    if: "!cancelled() && (needs.captures.result == 'success' || needs.captures.result == 'failure')"
    runs-on: ubuntu-24.04
    # The comparison is about a second a pair and the capture count only goes up: 681 when it
    # landed, 823 a day later, and roughly 2,600 boards exist. 90 minutes is headroom, not a fix —
    # the run that needs it should be read, not just allowed to finish.
    timeout-minutes: 90
    env:
      E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The boards themselves, from the canvases' mirror branch. render-refs reads them with
      # `git archive` out of this checkout, so the ref has to be here and the default checkout has
      # only the merge commit.
      - name: Fetch the canvases
        run: git fetch --depth=1 origin claude/redesign-canvases:refs/remotes/origin/claude/redesign-canvases

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same build the captures were taken on. A board drawn by another build is not comparable
      # and the renderer refuses to draw on one (tools/design-diff/README.md, "One browser for both
      # sides"); the `flows` job installs this too, for the capture side.
      - name: Install the Chromium build the design boards are drawn with
        run: |
          npx -y playwright@1.60.0 install --with-deps chromium
          test -d "$HOME/.cache/ms-playwright/chromium-1223" || {
            echo "::error::playwright@1.60.0 did not provide Chromium build 1223; boards cannot be compared with the captures"
            exit 1
          }

      # The flows' output: native screenshots for when native captures join, and the run's own
      # record. Nothing compared comes from here any more, so a failed flows job does not stop the
      # diff.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: e2e-screenshots-and-traces
          path: ${{ env.E2E_OUT }}

      # The captures themselves, from the mock-mode job, into the directory the diff reads. The
      # real-mode flows write theirs to design-captures-real, which is kept in their own artifact and
      # not compared: the three boards both modes declare would otherwise be counted twice, and
      # nothing dedupes by board (#1028). Not fatal when absent — a diff of what did arrive is worth
      # more than no diff, and a missing capture is reported as a board without one. One artifact per
      # console, merged into one directory: each holds only its own app's folder, so nothing collides.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: design-captures-mock-*
          merge-multiple: true
          path: ${{ env.E2E_OUT }}/design-captures

      # Every board of the apps whose captures a browser takes, not only the areas captured: the
      # count of boards with no capture at all is the coverage figure, and rendering only what was
      # captured would report it as zero.
      #
      # `--repo` is not optional here even though it defaults to the working directory: pnpm runs
      # the script inside tools/design-diff, and `git archive <commit> canvases` resolves its
      # pathspec relative to the directory it runs in, so from there it looks for
      # tools/design-diff/canvases and finds nothing.
      - name: Render the boards
        run: >-
          pnpm --filter @hg/design-diff exec node src/render-refs.mjs
          --repo "$GITHUB_WORKSPACE" --out "$E2E_OUT/design-refs" --apps restaurant,admin --concurrency 6

      # --no-strict: the diff exits 1 on any FAIL, and no board passes yet. A gate that is red
      # before the first board is fixed tells nobody anything and blocks every merge; the verdicts
      # are published instead, and a regression gate comes once there is something to protect.
      # A job that is cancelled leaves no reason behind: on run 39762301254 the comparison stopped
      # after 92 silent seconds at 23 of its 45 allowed minutes, with every other job green. Disk
      # and memory are the two the runner can run out of without saying so, and the comparison
      # writes three PNGs a pair, so both are printed either side of it.
      - name: Space and memory before the comparison
        run: df -h "$GITHUB_WORKSPACE" | tail -1; free -m | head -2

      # Sampled while the comparison runs, not either side of it. Measuring either side cannot see
      # this failure: the step that reads the numbers afterwards carries `if: always()` and was
      # SKIPPED on run 39775974688, which is what GitHub does when a job is terminated from outside
      # rather than when a step fails. So the only reading that can survive the failure is one
      # already in the log when it happens
      # (https://github.com/shaiknoorullah/hg-mono/issues/1034).
      #
      # The sampler is killed on the way out so it cannot hold the step open.
      - name: Compare the captures with their boards
        run: |
          (
            while :; do
              printf '[sample] %s  %s  out %s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(free -m | awk '/^Mem:/{printf "available %s MiB of %s, cache %s", $7, $2, $6}')" \
                "$(du -sh "$E2E_OUT/design-diff" 2>/dev/null | cut -f1)"
              sleep 15
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          pnpm --filter @hg/design-diff exec node src/diff.mjs --no-strict \
            --refs "$E2E_OUT/design-refs" --captures "$E2E_OUT/design-captures" --out "$E2E_OUT/design-diff"

      - name: Space and memory after the comparison
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" | tail -1
          free -m | head -2
          du -sh "$E2E_OUT/design-diff" "$E2E_OUT/design-refs" "$E2E_OUT/design-captures" 2>/dev/null || true

      # The phone apps' captures, compared the same way once the web ones are done. They exist only
      # when the `flows` job ran the native flows (e2e-full, nightly, dispatch), and arrive in the
      # e2e-screenshots-and-traces artifact under screenshots/<app>/. On an `e2e`-label run there are
      # none, and everything below is skipped without rendering a board.
      #
      # Staged into a folder of their own, customer and rider only: screenshots/ also holds the web
      # apps' flow screenshots, and the folder's name is how a native capture says which app it is.
      - name: Find the native captures
        id: native
        if: always()
        run: |
          mkdir -p "$E2E_OUT/design-captures-native"
          for app in customer rider; do
            if [ -d "$E2E_OUT/screenshots/$app" ]; then cp -R "$E2E_OUT/screenshots/$app" "$E2E_OUT/design-captures-native/$app"; fi
          done
          n=$(find "$E2E_OUT/design-captures-native" -name 'design--*.png' 2>/dev/null | wc -l)
          echo "native design captures: $n"
          echo "present=$([ "$n" -gt 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "insets: $(tr -d '\n ' <"$E2E_OUT/insets.json" 2>/dev/null || true)"

      # Boards of the two phone apps, into their own directory so the web references are untouched.
      - name: Render the native boards
        if: always() && steps.native.outputs.present == 'true'
        run: >-
          pnpm --filter @hg/design-diff exec node src/render-refs.mjs
          --repo "$GITHUB_WORKSPACE" --out "$E2E_OUT/design-refs-native" --apps customer,rider --concurrency 6

      # Judged on layout geometry and colour, not pixels (tools/design-diff/README.md, "Native
      # boards"). The bars are cut by the insets the flows job measured on the emulator, else the
      # stock phone-390 profile; the density comes from each capture's own sidecar.
      # continue-on-error: the web verdicts above are already in, and a native crash should be
      # visible without turning them red.
      - name: Compare the native captures with their boards
        id: native-diff
        if: always() && steps.native.outputs.present == 'true'
        continue-on-error: true
        run: |
          if [ -s "$E2E_OUT/insets.json" ]; then cut=(--insets "$E2E_OUT/insets.json"); else cut=(--profile phone-390); fi
          echo "cutting the bars with: ${cut[*]}"
          pnpm --filter @hg/design-diff exec node src/diff.mjs --no-strict "${cut[@]}" \
            --refs "$E2E_OUT/design-refs-native" --captures "$E2E_OUT/design-captures-native" --out "$E2E_OUT/design-diff-native"

      - name: Write the native report
        if: always() && steps.native.outputs.present == 'true'
        run: pnpm --filter @hg/design-diff exec node src/report.mjs --results "$E2E_OUT/design-diff-native" || true

      - name: Native summary
        if: always() && steps.native.outputs.present == 'true'
        run: node tools/design-diff/src/job-summary.mjs --results "$E2E_OUT/design-diff-native" --title "Design fidelity, native (customer, rider)" >>"$GITHUB_STEP_SUMMARY" || true

      - name: The native boards that are not passing, in words
        if: always() && steps.native.outputs.present == 'true'
        run: node tools/design-diff/src/findings.mjs --results "$E2E_OUT/design-diff-native" --out "$E2E_OUT/design-diff-native/findings.txt" || true

      - name: Write the report
        if: always()
        run: pnpm --filter @hg/design-diff exec node src/report.mjs --results "$E2E_OUT/design-diff" || true

      - name: Summary
        if: always()
        run: node tools/design-diff/src/job-summary.mjs --results "$E2E_OUT/design-diff" >>"$GITHUB_STEP_SUMMARY" || true

      # The same findings in the log, because the artifact is not reachable from everywhere: pulling
      # a 28 MB download to read four lines about one board has taken minutes and sometimes returned
      # nothing. `gh run view --log | grep <board>` answers in seconds, which is what makes a
      # board-by-board loop affordable.
      - name: The boards that are not passing, in words
        if: always()
        run: node tools/design-diff/src/findings.mjs --results "$E2E_OUT/design-diff" --out "$E2E_OUT/design-diff/findings.txt" || true

      # The pairs under 3 % with their images, as an artifact of their own. The full one holds every
      # pair's images and passed 900 MB at ~1,100 pairs (run 39818518993): over an hour to download
      # here, per run, so nobody could fix a nearly passing board and look at it again.
      - name: The pairs closest to passing, with their images
        if: always()
        run: node tools/design-diff/src/near.mjs --results "$E2E_OUT/design-diff" --out "$E2E_OUT/design-diff-near" --under 3 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: design-diff-near
          path: ${{ env.E2E_OUT }}/design-diff-near
          if-no-files-found: ignore
          retention-days: 14

      # The regression gate (#1034): the diff above runs with --no-strict, so this is the step that can
      # fail the job, and only when a board listed in tools/design-diff/passing.json, one that has
      # passed on main, is not PASS here. Boards newly passing are printed for adding to the list.
      # After the report steps, so a failing gate still leaves the verdicts and findings behind.
      - name: Boards that passed on main still pass
        run: node tools/design-diff/src/gate.mjs --results "$E2E_OUT/design-diff" --passing tools/design-diff/passing.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: design-diff
          path: |
            ${{ env.E2E_OUT }}/design-diff
            ${{ env.E2E_OUT }}/design-refs/manifest.json
            ${{ env.E2E_OUT }}/design-diff-native
            ${{ env.E2E_OUT }}/design-refs-native/manifest.json
          if-no-files-found: warn
          retention-days: 14
