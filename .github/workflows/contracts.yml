name: contracts

# The contract kit's guarantee: the client, the fixtures and the mock cannot drift from
# contracts/openapi.yaml, because every one of them is regenerated here and any difference
# fails the build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-kit:
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. `package.json` already pins
      # `packageManager: pnpm@10.33.0`, and action-setup@v4 refuses to start when
      # the version is declared in both places — it cannot tell which one you
      # meant, and a silent mismatch is how a lockfile gets rewritten by the
      # wrong pnpm. Leaving it out makes `packageManager` the single source, so
      # CI and a developer's machine resolve the same version by construction.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # GitHub's cache upload runs at home-upload speed on our runners, which keep
          # the pnpm store on disk anyway; cache only on GitHub's runners.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Self-hosted (#287): use the machine's python3 in a private venv, since
      # setup-python has no builds for the workstation's distro and system pip is managed.
      - if: runner.environment != 'github-hosted'
        name: python (self-hosted venv)
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - run: pip install pyyaml
      - run: pnpm install --frozen-lockfile

      # 1. The contract itself: refs resolve, operationIds are unique and camelCase, every
      #    operation declares x-roles and x-version, money is integer cents and never
      #    inbound outside the allowlist, ErrorCode is SCREAMING_SNAKE_CASE, no YAML-1.1
      #    truthy scalars, no unsatisfiable allOf.
      - name: validate contract
        run: pnpm validate:contract

      # 2. The generated client is exactly what the contract produces. A hand edit to
      #    packages/api-client/src/generated/** fails here.
      - name: client is not hand-edited
        run: pnpm generate:check

      # 3. The fixtures are exactly what the builder produces. A hand edit to
      #    contracts/fixtures/** fails here.
      - name: fixtures are not hand-edited
        run: |
          pnpm fixtures:build
          git diff --exit-code -- contracts/fixtures

      # 4. Every fixture still validates against its schema.
      - name: validate fixtures
        run: pnpm validate:fixtures

      - name: typecheck
        run: pnpm -r typecheck

      # 5. The mock actually boots and serves the contract.
      - name: mock server smoke test
        run: |
          pnpm mock &
          for i in $(seq 1 30); do
            curl -sf localhost:4010/__mock/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:4010/__mock/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf 'localhost:4010/v1/orders/any?scenario=order_arrived' | grep -q '"state":"ARRIVED"'
          curl -s localhost:4010/v1/definitely-not-a-route | grep -q 'NOT_FOUND'
