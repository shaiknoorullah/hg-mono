name: duplication

# Copied text drifts apart and goes stale. On a PR, a copied block (docs or code) that
# touches a changed file and is not in tools/duplication/baseline.json fails the check,
# with both places printed. Weekly, a full scan opens one issue per copied block that
# got past it. Thresholds and why: tools/duplication/check.mjs. Issue #122.
on:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: no new copied blocks in changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/duplication/check.mjs --base "origin/$BASE_REF"

  weekly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: file an issue per new copied block
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/duplication/check.mjs --all --file-issues
