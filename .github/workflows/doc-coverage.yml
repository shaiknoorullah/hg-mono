name: doc-coverage

# Every public thing has a doc: exported Go identifiers, package exports (TSDoc),
# API operations, make targets and package scripts. Items undocumented today are
# listed in tools/doc-coverage/baseline.json; only new ones fail. Coverage per area
# is written to the job summary.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — full scan, one issue per new finding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: tools/doc-coverage/godoc/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: install parsers
        run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix tools/doc-coverage typescript@5.9.3 yaml@2.9.0
      # On a PR only items in changed files fail; on main the whole tree is checked.
      - name: doc coverage
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node tools/doc-coverage/check.mjs --base "origin/$BASE_REF"
          else
            node tools/doc-coverage/check.mjs
          fi

  weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: tools/doc-coverage/godoc/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: install parsers
        run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix tools/doc-coverage typescript@5.9.3 yaml@2.9.0
      # Exit 1 with findings is expected here; a crash leaves no findings file and fails.
      - name: full scan
        run: node tools/doc-coverage/check.mjs --json "$RUNNER_TEMP/doc-findings.json" || test -s "$RUNNER_TEMP/doc-findings.json"
      - name: file issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/doc-coverage/file-issues.mjs "$RUNNER_TEMP/doc-findings.json"
