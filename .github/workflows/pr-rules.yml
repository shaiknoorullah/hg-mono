name: pr-rules

# CONTRIBUTING.md "Pull requests" — issue #40.
# The title's conventional prefix sets the one type label; changed paths set the
# app labels. Then the description is checked against its type's template.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labels:
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    # A fork's token cannot write labels; the check below still runs for forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: apply type + app labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          plan=$(node .github/scripts/pr-rules.mjs labels)
          echo "$plan"
          add=$(echo "$plan" | jq -r '.add | join(",")')
          remove=$(echo "$plan" | jq -r '.remove | join(",")')
          [ -n "$add" ] && gh pr edit "$PR" --add-label "$add"
          [ -n "$remove" ] && gh pr edit "$PR" --remove-label "$remove"
          true

  check:
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: description follows its type's template
        run: node .github/scripts/pr-rules.mjs check

  test:
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the checker's own tests
        run: node --test .github/scripts/pr-rules.test.mjs
