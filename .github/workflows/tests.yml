name: tests

# Lint and every unit-test suite, on every PR and on main. A failing test or a
# lint error anywhere in apps/, packages/ or services/hg fails the build. There
# is no baseline here on purpose: a known-failing test stays red until it is
# fixed, not hidden.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` — `packageManager` in package.json is the single source.
      # See contracts.yml for why.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # GitHub's cache upload runs at home-upload speed on our runners, which keep
          # the pnpm store on disk anyway; cache only on GitHub's runners.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      # Runs even when lint failed, so one PR shows both results. --no-bail runs
      # every package's suite and reports all failures, not just the first.
      - name: test
        if: ${{ !cancelled() }}
        run: pnpm -r --no-bail test

  go:
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: services/hg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/hg/go.mod
          cache-dependency-path: services/hg/go.sum
          # Our runners keep the Go caches on disk; uploading them to GitHub took over
          # 15 minutes per job. Cache only on GitHub's runners.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: vet
        run: make vet

      # Same as `make test` locally: tests that need HG_TEST_POSTGRES_DSN skip
      # when it is unset; the testcontainers-backed ones run here because the
      # runner has Docker.
      - name: test
        if: ${{ !cancelled() }}
        run: make test
