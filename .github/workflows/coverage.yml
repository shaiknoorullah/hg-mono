name: coverage

# Test coverage: measured on every PR, never allowed to drop, with fixed floors only
# where money and safety live. Issue: https://github.com/shaiknoorullah/hg-mono/issues/118
#
#   pull_request  every file the PR changes must stay at or above coverage/baseline.json,
#                 and every area in coverage/floors.json must stay at or above its floor.
#                 A coverage table is posted as one PR comment, updated on re-runs.
#   push to main  raise the baseline to today's numbers (never lower it) and open a PR
#                 with the new baseline when anything rose.
#   weekly        full scan of every baselined file and every floor; one issue per finding.
#
# Red tests do not stop coverage: suites run with `|| true` semantics (the script records
# the exit code and keeps going), and coverage is measured from whatever ran. Failing tests
# are the tests workflow's job (issue #42) — e.g. #96 and #105 are red on main today.
#
# Local: `pnpm coverage && pnpm coverage:check` (the git hook command, issue #43).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    permissions:
      contents: write # push the baseline branch (main only)
      pull-requests: write # the PR comment, and the baseline PR
      issues: write # weekly findings
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ratchet diffs against the PR base

      # Version comes from package.json `packageManager` (see contracts.yml for why).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/hg/go.mod
          cache-dependency-path: services/hg/go.sum

      - run: pnpm install --frozen-lockfile

      # Never fails on red tests; see the note at the top.
      - name: collect coverage (Go + JS)
        run: pnpm coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/.out/summary.json
          retention-days: 14

      # ---------------------------------------------------------------- pull request
      - name: ratchet and floors
        id: check
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm coverage:check --base "$BASE_SHA"

      - name: post the coverage table
        if: always() && github.event_name == 'pull_request' && steps.check.outcome != 'skipped'
        continue-on-error: true # fork PRs get a read-only token; the check above still gates
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          [ -f coverage/.out/report.md ] || exit 0
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-report -->")))][0].id // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@coverage/.out/report.md >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@coverage/.out/report.md >/dev/null
          fi

      # ---------------------------------------------------------------- push to main
      - name: raise the baseline
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pnpm coverage:update-baseline
          if git diff --quiet -- coverage/baseline.json; then
            echo "coverage did not rise; baseline unchanged"
            exit 0
          fi
          branch=ci/coverage-baseline
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add coverage/baseline.json
          git commit -m "ci: raise the coverage baseline" -m "Coverage rose on main; the ratchet baseline follows it up. Issue #118."
          git push --force origin "$branch"
          if [ -z "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            body=$(printf '%s\n' \
              '## What' 'Raise the coverage baseline to what main measures now.' '' \
              '## Issue' 'Part of #118' '' \
              '## Why now' 'Coverage rose on main; the ratchet only moves up.' '' \
              '## Links' '- https://github.com/shaiknoorullah/hg-mono/blob/main/coverage/baseline.json')
            gh pr create --repo "$REPO" --base main --head "$branch" \
              --title "ci: raise the coverage baseline" --body "$body"
          fi

      # ---------------------------------------------------------------- weekly scan
      - name: full scan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm coverage:check --all || true

      - name: file an issue per finding
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ -f coverage/.out/findings.json ] || exit 0
          n=$(jq length coverage/.out/findings.json)
          for i in $(seq 0 $((n - 1))); do
            title=$(jq -r ".[$i].title" coverage/.out/findings.json)
            body=$(jq -r ".[$i].body" coverage/.out/findings.json)
            if gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json title --jq '.[].title' \
                | grep -Fxq -- "$title"; then
              echo "already open: $title"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body" --label chore
            fi
          done
