name: doc-links

# Docs must not point at things that are gone (issue #120).
#
#  - lychee (lychee.toml): relative links and #anchors. Offline on pull requests; the weekly
#    scan also checks external links.
#  - tools/doc-refs/check.mjs: repo paths, `make` targets, `pnpm` scripts and HG_* variables a
#    doc names, and issues a doc calls open that are closed.
#
# Findings already in tools/doc-refs/baseline.json pass; only new ones fail. The weekly scan
# checks every doc and opens one issue per new finding.
on:
  pull_request:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      issues: read # issue state, for "#123 is still open" references
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: the checker's own tests
        run: node --test tools/doc-refs/check.test.mjs

      # Which docs to check: the ones this PR adds or edits. When the PR deletes or renames a
      # file, or changes what references resolve against (Makefile, package.json, Go config,
      # the example env), every doc is checked — the broken reference is then in a doc the PR
      # did not touch. File names are read NUL-separated and never interpolated.
      - name: scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-docs.txt"
          docs="$RUNNER_TEMP/docs.txt"
          : > "$changed"
          widen=false
          while IFS= read -r -d '' status && IFS= read -r -d '' file; do
            case "$status" in
              R*|C*) IFS= read -r -d '' file ;;
            esac
            case "$status" in D*|R*) widen=true ;; esac
            case "$file" in
              services/hg/Makefile|package.json|*/package.json|services/hg/*.go|deploy/.env.example|lychee.toml|tools/doc-refs/*) widen=true ;;
            esac
            [ "${status:0:1}" = D ] && continue
            case "$file" in
              .claude/skills/*|*/node_modules/*) ;;
              *.md|docs/*.html) printf '%s\n' "$file" >> "$changed" ;;
            esac
          done < <(git diff -z --name-status -M "$BASE_SHA"...HEAD)
          if [ "$widen" = true ]; then
            git ls-files -- '*.md' 'docs/**/*.html' | grep -v -e '^\.claude/skills/' -e '/node_modules/' > "$docs" || true
          else
            cp "$changed" "$docs"
          fi
          echo "widen=$widen" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < "$docs")" >> "$GITHUB_OUTPUT"
          echo "checking $(wc -l < "$docs") doc(s) (changed: $(wc -l < "$changed"), widened: $widen)"

      - name: links and anchors (lychee, offline)
        if: steps.scope.outputs.count != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # The action evals `args`: keep it static. Inputs come from a file, not the command line.
          args: --config lychee.toml --offline --root-dir ${{ github.workspace }} --files-from ${{ runner.temp }}/docs.txt
          format: json
          output: ${{ runner.temp }}/lychee.json
          checkbox: false
          fail: false # the baseline decides, below
          failIfEmpty: false
          jobSummary: false

      - name: stale references + baseline
        if: steps.scope.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node tools/doc-refs/check.mjs
          --files-from "$RUNNER_TEMP/docs.txt"
          --issue-files-from "$RUNNER_TEMP/changed-docs.txt"
          --lychee "$RUNNER_TEMP/lychee.json"

  weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      issues: write # one issue per new finding
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: every doc
        run: |
          git ls-files -- '*.md' 'docs/**/*.html' | grep -v -e '^\.claude/skills/' -e '/node_modules/' > "$RUNNER_TEMP/docs.txt"
          wc -l < "$RUNNER_TEMP/docs.txt"

      - name: links, anchors and external links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }} --files-from ${{ runner.temp }}/docs.txt
          format: json
          output: ${{ runner.temp }}/lychee.json
          checkbox: false
          fail: false
          failIfEmpty: false
          jobSummary: false

      - name: stale references, then file an issue per new finding
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node tools/doc-refs/check.mjs
          --files-from "$RUNNER_TEMP/docs.txt"
          --lychee "$RUNNER_TEMP/lychee.json"
          --file-issues
