name: doc-sanitise

# Issue #121. Docs (docs/**, root *.md, apps/*/README*) are checked for wording
# (Vale, HalalGoes style: the name, halal claims, emoji, spelling) and bare
# internal codes; the whole repo is checked for secrets (gitleaks). On a PR only
# the changed docs and the PR's own commits are checked, and only problems not
# in the committed baseline (.github/doc-sanitise/) fail. Weekly, a full scan
# opens an issue per problem that is not in the baseline.
on:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-sanitise-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks reads the PR's commits; the diff needs the base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vale and gitleaks: pinned, downloaded and SHA-256-checked by the script
      # (TOOLS in doc-sanitise.mjs). Cached so each run does not fetch them again.
      - if: runner.environment == 'github-hosted' # our runners keep this folder on disk
        uses: actions/cache@v4
        with:
          path: ~/.cache/hg-doc-sanitise
          key: hg-tools-vale-3.23.0-gitleaks-8.30.1-${{ runner.os }}-${{ runner.arch }}
      - name: changed docs and the PR's commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/doc-sanitise.mjs check --base "origin/$BASE_REF"

  test:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the checker's own tests
        run: node --test .github/scripts/doc-sanitise.test.mjs

  weekly:
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.HG_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vale and gitleaks: pinned, downloaded and SHA-256-checked by the script
      # (TOOLS in doc-sanitise.mjs). Cached so each run does not fetch them again.
      - if: runner.environment == 'github-hosted' # our runners keep this folder on disk
        uses: actions/cache@v4
        with:
          path: ~/.cache/hg-doc-sanitise
          key: hg-tools-vale-3.23.0-gitleaks-8.30.1-${{ runner.os }}-${{ runner.arch }}
      - name: full scan
        id: scan
        continue-on-error: true
        run: node .github/scripts/doc-sanitise.mjs check --all --json "$RUNNER_TEMP/doc-sanitise.json"
      - name: one issue per problem not in the baseline
        if: steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s "$RUNNER_TEMP/doc-sanitise.json" || { echo "scan failed before writing findings"; exit 1; }
          node .github/scripts/doc-sanitise.mjs issues --json "$RUNNER_TEMP/doc-sanitise.json"
